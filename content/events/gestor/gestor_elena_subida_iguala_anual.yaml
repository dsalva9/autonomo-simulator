schema_version: 1
id: gestor_elena_subida_iguala_anual
category: gestor
title: "Elena actualiza tarifas por nueva carga normativa"
body: "El despacho de Elena Montes comunica una revisión de honorarios ante la avalancha de obligaciones digitales. Te ofrece sumar defensa integral ante requerimientos, pactar entregas tempranas o rescindir sin cargos."
tags:
  - gestoria
  - elena
  - honorarios
character_id: gestor_premium_elena
character_expression: stressed
requirements:
  min_month: 10
  months_of_year:
    - 1
    - 2
  gestor_tiers:
    - premium
weight: 12
cooldown_months: 10
max_occurrences: 3
exclusive_with: []
choices:
  - id: pactar_descuento_por_orden_estricto
    label: "Congelar la subida subiendo tus facturas ordenadas el día uno"
    result_text: "Elena acepta mantenerte la tarifa si entregas todo masticado el primer lunes de mes: ahorras dinero a cambio de disciplina marcial."
    effects:
      stress: 5
      moral: 3
      personal_life: -3
      fiscal_risk: -5
  - id: aceptar_anexo_defensa_integral
    label: "Suscribir el anexo de blindaje total ante comprobaciones (175 €)"
    requirements:
      stats:
        money:
          min: 300
    result_text: "Pagas un suplemento deducible, pero cualquier carta certificada pasa directa a su mesa jurídica sin quitarte ni media hora de sueño."
