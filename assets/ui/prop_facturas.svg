<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Pila de facturas y Modelo 303">
  <!-- Subtle Ground Shadow -->
  <ellipse cx="128" cy="224" rx="88" ry="16" fill="#1F2421" opacity="0.18" />

  <!-- Bottom Sheet (Pink Carbon Copy) -->
  <g transform="translate(42, 68) rotate(-8)">
    <rect x="0" y="0" width="156" height="148" rx="5" fill="#F7C7C3" stroke="#1F2421" stroke-width="3" />
    <line x1="18" y1="128" x2="132" y2="128" stroke="#C83E37" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Middle Sheet (Yellow Duplicate Copy) -->
  <g transform="translate(54, 56) rotate(6)">
    <rect x="0" y="0" width="156" height="148" rx="5" fill="#FCE592" stroke="#1F2421" stroke-width="3" />
    <!-- Sticky Red Urgent Tab on Right Edge -->
    <rect x="148" y="28" width="24" height="22" rx="3" fill="#C83E37" stroke="#1F2421" stroke-width="2.5" />
  </g>

  <!-- Top Sheet: Modelo 303 Form -->
  <g transform="translate(46, 36) rotate(-2)">
    <rect x="0" y="0" width="160" height="168" rx="6" fill="#FFFDF8" stroke="#1F2421" stroke-width="3.5" />

    <!-- Official Form Header -->
    <rect x="12" y="14" width="136" height="28" rx="3" fill="#C83E37" stroke="#1F2421" stroke-width="2" />
    <text x="80" y="33" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#FFFDF8">MODELO 303</text>

    <!-- Subheader -->
    <text x="14" y="58" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#2B302C">IVA · AUTOLIQUIDACIÓN</text>

    <!-- Ledger Boxes -->
    <rect x="14" y="68" width="132" height="20" rx="2" fill="#F2ECE1" stroke="#1F2421" stroke-width="1.8" />
    <line x1="94" y1="68" x2="94" y2="88" stroke="#1F2421" stroke-width="1.8" />
    <line x1="22" y1="78" x2="78" y2="78" stroke="#6E7781" stroke-width="2.5" stroke-linecap="round" />
    <text x="140" y="82" text-anchor="end" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#1F2421">+21%</text>

    <rect x="14" y="94" width="132" height="20" rx="2" fill="#F2ECE1" stroke="#1F2421" stroke-width="1.8" />
    <line x1="94" y1="94" x2="94" y2="114" stroke="#1F2421" stroke-width="1.8" />
    <line x1="22" y1="104" x2="70" y2="104" stroke="#6E7781" stroke-width="2.5" stroke-linecap="round" />
    <text x="140" y="108" text-anchor="end" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#1F2421">-15%</text>

    <!-- Total Due Box -->
    <rect x="14" y="124" width="132" height="28" rx="3" fill="#FCE592" stroke="#1F2421" stroke-width="2.2" />
    <text x="22" y="142" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1F2421">A INGRESAR:</text>
    <text x="138" y="143" text-anchor="end" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#C83E37">€€€</text>

    <!-- Metal Paperclip at Top Left -->
    <path d="M 28 -6 L 28 24 A 7 7 0 0 0 42 24 L 42 2 A 4 4 0 0 0 34 2 L 34 20" fill="none" stroke="#5A6570" stroke-width="3.2" stroke-linecap="round" />
  </g>
</svg>
