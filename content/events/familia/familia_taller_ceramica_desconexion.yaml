    result_text: "Tus primeros tazones parecen ceniceros prehistóricos, pero esas dos horas semanales sin notificaciones te resetean el cerebro."
    effects:
      cash_delta: -95
      stress: -12
      moral: 9
      personal_life: 12
      add_modifier:
        id: mod_taller_analogico
        label: "Martes de taller sin pantallas"
