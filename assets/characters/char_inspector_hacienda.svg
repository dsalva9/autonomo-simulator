<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Inspector de Hacienda">
  <defs>
    <linearGradient id="hacPortBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE2E8" />
      <stop offset="100%" stop-color="#A8B4C0" />
    </linearGradient>
    <clipPath id="hacFrameClip">
      <rect x="20" y="20" width="472" height="472" rx="28" />
    </clipPath>
  </defs>

  <!-- Portrait Frame -->
  <rect x="20" y="20" width="472" height="472" rx="28" fill="url(#hacPortBg)" stroke="#1F2421" stroke-width="6" />

  <g clip-path="url(#hacFrameClip)">
    <!-- Strict Red/Slate Bureaucratic Seal Circle -->
    <circle cx="256" cy="236" r="172" fill="#EFE6E4" opacity="0.7" />
    <circle cx="256" cy="236" r="154" fill="none" stroke="#9E2A25" stroke-width="3" />
    <circle cx="256" cy="236" r="144" fill="none" stroke="#9E2A25" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Sharp Charcoal Suit Shoulders -->
    <path d="M 78 500 L 106 368 L 256 346 L 406 368 L 434 500 Z" fill="#2B3138" stroke="#1F2421" stroke-width="5" stroke-linejoin="round" />

    <!-- Crisp White Shirt V & Burgundy Tie -->
    <polygon points="214,350 298,350 256,464" fill="#F8FAFC" stroke="#1F2421" stroke-width="4" />
    <polygon points="244,362 268,362 274,452 256,476 238,452" fill="#9E2A25" stroke="#1F2421" stroke-width="3.5" />
    <polygon points="240,352 272,352 266,370 246,370" fill="#7A1D19" stroke="#1F2421" stroke-width="3.5" />
    <!-- Suit Lapels & Official Pin -->
    <polygon points="214,350 168,392 238,468" fill="#373F47" stroke="#1F2421" stroke-width="4" stroke-linejoin="round" />
    <polygon points="298,350 344,392 274,468" fill="#373F47" stroke="#1F2421" stroke-width="4" stroke-linejoin="round" />
    <circle cx="310" cy="404" r="6" fill="#E8B838" stroke="#1F2421" stroke-width="2" />

    <!-- Neck -->
    <rect x="230" y="302" width="52" height="56" rx="16" fill="#E6C9B8" stroke="#1F2421" stroke-width="4.5" />

    <!-- Ears -->
    <ellipse cx="176" cy="226" rx="15" ry="25" fill="#E6C9B8" stroke="#1F2421" stroke-width="4.5" />
    <ellipse cx="336" cy="226" rx="15" ry="25" fill="#E6C9B8" stroke="#1F2421" stroke-width="4.5" />

    <!-- Angular Tall Head Silhouette -->
    <path d="M 182 146 C 182 102 330 102 330 146 L 326 268 C 324 308 288 332 256 332 C 224 332 188 308 186 268 Z" fill="#F0D5C5" stroke="#1F2421" stroke-width="5" />

    <!-- Neat Side-Parted Salt-and-Pepper Hair -->
    <path d="M 178 182 C 174 118 206 92 260 92 C 314 92 338 118 334 182 C 326 146 302 132 240 134 C 206 136 188 154 178 182 Z" fill="#464E56" stroke="#1F2421" stroke-width="4.5" />
    <!-- Silver Temple Streaks -->
    <path d="M 180 162 L 194 156" stroke="#BCC5CE" stroke-width="5" stroke-linecap="round" />
    <path d="M 332 162 L 318 156" stroke="#BCC5CE" stroke-width="5" stroke-linecap="round" />

    <!-- Stern Asymmetrical Eyebrows (Right Raised in Skepticism) -->
    <line x1="196" y1="184" x2="242" y2="190" stroke="#2B3138" stroke-width="6" stroke-linecap="round" />
    <path d="M 270 186 Q 296 168 318 180" fill="none" stroke="#2B3138" stroke-width="6" stroke-linecap="round" />

    <!-- Thick Rectangular Glasses with Cold White Lens Glint -->
    <rect x="190" y="196" width="58" height="36" rx="4" fill="#E8F3F8" fill-opacity="0.82" stroke="#1F2421" stroke-width="5" />
    <rect x="264" y="196" width="58" height="36" rx="4" fill="#E8F3F8" fill-opacity="0.82" stroke="#1F2421" stroke-width="5" />
    <line x1="248" y1="208" x2="264" y2="208" stroke="#1F2421" stroke-width="5" />
    <!-- Sharp Watchful Eyes + Reflection Slash -->
    <circle cx="220" cy="214" r="5" fill="#1F2421" />
    <circle cx="292" cy="214" r="5" fill="#1F2421" />
    <line x1="198" y1="224" x2="212" y2="202" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="272" y1="224" x2="286" y2="202" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Long Aquiline Nose -->
    <path d="M 256 206 L 250 254 L 266 256" fill="none" stroke="#1F2421" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Deadpan Unimpressed Mouth + Nasolabial Creases -->
    <line x1="226" y1="286" x2="286" y2="284" stroke="#1F2421" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 216 272 Q 212 286 218 294" fill="none" stroke="#B69988" stroke-width="3" stroke-linecap="round" />
    <path d="M 296 272 Q 300 286 294 294" fill="none" stroke="#B69988" stroke-width="3" stroke-linecap="round" />

    <!-- Official Red Inspection Folder Held in Corner -->
    <g transform="translate(318, 376) rotate(-8)">
      <rect x="0" y="0" width="134" height="128" rx="6" fill="#9E2A25" stroke="#1F2421" stroke-width="4.5" />
      <rect x="16" y="18" width="102" height="32" rx="3" fill="#FFFDF8" stroke="#1F2421" stroke-width="2.5" />
      <text x="67" y="39" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#9E2A25">ACTA INSP.</text>
    </g>
  </g>

  <!-- Corner Role Stamp -->
  <rect x="34" y="34" width="136" height="30" rx="6" fill="#9E2A25" />
  <text x="102" y="54" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#FFFDF8" letter-spacing="1.2">HACIENDA</text>
</svg>
