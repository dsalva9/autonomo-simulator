"familia_vacaciones_agosto_cerrado.choices.quedarse_de_guardia_en_agosto.result_text": "You snag two orphan gigs while the pavement melts outside and Álex packs a suitcase with a sad half-smile."

# 39. familia_verano_pueblo_sin_wifi
"familia_verano_pueblo_sin_wifi.title": "Idyllic Village Remote Work and Zero Bars of Signal"
"familia_verano_pueblo_sin_wifi.body": "You decamp to the family village house for a summer week dreaming of cool stone rooms and focus. Sadly, meter-thick walls block 4G cold, leaving one lonely signal bar beside the town fountain at 38 degrees."
"familia_verano_pueblo_sin_wifi.choices.asumir_vacaciones_reales_pueblo.label": "Surrender to physics, shut the laptop, and enjoy the village fiesta"
"familia_verano_pueblo_sin_wifi.choices.asumir_vacaciones_reales_pueblo.result_text": "You trade frozen video calls for shuttered afternoon naps and real tomatoes, returning to town brand new."
"familia_verano_pueblo_sin_wifi.choices.comprar_antena_router_portatil.label": "Drive to the county town for a portable 4G router and SIM (145 €)"
"familia_verano_pueblo_sin_wifi.choices.comprar_antena_router_portatil.result_text": "Perched on the highest windowsill, the router saves your deliveries amid aromas of woodsmoke and omelette."
