schema_version: 1
id: gestor_oferta_servicios
category: gestor
title: "El dilema de la gestoría"
body: "Tu mesa acumula recibos arrugados y avisos fiscales. Paco «El Rápido» ofrece llevarte los papeles a precio de menú del día, Elena Montes propone su blindaje quirúrgico, o puedes seguir peleándote a solas con la sede electrónica."
tags:
  - gestoria
  - impuestos
  - costes_fijos
character_id: null
illustration_id: null
requirements:
  gestor_tiers:
    - self
weight: 10
cooldown_months: 12
max_occurrences: 3
exclusive_with: []
choices:
  - id: seguir_autogestion
    label: "Llevar yo mis propias cuentas a pelo (0 €/mes)"
    result_text: "Decides ahorrarte la iguala mensual y enfrentarte en solitario a los formularios oficiales. Lo que te ahorras en euros lo inviertes en carácter."
    effects:
      stress: 4
      moral: -1
  - id: contratar_paco_barato
    label: "Confiar los papeles a Paco «El Rápido» (60 €/mes)"
    result_text: "Paco te mete en una carpeta de anillas con olor a churrería y te contesta con un pulgar arriba. No es la NASA, pero ya no estás completamente solo ante el trimestre."
    effects:
      set_gestor:
        tier: cheap
        character_id: gestor_barato_paco
      deductible_expense: 40
      stress: -5
      moral: 2
  - id: contratar_elena_premium
    label: "Pasarse al despacho de Elena Montes (170 €/mes)"
    requirements:
      stats:
        money:
          min: 250
    result_text: "Elena te abre un portal documental con alertas automáticas y revisión preventiva. Tu cuenta nota el mordisco mensual, pero tu tensión arterial baja de golpe."
    effects:
      set_gestor:
        tier: premium
        character_id: gestor_premium_elena
      deductible_expense: 120
      stress: -10
      moral: 4
      fiscal_risk: -8
