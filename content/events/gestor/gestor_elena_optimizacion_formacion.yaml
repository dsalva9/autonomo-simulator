    label: Aplicar solo las facturas ya emitidas sin desembolsar nada extra
    result_text: Elena reclasifica tus cursos del semestre con pulcritud y te deja el próximo trimestre más ligero sin tocar tu liquidez actual.
    effects:
      stress: -4
      moral: 3
      fiscal_risk: -6
