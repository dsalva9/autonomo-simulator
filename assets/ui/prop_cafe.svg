  <ellipse cx="118" cy="200" rx="46" ry="9" fill="#D5C6AC" stroke="#1F2421" stroke-width="2" />

  <!-- Rising Steam Wisps -->
  <path d="M 92 84 C 78 66 106 50 92 28" fill="none" stroke="#FFFDF8" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 92 84 C 78 66 106 50 92 28" fill="none" stroke="#1F2421" stroke-width="2.5" stroke-linecap="round" />

  <path d="M 120 76 C 106 56 136 38 120 16" fill="none" stroke="#FFFDF8" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 120 76 C 106 56 136 38 120 16" fill="none" stroke="#1F2421" stroke-width="2.5" stroke-linecap="round" />

  <path d="M 148 86 C 136 68 160 54 148 34" fill="none" stroke="#FFFDF8" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <path d="M 148 86 C 136 68 160 54 148 34" fill="none" stroke="#1F2421" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mug Handle -->
  <path d="M 168 118 C 210 118 210 176 164 176" fill="none" stroke="#1F2421" stroke-width="18" stroke-linecap="round" />
  <path d="M 168 118 C 210 118 210 176 164 176" fill="none" stroke="#D96B43" stroke-width="11" stroke-linecap="round" />

