schema_version: 1
id: gestor_auditoria_preventiva_veterano
category: gestor
title: "Cinco años de libros: barrido preventivo antes de cierre"
body: Tras media década facturando sin tregua, acumulas decenas de modelos trimestrales, cambios de criterio y clientes diversos. Un barrido preventivo de los últimos cuatro ejercicios no prescritos puede ahorrarte sustos.
tags:
  - gestoria
  - auditoria
  - veterania
  - largo_plazo
requirements:
  min_month: 60
weight: 12
cooldown_months: 24
max_occurrences: 2
exclusive_with: []
choices:
  - id: confiar_en_el_reloj_de_prescripcion
    label: No levantar alfombras antiguas y esperar a que prescriban solas
    result_text: No gastas ni un euro en arqueología contable hoy, cruzando los dedos cada vez que llega un aviso certificado al buzón.
    effects:
      stress: -2
      personal_life: 2
      fiscal_risk: 10
      schedule_events:
        - event_id: hacienda_inspeccion_borde_prescripcion
          delay_months: 40
          probability: 0.3
          priority: high
  - id: contratar_auditoria_cuatro_anos
    label: Encargar auditoría preventiva de los años no prescritos (1.400 €)
    requirements:
      stats:
        money:
          min: 1800
    result_text: Detectas y corriges dos descuadres menores de hace tres veranos, blindando tu historial justo cuando más patrimonio proteges.
    effects:
      deductible_expense: 1400
      stress: -8
      moral: 5
      reputation: 3
      fiscal_risk: -14
  - id: dar_salto_estable_a_elena
    label: Contratar el blindaje de Elena Montes (desde 260 €/mes)
    requirements:
      gestor_tiers:
        - self
        - cheap
      stats:
        money:
          min: 450
    result_text: Pasas tus carpetas históricas al despacho de Elena y encaras la etapa veterana con una coraza fiscal de primer nivel.
    effects:
      set_gestor:
        tier: premium
        character_id: gestor_premium_elena
      deductible_expense: 210
      stress: -10
      moral: 6
      fiscal_risk: -15
  - id: auditoria_gratuita_expediente_impecable
    label: Pasar revisión exprés de cortesía por llevar cuatro años limpios (120 €)
    requirements:
      stats:
        fiscal_risk:
          max: 12
    result_text: "Tus libros de cuatro años están tan ordenados que el auditor acaba en media hora: sello limpio por 120 € deducibles y tranquilidad total."
    effects:
      deductible_expense: 120
      moral: 8
      stress: -10
      fiscal_risk: -12
