schema_version: 1
id: clientes_pago_sin_factura
category: clientes
title: ¿Con IVA o... nos arreglamos?
body: "Borja aparece un viernes a última hora con un encargo «súper sencillo» para el lunes. Te guiña un ojo y baja la voz: «Si nos ahorramos el papeleo, te doy el sobre en mano el domingo y aquí paz y después gloria»."
tags:
  - dinero_b
  - dilema_fiscal
  - fin_de_semana
character_id: cliente_regateador
character_expression: pleased
illustration_id: null
weight: 9
cooldown_months: 9
max_occurrences: 4
exclusive_with: []
choices:
  - id: exigir_factura_legal
    label: Con factura, IVA y retención, como manda el BOE
    result_text: Borja resopla como si le hubieras pedido un riñón, pero acaba firmando el presupuesto oficial. Apartas lo del trimestre y duermes con la conciencia cristalina.
    effects:
      billed_income: 1400
      moral: 4
      stress: 3
      reputation: 4
      fiscal_risk: -3
  - id: aceptar_sobre_en_b
    label: Aceptar el sobre «sin papeles» y pringar el finde
    outcomes:
      - id: cobro_limpio
        weight: 75
        result_text: El domingo por la noche recibes un sobre de panadería con billetes arrugados. Liquidez inmediata lejos del trimestre, aunque cada furgoneta blanca aparcada en tu calle te sube las pulsaciones.
        effects:
          cash_delta: 2800
          stress: 5
          moral: -1
          personal_life: -3
          fiscal_risk: 20
          set_flags:
            - cobro_en_b_reciente
          schedule_events:
            - event_id: hacienda_inspeccion_efectivo_tres_anos
              delay_months: 30
              probability: 0.35
              priority: high
            - event_id: clientes_cliente_en_b_extorsion_tardia
              delay_months: 20
              probability: 0.2
              priority: high
      - id: regateo_ultima_hora
        weight: 25
        result_text: "Al entregar el encargo, Borja recorta el sobre a 2.100 € con sonrisa de tiburón: «Como te ahorras impuestos, salimos ganando». Sigue siendo dinero limpio, pero sin papel donde reclamar."
        effects:
          cash_delta: 2100
          stress: 9
          moral: -4
          personal_life: -3
          fiscal_risk: 20
          set_flags:
            - cobro_en_b_reciente
          schedule_events:
            - event_id: hacienda_inspeccion_efectivo_tres_anos
              delay_months: 30
              probability: 0.35
              priority: high
            - event_id: clientes_cliente_en_b_extorsion_tardia
              delay_months: 20
              probability: 0.2
              priority: high
  - id: declinar_encargo
    label: Rechazar el marrón y salvar tu fin de semana
    result_text: Le deseas mucha suerte encontrando a otro incauto un viernes a las ocho de la tarde. Cierras el portátil y recuperas la fe en el descanso dominical.
    effects:
      stress: -7
      moral: 3
      personal_life: 5
      reputation: -2
  - id: subir_tarifa_blanca_por_reputacion
    label: Imponer tu tarifa blanca sénior con factura íntegra (2.100 €)
    requirements:
      stats:
        reputation:
          min: 60
        fiscal_risk:
          max: 15
    result_text: "Tu marca impoluta no acepta regateos en B: Borja necesita tu firma y paga 2.100 € con IVA y retención sin rechistar."
    effects:
      billed_income: 2100
      moral: 6
      stress: 2
      reputation: 5
      fiscal_risk: -4
