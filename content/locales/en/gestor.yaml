gestor_migracion_verifactu_caos.choices.suscribir_programa_comercial_nube.label: "Subscribe to certified cloud billing software and migrate this weekend"
gestor_migracion_verifactu_caos.choices.suscribir_programa_comercial_nube.result_text: "You add one more monthly SaaS fee to the freelancer backpack, but Monday morning you can bill without cold sweats."
gestor_migracion_verifactu_caos.choices.picar_facturas_formulario_publico.label: "Save license fees by typing every invoice into the free public portal"
gestor_migracion_verifactu_caos.choices.picar_facturas_formulario_publico.outcomes.paciencia_infinita_sin_gasto.result_text: "Each invoice takes twenty full minutes of digital signatures and captchas, yet you spend zero euros on new software."
gestor_migracion_verifactu_caos.choices.picar_facturas_formulario_publico.outcomes.salto_numeracion_y_rectificativas.result_text: "The browser crashes mid-submission, breaking your invoice sequence and forcing an urgent support bill to untangle it."

# 19. gestor_milagro_barato_paco
gestor_milagro_barato_paco.title: "The Unexpected Miracle of Paco «Fast-Hands»"
gestor_milagro_barato_paco.body: "Never underestimate a neighborhood accountant who has shared morning coffee with the registry clerk since 1996: Paco tips you off to a regional freelancer modernization grant closing today at 2:00 PM."
gestor_milagro_barato_paco.choices.tramitar_subvencion_relampago.label: "Pay him 50 € for rush filing and sign the grant form on the fly"
gestor_milagro_barato_paco.choices.tramitar_subvencion_relampago.outcomes.concesion_aprobada.result_text: "Paco nails every stamped form at the buzzer and weeks later clean grant cash lands in your account. Churros are on you."
gestor_milagro_barato_paco.choices.tramitar_subvencion_relampago.outcomes.cupo_agotado_por_segundos.result_text: "Grant funds run dry three minutes before your timestamp, though at least Paco's rush handling fee is tax-deductible."
gestor_milagro_barato_paco.choices.reclamar_comisiones_indebidas.label: "Skip grants and ask him to reclaim unfair bank maintenance fees"
gestor_milagro_barato_paco.choices.reclamar_comisiones_indebidas.result_text: "Armed with a battle-tested two-paragraph letter, Paco gets your bank to refund overcharged account maintenance fees."
gestor_milagro_barato_paco.choices.dejarlo_pasar_sin_estres.label: "Thank him for the tip but skip last-minute bureaucracy"
gestor_milagro_barato_paco.choices.dejarlo_pasar_sin_estres.result_text: "You carry on with your workday in peace without chasing registry windows."

# 20. gestor_oferta_servicios
gestor_oferta_servicios.title: "The Bookkeeping Dilemma"
gestor_oferta_servicios.body: "Crumpled receipts and tax deadline alerts pile up on your desk. Paco «Fast-Hands» offers bargain-menu bookkeeping, Elena Montes pitches surgical tax armor, or you can keep wrestling the tax portal solo."
gestor_oferta_servicios.choices.contratar_paco_barato.label: "Hand your folders to Paco «Fast-Hands» (60 €/mo)"
gestor_oferta_servicios.choices.contratar_paco_barato.result_text: "Paco clips your receipts into a binder smelling faintly of churros and replies with a thumbs-up. At least you are not alone."
gestor_oferta_servicios.choices.contratar_elena_premium.label: "Retain Elena Montes's advisory firm (180 €/mo)"
gestor_oferta_servicios.choices.contratar_elena_premium.result_text: "Elena sets up a document portal with automated alerts and pre-audits. The monthly fee bites, but your blood pressure drops."
gestor_oferta_servicios.choices.seguir_autogestion.label: "Run my own tax filings bare-knuckled (0 €/mo)"
gestor_oferta_servicios.choices.seguir_autogestion.result_text: "You skip the monthly retainer and face official tax forms alone. Whatever you save in euros, you build in character."

# 21. gestor_paco_audio_cuatro_minutos
gestor_paco_audio_cuatro_minutos.title: "Paco's Four-Minute Voice Note Explaining Nothing"
gestor_paco_audio_cuatro_minutos.body: "You ask Paco whether an EU client invoice carries VAT or reverse-charge rules. He replies with a four-minute WhatsApp audio full of clinking spoons, two coughs, and «just bill it normal, champ, nobody checks»."
gestor_paco_audio_cuatro_minutos.choices.pagar_microconsulta_intracomunitaria.label: "Pay a cross-border VAT specialist for a one-off consult (110 €)"
gestor_paco_audio_cuatro_minutos.choices.pagar_microconsulta_intracomunitaria.result_text: "You register properly on the EU intra-community VIES census as required by law and issue a spotless European invoice."
gestor_paco_audio_cuatro_minutos.choices.descifrar_normativa_por_tu_cuenta.label: "Play the audio at 2x speed and research the VAT rules yourself"
gestor_paco_audio_cuatro_minutos.choices.descifrar_normativa_por_tu_cuenta.result_text: "You lose half an afternoon combing official tax manuals, but you send out a compliant invoice despite your own accountant."
gestor_paco_audio_cuatro_minutos.choices.facturar_como_dice_paco_sin_mirar.label: "Follow Paco blindly, slap domestic VAT on it, and hit send"
gestor_paco_audio_cuatro_minutos.choices.facturar_como_dice_paco_sin_mirar.result_text: "The client's finance department bounces the invoice back in disbelief and the sloppy filing leaves a mark."

# 22. gestor_paco_caja_zapatos_tickets
gestor_paco_caja_zapatos_tickets.title: "Paco's Shoebox of Thermal Receipts Turned Blank"
gestor_paco_caja_zapatos_tickets.body: "Paco stored your shoebox of client-lunch and parking receipts right on top of his office radiator. The heat bleached the thermal paper snow-white, erasing every amount and tax ID across the pile."
gestor_paco_caja_zapatos_tickets.choices.reclamar_facturas_nominativas_locales.label: "Call every venue with card statements to request full invoices"
gestor_paco_caja_zapatos_tickets.choices.reclamar_facturas_nominativas_locales.result_text: "Phone persistence rescues two-thirds of the itemized invoices, and you make Paco scan every PDF while you watch."
gestor_paco_caja_zapatos_tickets.choices.renunciar_a_tickets_borrados.label: "Toss the blank slips and claim only legible invoices"
gestor_paco_caja_zapatos_tickets.choices.renunciar_a_tickets_borrados.result_text: "You pay extra tax thanks to Paco's radiator, but you sleep soundly knowing zero phantom receipts sit in your return."
gestor_paco_caja_zapatos_tickets.choices.meter_cifra_redonda_estimada.label: "Take Paco's cue and plug a round «estimated» expense figure"
gestor_paco_caja_zapatos_tickets.choices.meter_cifra_redonda_estimada.result_text: "You shave a tidy sum off today's tax bill, though if an auditor asks for proof you will be holding up blank confetti."

# 23. gestor_paco_espantada_benidorm
gestor_paco_espantada_benidorm.title: "April 19th and Paco Posts Beach Selfies in Benidorm"
gestor_paco_espantada_benidorm.body: "Twenty-four hours remain before Q1 taxes close and your forms sit unfiled. Paco's WhatsApp status shows him holding sangria in Benidorm while his nephew Kevin minds the office keys and your signature token."
gestor_paco_espantada_benidorm.choices.contratar_presentacion_urgente_externa.label: "Pay a serious rival agency for emergency same-day filing (155 €)"
gestor_paco_espantada_benidorm.choices.contratar_presentacion_urgente_externa.result_text: "Another firm rescues your books in two hours, files cleanly, and you text Paco the receipt mid-sangria."
gestor_paco_espantada_benidorm.choices.guiar_al_sobrino_por_videollamada.label: "Jump on a video call with nephew Kevin and dictate box by box"
gestor_paco_espantada_benidorm.choices.guiar_al_sobrino_por_videollamada.outcomes.kevin_sorprende_y_acierta.result_text: "Turns out Kevin handles web portals better than his uncle: you file in ten minutes and even get a neatly named PDF."
gestor_paco_espantada_benidorm.choices.guiar_al_sobrino_por_videollamada.outcomes.kevin_marca_casilla_equivocada.result_text: "Kevin swaps input and output VAT amid nervous laughter, costing you a small corrective payment to clean up the mess."
gestor_paco_espantada_benidorm.choices.revocar_autorizacion_y_volver_solo.label: "Dump Paco today and submit the return with your own certificate"
gestor_paco_espantada_benidorm.choices.revocar_autorizacion_y_volver_solo.result_text: "You cancel his direct debit on the spot: if someone is funding beach trips on April 19th, it will not be you."

# 24. gestor_paco_jubilacion_sobrino_kevin
gestor_paco_jubilacion_sobrino_kevin.title: "Paco Hints at Semi-Retirement and Hands You Kevin"
gestor_paco_jubilacion_sobrino_kevin.body: "Years down the road, Paco trims his morning hours and delegates your veteran ledger to his nephew Kevin, who promises to modernize the office using spreadsheet templates from viral finance clips."
gestor_paco_jubilacion_sobrino_kevin.choices.pagar_plus_atencion_directa_paco.label: "Pay a senior supplement so Paco signs your books himself (145 €)"
gestor_paco_jubilacion_sobrino_kevin.choices.pagar_plus_atencion_directa_paco.result_text: "Paco locks your binder in his personal desk drawer and reviews every quarter himself before heading to dominoes."
gestor_paco_jubilacion_sobrino_kevin.choices.auditar_borradores_de_kevin.label: "Demand early drafts every quarter and check Kevin's math yourself"
gestor_paco_jubilacion_sobrino_kevin.choices.auditar_borradores_de_kevin.result_text: "You catch two creative roundings per quarter, keeping the cheap monthly fee at the cost of playing accounting cop."
gestor_paco_jubilacion_sobrino_kevin.choices.dejar_que_kevin_innove_sin_filtro.label: "Let Kevin unleash his «viral tax-saving hacks» unchecked"
gestor_paco_jubilacion_sobrino_kevin.choices.dejar_que_kevin_innove_sin_filtro.result_text: "He shaves immediate euros off your bill using dubious deductions that light up every statistical audit radar in Spain."

# 25. gestor_paco_pierde_facturas
gestor_paco_pierde_facturas.title: "«Hey, Got Another Copy of This Quarter's Receipts?»"
gestor_paco_pierde_facturas.body: "Forty-eight hours before quarterly closing, Paco calls with a shaky voice over fryer noise: a grease stain ruined your deductible-expense folder and mixed two of your invoices into a greengrocer's binder."
gestor_paco_pierde_facturas.choices.reconstruir_facturas_de_madrugada.label: "Pull an all-nighter downloading duplicate PDFs from twenty vendors"
gestor_paco_pierde_facturas.choices.reconstruir_facturas_de_madrugada.result_text: "You greet dawn with square eyes, rescue every deductible euro, and force Paco to balance the return to the cent."
gestor_paco_pierde_facturas.choices.dejar_que_presente_a_ojo.label: "Tell him to file whatever survived and pray hard"
gestor_paco_pierde_facturas.choices.dejar_que_presente_a_ojo.outcomes.pasa_desapercibido.result_text: "You forfeit part of your deductions along the way, but nobody raises an eyebrow at the tax office this quarter."
gestor_paco_pierde_facturas.choices.dejar_que_presente_a_ojo.outcomes.descuadre_cantoso.result_text: "Mismatched totals trip automated cross-checks, and you finish the quarter swearing to hire a serious firm immediately."
gestor_paco_pierde_facturas.choices.despedir_a_paco_en_el_acto.label: "Grab your surviving folders right now and go back to solo filing"
gestor_paco_pierde_facturas.choices.despedir_a_paco_en_el_acto.result_text: "You march upstairs above the churro shop, rescue your remaining papers, and decide you can make mistakes for free."

# 26. gestor_paco_revision_gastos_dudosos
gestor_paco_revision_gastos_dudosos.title: "Automated Census Check Over Furniture Expenses"
gestor_paco_revision_gastos_dudosos.body: "Two months after the furniture receipt debate, a preventive census alert pops up: your registered activity code clashes with commercial decor entries filed through Paco's desk, and they want clarification."
gestor_paco_revision_gastos_dudosos.choices.presentar_complementaria_preventiva.label: "File a clean voluntary amendment and close the issue now (130 €)"
gestor_paco_revision_gastos_dudosos.choices.presentar_complementaria_preventiva.result_text: "You scrub any questionable line before it escalates into a penalty file and recover your peace of mind instantly."
gestor_paco_revision_gastos_dudosos.choices.preparar_dossier_fotografico_despacho.label: "Stage an immaculate workspace corner and submit photo evidence"
gestor_paco_revision_gastos_dudosos.choices.preparar_dossier_fotografico_despacho.outcomes.aclaracion_archivada.result_text: "Your desk photos satisfy the reviewer, confirming professional use and closing the inquiry at zero extra cost."
gestor_paco_revision_gastos_dudosos.choices.preparar_dossier_fotografico_despacho.outcomes.ajuste_parcial_de_cuota.result_text: "They accept the desk chair but disallow the rest as mixed home use, leaving you a modest tax difference to settle."
gestor_paco_revision_gastos_dudosos.choices.mantener_asiento_sin_tocar_nada.label: "Reply with Paco's boilerplate template and stand by every euro"
gestor_paco_revision_gastos_dudosos.choices.mantener_asiento_sin_tocar_nada.result_text: "You keep your cash untouched this month, though a bright neon sticky note stays attached to your tax profile."

# 27. gestor_paco_sofa_gasto_oficina
gestor_paco_sofa_gasto_oficina.title: "«Put Your Living-Room Sofa Down as Office Gear»"
gestor_paco_sofa_gasto_oficina.body: "Seeing a steep quarterly bill ahead, Paco winks across a tower of folders: he suggests booking your brand-new living-room sofa as «ergonomic client-reception seating» to take a chunk out of VAT."
gestor_paco_sofa_gasto_oficina.choices.colar_sofa_entero_en_trimestre.label: "Follow Paco's wink and deduct the entire sofa unapologetically"
gestor_paco_sofa_gasto_oficina.choices.colar_sofa_entero_en_trimestre.result_text: "Your quarterly bill drops sharply and you stroll out feeling like a neighborhood wolf of Wall Street. Check back in two months."
gestor_paco_sofa_gasto_oficina.choices.deducir_solo_lampara_y_silla.label: "Rein Paco in and log only your genuine desk chair invoice"
gestor_paco_sofa_gasto_oficina.choices.deducir_solo_lampara_y_silla.result_text: "Paco sighs that you are stricter than an inspector, but records only defensible gear backed by itemized invoices."
gestor_paco_sofa_gasto_oficina.choices.dejar_muebles_fuera_de_libros.label: "Keep every household cushion strictly out of business books"
gestor_paco_sofa_gasto_oficina.choices.dejar_muebles_fuera_de_libros.result_text: "You pay your full quarter with zero creative accounting and keep your living room off the tax office radar."

# 28. gestor_paco_suplemento_sorpresa
gestor_paco_suplemento_sorpresa.title: "Surprise Surcharge for «Folders and Annual Forms»"
gestor_paco_suplemento_sorpresa.body: "Checking your bank app, you spot an extra 95 € direct debit from Paco's office labeled «Annual summaries campaign, color copies, and laminated folders». His sixty-euro window sign never mentioned a word."
gestor_paco_suplemento_sorpresa.choices.asumir_suplemento_con_factura.label: "Demand an itemized deductible invoice and pay without drama (95 €)"
gestor_paco_suplemento_sorpresa.choices.asumir_suplemento_con_factura.result_text: "Paco issues a proper invoice on the spot, you deduct the expense cleanly, and he pampers your annual summaries."
gestor_paco_suplemento_sorpresa.choices.regatear_en_barra_con_paco.label: "Head down to the churro counter and haggle the charge in half"
gestor_paco_suplemento_sorpresa.choices.regatear_en_barra_con_paco.outcomes.paco_rebaja_entre_porras.result_text: "Over two coffees he waives more than half the fee and promises fair warning next time he buys stationary."
gestor_paco_suplemento_sorpresa.choices.regatear_en_barra_con_paco.outcomes.paco_se_planta_con_tarifario.result_text: "He pulls a laminated 2011 fee chart from behind a cabinet and you only shave twenty euros off after arguing."
gestor_paco_suplemento_sorpresa.choices.devolver_recibo_y_marcharse.label: "Reverse the debit in your banking app and return to solo filing"
gestor_paco_suplemento_sorpresa.choices.devolver_recibo_y_marcharse.result_text: "Your ninety-five euros bounce right back, you collect your ring binder, and you become your own accounting department again."

# 29. gestor_panico_excel_domingo
gestor_panico_excel_domingo.title: "Sunday Midnight: #REF! Cascade Across Your Ledger"
gestor_panico_excel_domingo.body: "It is 11:45 PM on the Sunday before quarterly tax day and your spreadsheet is spewing formula errors. Three invoices shifted columns and the VAT payable cell currently doubles your real bank balance."
gestor_panico_excel_domingo.choices.rehacer_formulas_de_madrugada.label: "Brew a thermos of coffee and audit every row until sunrise"
gestor_panico_excel_domingo.choices.rehacer_formulas_de_madrugada.result_text: "You hunt down a rogue parenthesis at 3:00 AM and save the quarter for free, though Monday you are a walking zombie."
gestor_panico_excel_domingo.choices.comprar_plantilla_fiscal_auditada.label: "Buy a validated freelance ledger template and re-import (85 €)"
gestor_panico_excel_domingo.choices.comprar_plantilla_fiscal_auditada.result_text: "You import your transactions in thirty minutes, spot two forgotten expenses, and balance the tax form cleanly."
gestor_panico_excel_domingo.choices.rendirse_y_llamar_a_paco.label: "Send the spreadsheet to Paco first thing Monday (60 €/mo)"
gestor_panico_excel_domingo.choices.rendirse_y_llamar_a_paco.result_text: "You drop your crumpled receipts above the churro shop and swear never to debug VAT formulas after midnight again."

# 30. gestor_reajuste_tramos_cotizacion
gestor_reajuste_tramos_cotizacion.title: "Social Security Bracket Reset on Real Net Earnings"
gestor_reajuste_tramos_cotizacion.body: "The annual window opens to align your social-security contribution bracket with your veteran net earnings. Time to decide whether to match to the euro, boost sickness and pension cover, or ride the minimum."
gestor_reajuste_tramos_cotizacion.choices.calibrar_tramo_exacto_con_estudio.label: "Compute exact net yield and lock in the matching bracket (220 €)"
gestor_reajuste_tramos_cotizacion.choices.calibrar_tramo_exacto_con_estudio.result_text: "You dodge retroactive true-up bills next year and sail through the coming months with predictable monthly quotas."
gestor_reajuste_tramos_cotizacion.choices.ampliar_base_proteccion_veterana.label: "Step up one bracket voluntarily for stronger leave cover (310 €)"
gestor_reajuste_tramos_cotizacion.choices.ampliar_base_proteccion_veterana.result_text: "You take on a slightly higher deductible quota, gaining real peace of mind over sick leave and future retirement."
gestor_reajuste_tramos_cotizacion.choices.apurar_tramo_minimo_provisional.label: "Keep the provisional minimum base and deal with true-ups later"
gestor_reajuste_tramos_cotizacion.choices.apurar_tramo_minimo_provisional.result_text: "You preserve every euro of cashflow this quarter, knowing the automated settlement will eventually knock on your bank."

# 31. gestor_revision_estrategia_anual
gestor_revision_estrategia_anual.title: "Pre-Closing Annual Tax Strategy Review"
gestor_revision_estrategia_anual.body: "The fiscal year-end is approaching and you still have time to tidy up depreciation schedules, tune withholdings, and time deductible expenses before December locks the books in stone."
gestor_revision_estrategia_anual.choices.ejecutar_plan_cierre_con_gestoria.label: "Run the full annual optimization plan with your tax office"
gestor_revision_estrategia_anual.choices.ejecutar_plan_cierre_con_gestoria.result_text: "You align due dates and deductible expenses down to the cent, trimming operating drag across the start of next year."
gestor_revision_estrategia_anual.choices.fichar_a_elena_para_el_cierre.label: "Use the closing window to hire Elena Montes full-time (180 €/mo)"
gestor_revision_estrategia_anual.choices.fichar_a_elena_para_el_cierre.result_text: "You onboard full-service tax armor just in time to lock down year-end and start the next stretch with a safety net."
gestor_revision_estrategia_anual.choices.cerrar_ejercicio_sin_cambios.label: "Close the fiscal year as-is without touching what works"
gestor_revision_estrategia_anual.choices.cerrar_ejercicio_sin_cambios.result_text: "You shut the binders without spending an extra euro today, trusting next quarter will arrive gently."
