    label: "Confesar que tus cuentas son demasiado inestables y pedirle que no arriesgue"
    result_text: "Álex deja pasar la oportunidad por prudencia doméstica. Tus números no sufren ni un rasguño, pero en las cenas flota una decepción difícil de disimular."
