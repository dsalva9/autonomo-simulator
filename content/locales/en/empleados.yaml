empleados_actualizacion_convenio_ipc.title: "Annual Wage Scale and Inflation Review"
empleados_actualizacion_convenio_ipc.body: "Another year closes with rising prices and the annual collective pay adjustment lands on your desk. Decide whether to raise pay above inflation, offset it with deductible perks, or freeze real wages."
empleados_actualizacion_convenio_ipc.choices.actualizar_sueldo_sobre_ipc.label: "Apply the full inflation raise and pass part on to client rates"
empleados_actualizacion_convenio_ipc.choices.actualizar_sueldo_sobre_ipc.result_text: "You shoulder most of the wage hike, protect your teammate's purchasing power, and lock in zero turnover across the studio."
empleados_actualizacion_convenio_ipc.choices.compensar_con_retribucion_flexible.label: "Cover deductible training and gear (€390) with a modest pay bump"
empleados_actualizacion_convenio_ipc.choices.compensar_con_retribucion_flexible.result_text: "You cushion fixed monthly payroll by pairing deductible studio perks with comfortable hours, keeping quarterly cash flow steady."
empleados_actualizacion_convenio_ipc.choices.absorber_subida_en_complementos.label: "Absorb the hike into existing allowances so payroll stays flat"
empleados_actualizacion_convenio_ipc.choices.absorber_subida_en_complementos.result_text: "It is strictly legal on paper, yet seeing the exact same net payslip month after month cools any enthusiasm for going the extra mile."

empleados_alianza_red_colaboradores.title: "Temporary Alliance of Trench Freelancers"
empleados_alianza_red_colaboradores.body: "Two complementary freelancers suggest bidding together under a shared umbrella brand for a juicy private contract none of you could land solo. No company merger or payroll, just shared deadlines and egos."
empleados_alianza_red_colaboradores.choices.firmar_acuerdo_reparto_claro.label: "Draft a written milestone and revenue-split agreement first (€180)"
empleados_alianza_red_colaboradores.choices.firmar_acuerdo_reparto_claro.result_text: "You spend an afternoon and a modest legal fee putting every share in writing. You win the opening phase with crystal-clear rules."
empleados_alianza_red_colaboradores.choices.lanzarse_de_palabra_por_prisa.label: "Kick off on a handshake and a toast so you don't lose the client"
empleados_alianza_red_colaboradores.choices.lanzarse_de_palabra_por_prisa.result_text: "You win phase one and dive straight into a lively group chat overflowing with enthusiasm and zero clauses about overtime."
empleados_alianza_red_colaboradores.choices.rechazar_consorcio_informal.label: "Skip collective experiments and stick to your own client roster"
empleados_alianza_red_colaboradores.choices.rechazar_consorcio_informal.result_text: "You pass on the big showcase project, sparing yourself three-way coordination calls at eight in the evening."

empleados_averia_equipo_trabajo.title: "Burnt-Circuit Smell at the Next Desk"
empleados_averia_equipo_trabajo.body: "Midway through Tuesday, your employee's main computer dies with a dry spark while the office chair creaks like a galleon. Upgrading hardware stings cash today, yet lending junk slows every delivery."
empleados_averia_equipo_trabajo.choices.renovar_equipo_y_silla_deducible.label: "Buy a fast workstation and ergonomic chair, deductible (€1,150)"
empleados_averia_equipo_trabajo.choices.renovar_equipo_y_silla_deducible.result_text: "By tomorrow the new setup hums in dead silence, weekly output climbs, and you book a clean tax deduction for the quarter."
empleados_averia_equipo_trabajo.choices.alquilar_portatil_sustitucion.label: "Rent a professional replacement laptop for this month (€260)"
empleados_averia_equipo_trabajo.choices.alquilar_portatil_sustitucion.result_text: "You save the sprint without draining cash all at once: a clean fix, a deductible invoice, and zero immediate technical drama."
empleados_averia_equipo_trabajo.choices.desempolvar_portatil_viejo_cajon.label: "Lend your 2016 spare laptop whose fan roars like a jet engine"
empleados_averia_equipo_trabajo.choices.desempolvar_portatil_viejo_cajon.result_text: "Every heavy file takes ages to open, and daily frustration drags down commercial output across the whole studio."

empleados_baja_medica_temporal.title: "Sick-Leave Note on a Deadline Monday"
empleados_baja_medica_temporal.body: "Monday, 8:30 a.m.: your employee sends a temporary medical leave note for acute back spasms requiring weeks of strict rest. You wish them well—right before remembering social security fees still auto-debit."
empleados_baja_medica_temporal.choices.contratar_refuerzo_externo_deducible.label: "Pay deductible external backup (€680) and respect their rest 100%"
empleados_baja_medica_temporal.choices.contratar_refuerzo_externo_deducible.result_text: "You cover the gap with freelance help without sending a single message during sick leave. Your wallet feels it, but clients and loyalty stay safe."
empleados_baja_medica_temporal.choices.absorber_toda_la_carga_de_noche.label: "Shoulder two people's workload yourself by pulling late nights"
empleados_baja_medica_temporal.choices.absorber_toda_la_carga_de_noche.result_text: "You keep accounts afloat solo, burning cash on takeout coffee and physio sessions while counting the days until that desk chair is occupied again."
empleados_baja_medica_temporal.choices.aplazar_entregas_y_reducir_ritmo.label: "Renegotiate client deadlines and accept a temporary studio slowdown"
empleados_baja_medica_temporal.choices.aplazar_entregas_y_reducir_ritmo.result_text: "You explain the bottleneck honestly: a few commissions slip and commercial momentum cools for months, yet you avoid burning out alive."

empleados_candidatura_espontanea_dani.title: "Dani Knocks on Your Studio Door Again"
empleados_candidatura_espontanea_dani.body: "After toughening up on solo gigs for a few months, Dani writes back with a sharper portfolio and far less stage fright. He asks whether your studio can now afford him full-time or on a monthly retainer."
empleados_candidatura_espontanea_dani.choices.incorporar_dani_con_colchon.label: "Take the leap and bring Dani onto payroll now (€1,350/mo, ×1.58)"
empleados_candidatura_espontanea_dani.choices.incorporar_dani_con_colchon.result_text: "He arrives far more focused than before, untangles the delivery queue by Tuesday, and frees up prime hours for you to close better sales."
empleados_candidatura_espontanea_dani.choices.pactar_bolsa_horas_mensual.label: "Agree on a deductible four-month external hours retainer (€520)"
empleados_candidatura_espontanea_dani.choices.pactar_bolsa_horas_mensual.result_text: "You offload repetitive tasks without permanent payroll contributions, giving both of you breathing room to test day-to-day chemistry."
empleados_candidatura_espontanea_dani.choices.posponer_fichaje_otro_trimestre.label: "Thank him warmly and stay solo until your cash cushion grows"
empleados_candidatura_espontanea_dani.choices.posponer_fichaje_otro_trimestre.result_text: "Dani takes it well and promises to check back next season. You close the email relieved not to stretch fixed overhead past your blanket."

empleados_choque_trato_cliente_borde.title: "Disrespect on a Group Video Call"
empleados_choque_trato_cliente_borde.body: "A high-billing client loses their temper live on screen and rudely blames your employee for a delay the client caused. Once the call ends, the room goes dead silent waiting to see how you respond."
empleados_choque_trato_cliente_borde.choices.parar_los_pies_por_escrito.label: "Send a firm written boundary demanding respect and routing contact"
empleados_choque_trato_cliente_borde.choices.parar_los_pies_por_escrito.outcomes.disculpa_y_limites_claros.result_text: "Thirty minutes later the client backs down by email, and loyalty inside your small studio shoots through the roof."
empleados_choque_trato_cliente_borde.choices.parar_los_pies_por_escrito.outcomes.ruptura_digna_de_cuenta.result_text: "Bruised pride makes the client cancel the next phase. Cash takes a ding this month, yet your employee would walk through fire for you."
empleados_choque_trato_cliente_borde.choices.absorber_tu_al_cliente_dificil.label: "Take over all calls with that client yourself and grant afternoon off"
empleados_choque_trato_cliente_borde.choices.absorber_tu_al_cliente_dificil.result_text: "You shield your employee from the toxicity and save the invoice, at the price of absorbing every tense call yourself all month."
empleados_choque_trato_cliente_borde.choices.pedir_tragar_porque_paga_bien.label: "Say coldly that whoever pays calls the shots and not to make waves"
empleados_choque_trato_cliente_borde.choices.pedir_tragar_porque_paga_bien.result_text: "The wire transfer lands on time, yet something vital cracks for good in the trust between the two desks."

empleados_contraoferta_competencia.title: "Aggressive Counter-Offer from a Rival Agency"
empleados_contraoferta_competencia.body: "A competing consultancy dangles twenty-five percent higher pay in front of your employee if they jump ship in two weeks. They ask to talk today before signing anything right in the middle of peak deliveries."
empleados_contraoferta_competencia.choices.igualar_con_variable_y_autonomia.label: "Retain them with a €600 bonus and project profit-sharing"
empleados_contraoferta_competencia.choices.igualar_con_variable_y_autonomia.result_text: "They turn the consultancy down that same afternoon. Cash tightens short-term, but you protect studio know-how and ignite commitment."
empleados_contraoferta_competencia.choices.invocar_clausulas_y_tensar_cuerda.label: "Threaten non-compete clauses and enforce every day of notice"
empleados_contraoferta_competencia.choices.invocar_clausulas_y_tensar_cuerda.result_text: "Legal hardball freezes their signature on the spot, turning the office atmosphere icy and setting up a bitter standoff."
empleados_contraoferta_competencia.choices.desear_suerte_y_pactar_traspaso.label: "Accept you can't match it and agree on a clean two-week handover"
empleados_contraoferta_competencia.choices.desear_suerte_y_pactar_traspaso.result_text: "You part ways gracefully with zero severance payout, hiring brief freelance cover so active clients barely notice the transition."

empleados_convenio_becario_universidad.title: "Vocational Training Internship Pitch"
empleados_convenio_becario_universidad.body: "A local training school asks if you will host a student intern for one quarter. Done properly it brings fresh energy into the office, yet real mentoring takes hours and must never substitute cheap labor."
empleados_convenio_becario_universidad.choices.acoger_con_bolsa_y_tutoria.label: "Sign the internship with a fair €450 stipend and real mentoring"
empleados_convenio_becario_universidad.choices.acoger_con_bolsa_y_tutoria.result_text: "You structure genuine learning tasks and review progress calmly. Mornings run slower, yet tidying your own workflows sharpens the studio."
empleados_convenio_becario_universidad.choices.exprimir_practicas_en_entregas.label: "Use the placement to dump urgent client grunt work off your plate"
empleados_convenio_becario_universidad.choices.exprimir_practicas_en_entregas.outcomes.saca_trabajo_con_quejas.result_text: "You squeeze extra billing out of repetitive tasks with minimal guidance. The school signs off barely, leaving a frosty tutor report."
empleados_convenio_becario_universidad.choices.exprimir_practicas_en_entregas.outcomes.renuncia_a_mitad_de_mes.result_text: "After three afternoons putting out fires alone, the student cancels the placement. You redo deliverables overnight as word spreads at school."
empleados_convenio_becario_universidad.choices.declinar_por_falta_de_margen.label: "Thank the coordinator and decline until you have time to teach"
empleados_convenio_becario_universidad.choices.declinar_por_falta_de_margen.result_text: "You admit honestly that this quarter is too hectic to mentor anyone properly. The school appreciates your candor and keeps your card."

empleados_curso_especializacion_ia.title: "Dani Asks to Sponsor an Intensive Course"
empleados_curso_especializacion_ia.body: "Dani arrives beaming with a brochure for a hands-on workflow automation course that promises to halve repetitive production chores. He asks the studio to cover deductible tuition and Thursday afternoons."
empleados_curso_especializacion_ia.choices.financiar_matricula_y_tardes.label: "Pay deductible tuition (€480) and reserve Thursday afternoons"
empleados_curso_especializacion_ia.choices.financiar_matricula_y_tardes.result_text: "By week three Dani builds templates that save hours of manual data entry—and brags about your studio to everyone he meets."
empleados_curso_especializacion_ia.choices.cofinanciar_fuera_de_jornada.label: "Split half the tuition (€240) if he studies outside work hours"
empleados_curso_especializacion_ia.choices.cofinanciar_fuera_de_jornada.result_text: "Dani takes the compromise: he applies half the syllabus without cutting billable hours, though dark circles show by Friday."
empleados_curso_especializacion_ia.choices.aplazar_formacion_por_entregas.label: "Turn it down this quarter because the client queue won't wait"
empleados_curso_especializacion_ia.choices.aplazar_formacion_por_entregas.result_text: "You keep every euro in the bank today, while Dani quietly closes the browser tab and goes back to copying spreadsheet rows by hand."

empleados_dani_propuesta_automatizacion.title: "Dani's Weekend Automation Contraption"
empleados_dani_propuesta_automatizacion.body: "Dani shows up Monday with a dangerous gleam in his eye: over the weekend he coded a bot that drafts reports across fifteen accounts at once. If it works you save days; if it misfires, every client sees it."
empleados_dani_propuesta_automatizacion.choices.auditar_juntos_antes_de_activar.label: "Spend two afternoons testing it on dummy data before launch"
empleados_dani_propuesta_automatizacion.choices.auditar_juntos_antes_de_activar.result_text: "Together you catch three embarrassing bugs in staging and ship a polished tool that unlocks clean extra billing without a single scare."
empleados_dani_propuesta_automatizacion.choices.enchufarlo_directo_en_produccion.label: "Trust his enthusiasm and flip it live on real accounts today"
empleados_dani_propuesta_automatizacion.choices.enchufarlo_directo_en_produccion.outcomes.ahorro_espectacular_de_horas.result_text: "The script runs like clockwork, clearing two weeks of routine reporting in forty-eight hours to universal applause."
empleados_dani_propuesta_automatizacion.choices.enchufarlo_directo_en_produccion.outcomes.envio_cruzado_de_borradores.result_text: "A loop mails mismatched drafts to four rival clients. You spend the week apologizing one by one and issuing goodwill discounts."
empleados_dani_propuesta_automatizacion.choices.prohibir_experimentos_en_estudio.label: "Praise the initiative but stick strictly to manual checks"
empleados_dani_propuesta_automatizacion.choices.prohibir_experimentos_en_estudio.result_text: "Zero technical scares hit production, though Dani parks his prototype in an archive folder looking visibly deflated."

empleados_delegacion_direccion_cuentas.title: "Handing Over the Wheel on Client Calls"
empleados_delegacion_direccion_cuentas.body: "After years of checking every comma yourself, your employee knows the roster cold and offers to lead weekly client check-ins directly so you stop acting as the bottleneck on every single project."
empleados_delegacion_direccion_cuentas.choices.delegar_cuentas_con_incentivo.label: "Hand over account ownership with a €500 responsibility bonus"
empleados_delegacion_direccion_cuentas.choices.delegar_cuentas_con_incentivo.result_text: "Six weekly status calls vanish from your calendar, upsells close faster, and for the first time you breathe like an actual studio owner."
empleados_delegacion_direccion_cuentas.choices.delegar_con_revision_quincenal.label: "Delegate day-to-day calls while keeping a biweekly Friday review"
empleados_delegacion_direccion_cuentas.choices.delegar_con_revision_quincenal.result_text: "You shed operational drag without losing commercial visibility, making the whole studio nimbler overnight."
empleados_delegacion_direccion_cuentas.choices.seguir_supervisando_cada_correo.label: "Keep filtering every single client reply yourself just in case"
empleados_delegacion_direccion_cuentas.choices.seguir_supervisando_cada_correo.result_text: "Every deliverable ships spotless with your personal stamp, leaving you exhausted proofreading drafts late and burning out the team."

empleados_entrega_imposible_salvada.title: "Eleventh-Hour Miracle in the Studio"
empleados_entrega_imposible_salvada.body: "A strategic client pulls a major deadline forward while you are trapped untangling urgent red tape. When you check outbox, your hire has already reorganized tasks, polished details, and saved the contract."
empleados_entrega_imposible_salvada.choices.pagar_prima_y_tarde_libre.label: "Share the win with a €450 spot bonus and Friday off"
empleados_entrega_imposible_salvada.choices.pagar_prima_y_tarde_libre.result_text: "The client signs off with written praise and genuine pride fills the office. You trim your margin today to lock in pure gold."
empleados_entrega_imposible_salvada.choices.celebrar_y_mejorar_equipo_estudio.label: "Buy lunch and reinvest part of the fee in ergonomic desk gear"
empleados_entrega_imposible_salvada.choices.celebrar_y_mejorar_equipo_estudio.result_text: "You collect the full milestone and deduct upgraded studio gear—a smart balance between protecting cash and rewarding grit."
empleados_entrega_imposible_salvada.choices.asumir_como_parte_del_sueldo.label: "Offer a pat on the back and pocket the margin ('that's what pay is for')"
empleados_entrega_imposible_salvada.choices.asumir_como_parte_del_sueldo.outcomes.resentimiento_silencioso.result_text: "The invoice clears cleanly, yet a hollow 'nice job, champ' leaves an unmistakable chill hanging between the two desks."
empleados_entrega_imposible_salvada.choices.asumir_como_parte_del_sueldo.outcomes.profesionalidad_estoica.result_text: "They take it like a pro and your bank balance enjoys the full fee, though you know you just burned a goodwill token."

empleados_evaluacion_fin_practicas.title: "End of Internship and Next Steps"
empleados_evaluacion_fin_practicas.body: "The training placement wraps up and Dani now knows your templates, shortcuts, and quirks better than half the industry. Diploma in hand, he asks eagerly if there is a real payroll spot or freelance work."
empleados_evaluacion_fin_practicas.choices.contratar_dani_tras_practicas.label: "Hire Dani onto payroll already trained (€1,350/mo, ×1.58)"
empleados_evaluacion_fin_practicas.choices.contratar_dani_tras_practicas.result_text: "Zero onboarding lag: Monday morning he sits down knowing where every folder lives, and studio output jumps without missing a beat."
empleados_evaluacion_fin_practicas.choices.estrenar_colaboracion_puntual.label: "Write a glowing reference and commission his first paid gig"
empleados_evaluacion_fin_practicas.choices.estrenar_colaboracion_puntual.result_text: "You skip fixed payroll while supervising a shared paid client brief that launches his freelance portfolio and adds monthly margin."
empleados_evaluacion_fin_practicas.choices.despedida_cordial_sin_hueco.label: "Sign top marks on his evaluation and stay solo for now"
empleados_evaluacion_fin_practicas.choices.despedida_cordial_sin_hueco.result_text: "You hand over stellar references and a farewell gift, reclaiming quiet studio focus and unhurried evenings."

empleados_fichaje_senior_laura.title: "A Heavyweight Senior Hire"
empleados_fichaje_senior_laura.body: "Laura, a senior specialist fed up with pointless meetings at big consultancies, wants to join a small studio built on craft rather than smoke. Her monthly salary commands respect, yet unlocks top-tier accounts."
empleados_fichaje_senior_laura.choices.fichar_laura_plantilla.label: "Hire Laura onto full payroll (€2,100/mo, ×2.05)"
empleados_fichaje_senior_laura.choices.fichar_laura_plantilla.result_text: "Within forty-eight hours Laura has organized folders, templates, and workflows held together with tape. Payroll is dizzying, yet you play in the big leagues."
empleados_fichaje_senior_laura.choices.alianza_proyecto_grande.label: "Partner with her externally on one demanding brief without payroll"
empleados_fichaje_senior_laura.choices.alianza_proyecto_grande.result_text: "You team up on a high-ticket project and deduct her freelance invoice. The client is thrilled and you sleep free of permanent overhead."
empleados_fichaje_senior_laura.choices.descartar_estructura_pesada.label: "Decline honestly: your cash reserve still prefers traveling light"
empleados_fichaje_senior_laura.choices.descartar_estructura_pesada.result_text: "Laura respects the plain speaking with zero corporate jargon and stays in touch for when your balance sheet grows."

empleados_incendio_produccion_viernes.title: "Friday at Seven: Wrong Folder Deleted"
empleados_incendio_produccion_viernes.body: "Ten minutes before wrapping the week, Dani goes pale clutching his giant thermos: while cleaning temp files he overwrote the final build due Monday at 9 a.m., and the cloud backup stopped halfway through."
empleados_incendio_produccion_viernes.choices.mentorizar_y_reconstruir_juntos.label: "Breathe deep, order dinner, and rebuild the deliverable side by side"
empleados_incendio_produccion_viernes.choices.mentorizar_y_reconstruir_juntos.outcomes.rescate_y_aprendizaje.result_text: "You reconstruct everything before midnight and set up bulletproof backups. Dani learns more in one evening than in three bootcamps."
empleados_incendio_produccion_viernes.choices.mentorizar_y_reconstruir_juntos.outcomes.salvado_sobre_la_bocina.result_text: "It takes half of Saturday to stitch the pieces back together, yet by 8:55 a.m. Monday the client gets a clean delivery none the wiser."
empleados_incendio_produccion_viernes.choices.echar_bronca_y_dejarlo_solo.label: "Tear into him and demand he fix it alone over the weekend"
empleados_incendio_produccion_viernes.choices.echar_bronca_y_dejarlo_solo.outcomes.chapuza_detectada_por_cliente.result_text: "Unsupervised and panicked, Dani ships a visibly broken patch. Monday brings a forced client discount and a funeral mood in the office."
empleados_incendio_produccion_viernes.choices.echar_bronca_y_dejarlo_solo.outcomes.parche_con_ojeras.result_text: "Dani grinds all Saturday and salvages the delivery on his own, though come Monday he barely lifts his eyes from the keyboard."
empleados_incendio_produccion_viernes.choices.dar_la_cara_y_pedir_margen.label: "Call the client yourself, own it as a studio, and deliver Tuesday"
empleados_incendio_produccion_viernes.choices.dar_la_cara_y_pedir_margen.result_text: "You take responsibility without throwing anyone under the bus and offer a small courtesy credit, earning respect inside and out."

empleados_jornada_intensiva_agosto.title: "Heatwave and August Intensive Hours"
empleados_jornada_intensiva_agosto.body: "With street thermometers flirting with forty degrees, your employee asks to switch to Spanish August intensive hours until 3 p.m. and lock summer leave—right as a foreign client demands afternoon calls."
empleados_jornada_intensiva_agosto.choices.aprobar_intensiva_y_reordenar_citas.label: "Approve intensive hours and move the foreign client to mornings"
empleados_jornada_intensiva_agosto.choices.aprobar_intensiva_y_reordenar_citas.result_text: "Focused work happens early while minds are fresh and laptops shut at three. Raw hours dip slightly, yet nobody melts at their desk."
empleados_jornada_intensiva_agosto.choices.abonar_plus_guardia_tardes.label: "Pay a voluntary €450 summer bonus to cover two afternoons a week"
empleados_jornada_intensiva_agosto.choices.abonar_plus_guardia_tardes.result_text: "Extra pay softens the August heat: international calls run smoothly and you invoice a solid summer retainer."
empleados_jornada_intensiva_agosto.choices.mantener_horario_partido_estricto.label: "Enforce full split afternoon hours because the foreign contract rules"
empleados_jornada_intensiva_agosto.choices.mantener_horario_partido_estricto.result_text: "Every late call gets answered under the rattling air conditioner, though studio morale drops into the cellar."

empleados_laura_auditoria_clientes_toxicos.title: "Laura's Ruthless Profitability Notebook"
empleados_laura_auditoria_clientes_toxicos.body: "Laura opens her ring-bound notebook to devastating charts: two legacy accounts chew up nearly half the studio's support emails while contributing scraps of revenue. She proposes raising rates or firing them."
empleados_laura_auditoria_clientes_toxicos.choices.aplicar_subida_tarifa_selectiva.label: "Let Laura send updated pricing with strict scope boundaries"
empleados_laura_auditoria_clientes_toxicos.choices.aplicar_subida_tarifa_selectiva.result_text: "One accepts the hike without blinking and the other magically learns to batch questions into a single weekly email. Pure sorcery."
empleados_laura_auditoria_clientes_toxicos.choices.rescindir_cuentas_deficitarias.label: "Wind down those draining accounts politely to free up capacity"
empleados_laura_auditoria_clientes_toxicos.choices.rescindir_cuentas_deficitarias.result_text: "You give up small immediate cash so the studio can land far healthier, higher-margin commissions over the next five months."
empleados_laura_auditoria_clientes_toxicos.choices.mantenerlos_por_miedo_al_vacio.label: "Keep them anyway out of superstitious fear of quiet months"
empleados_laura_auditoria_clientes_toxicos.choices.mantenerlos_por_miedo_al_vacio.result_text: "You keep the full gross monthly billing without cancellations, while Laura sighs in resignation at every absurd tweak request."

empleados_laura_limite_urgencias_tarde.title: "Five to Six and a Fake Client Emergency"
empleados_laura_limite_urgencias_tarde.body: "At 5:55 p.m. a client emails demanding an unscheduled overhaul for tomorrow morning for no real reason. Laura closes her laptop firmly, warning that caving to fake emergencies ruins every studio process."
empleados_laura_limite_urgencias_tarde.choices.respaldar_criterio_y_tarifar_extra.label: "Back Laura and quote an express rush fee if they want it tomorrow"
empleados_laura_limite_urgencias_tarde.choices.respaldar_criterio_y_tarifar_extra.result_text: "Suddenly either the 'life-or-death' rush can wait or they approve the surcharge on the spot. Laura smiles, proud to be on your ship."
empleados_laura_limite_urgencias_tarde.choices.asumirlo_tu_solo_de_noche.label: "Send Laura home on time and stay late handling the mess yourself"
empleados_laura_limite_urgencias_tarde.choices.asumirlo_tu_solo_de_noche.result_text: "You honor her six-o'clock boundary while eating cold dinner at your screen at 11 p.m. wondering who actually works for whom."
empleados_laura_limite_urgencias_tarde.choices.presionar_para_quedarse_ambos.label: "Press her to stay late with you tonight as a one-off exception"
empleados_laura_limite_urgencias_tarde.choices.presionar_para_quedarse_ambos.result_text: "Together you ship the full overhaul in two tense evening hours, and Laura makes a silent mental note of the crossed line."

empleados_mediacion_salida_tensa.title: "Glacial Silence and Labor Conciliation Threat"
empleados_mediacion_salida_tensa.body: "One month after clashing over the rival offer, every internal message reads like legal exhibits and output has tanked. A labor lawyer urges you to unlock the standoff before formal conciliation hearings."
empleados_mediacion_salida_tensa.choices.firmar_salida_pactada_con_asesor.label: "Settle a clean departure with counsel and severance (€1,250)"
empleados_mediacion_salida_tensa.choices.firmar_salida_pactada_con_asesor.result_text: "Both sides sign a settlement waiving further claims. Your bank balance winces, yet peace of mind returns the very same afternoon."
empleados_mediacion_salida_tensa.choices.rectificar_y_renovar_confianza.label: "Apologize for the hardball tone and sign real upgrades (€400)"
empleados_mediacion_salida_tensa.choices.rectificar_y_renovar_confianza.result_text: "Owning up defuses the trench warfare. Putting fair terms in writing salvages the working relationship before it breaks."
empleados_mediacion_salida_tensa.choices.mantener_pulso_hasta_el_smac.label: "Hold the legal line all the way to the formal conciliation board"
empleados_mediacion_salida_tensa.choices.mantener_pulso_hasta_el_smac.outcomes.baja_tensa_con_minimo_acuerdo.result_text: "Outside the hearing room you close the exit for €300 plus legal fees, though the emotional grind leaves you wrung out."
empleados_mediacion_salida_tensa.choices.mantener_pulso_hasta_el_smac.outcomes.acuerdo_costoso_en_conciliacion.result_text: "Playing hardball backfires: you pay €2,100 in severance plus legal bills to avoid court, and word travels around the sector."

empleados_mudanza_local_calle.title: "Escaping the Ironing-Board Bedroom Office"
empleados_mudanza_local_calle.body: "Working in slippers beside drying laundry saves cash, yet you can no longer tell where the living room ends and work begins. A shared street-level studio and a neighborhood coworking desk just opened up."
empleados_mudanza_local_calle.choices.alquilar_estudio_compartido.label: "Take a share in the street-level studio (€650 move-in setup)"
empleados_mudanza_local_calle.choices.alquilar_estudio_compartido.result_text: "You get keys, set up far from your sofa, and host clients with decent coffee. Fixed costs rise, yet pulling the shutter at dusk frees your head."
empleados_mudanza_local_calle.choices.probar_mesa_coworking.label: "Book a flexible desk at the neighborhood coworking space (€220)"
empleados_mudanza_local_calle.choices.probar_mesa_coworking.result_text: "You trade hallway walls for daylight, fast fiber, and human small talk by the espresso machine without signing a long lease."
empleados_mudanza_local_calle.choices.seguir_en_casa_ahorrando.label: "Stay home and keep every single euro of office rent in the bank"
empleados_mudanza_local_calle.choices.seguir_en_casa_ahorrando.result_text: "Your checking account stays untouched, even if your monitor still glares at you from across the room every Sunday night."

empleados_negociacion_condiciones.title: "Pay Review or Four-Day Week"
empleados_negociacion_condiciones.body: "Your employee asks for twenty minutes behind closed doors with a notebook full of fair points: living costs rose, recruiters are messaging, and they want either higher pay or hybrid work with Fridays off."
empleados_negociacion_condiciones.choices.aprobar_subida_e_incentivos.label: "Approve a performance-linked pay raise for the next six months"
empleados_negociacion_condiciones.choices.aprobar_subida_e_incentivos.result_text: "Monthly overhead climbs, yet commitment shows immediately in delivery pace—and you avoid training someone new from scratch."
empleados_negociacion_condiciones.choices.pactar_jornada_flexible_remoto.label: "Offer hybrid remote work and free Fridays instead of raising fixed pay"
empleados_negociacion_condiciones.choices.pactar_jornada_flexible_remoto.result_text: "Payroll stays flat while you trade a sliver of Friday-afternoon capacity for a dramatically happier, calmer studio."
empleados_negociacion_condiciones.choices.congelar_condiciones_por_trimestre.label: "Refuse for now, blaming quarterly taxes and tight fixed overhead"
empleados_negociacion_condiciones.choices.congelar_condiciones_por_trimestre.outcomes.enfriamiento_en_despacho.result_text: "They stay put for the moment, though after-hours favors vanish overnight and polite distance settles over morning check-ins."
empleados_negociacion_condiciones.choices.congelar_condiciones_por_trimestre.outcomes.baja_voluntaria_inesperada.result_text: "Two weeks later they hand in formal notice after signing elsewhere. Zero severance owed, and you are suddenly back to flying solo."

empleados_oferta_fuga_cliente.title: "Poaching Attempt from the Client Side"
empleados_oferta_fuga_cliente.body: "After months delivering spotless work together, you learn Marta's department quietly approached your employee to hire them in-house—conveniently cutting out your studio margin in the process."
empleados_oferta_fuga_cliente.choices.blindar_con_prima_y_marcar_limites.label: "Pay a €550 retention bonus and enforce your clause with Marta"
empleados_oferta_fuga_cliente.choices.blindar_con_prima_y_marcar_limites.result_text: "Your hire appreciates the backing and stays put, while Marta renews the contract respecting your studio's boundaries."
empleados_oferta_fuga_cliente.choices.pactar_cesion_y_cobrar_traspaso.label: "Negotiate a billed transfer fee for the handover and go solo again"
empleados_oferta_fuga_cliente.choices.pactar_cesion_y_cobrar_traspaso.result_text: "You close a civilized professional transition, invoice a healthy transfer fee, and wipe fixed monthly payroll off your books."
empleados_oferta_fuga_cliente.choices.no_igualar_y_confiar_en_el_trato.label: "Refuse a bidding war with a corporation and appeal to studio culture"
empleados_oferta_fuga_cliente.choices.no_igualar_y_confiar_en_el_trato.outcomes.lealtad_al_estudio_pequeno.result_text: "They choose the freedom of your small studio over endless corporate committees, turning down the offer at zero cost to you."
empleados_oferta_fuga_cliente.choices.no_igualar_y_confiar_en_el_trato.outcomes.marcha_con_quince_dias_preaviso.result_text: "Fourteen corporate payslips win out: formal notice lands on your desk mid-quarter, and scrambling deliveries costs you cash."

empleados_paga_aniversario_estudio.title: "Studio Anniversary and Loyalty Bonus"
empleados_paga_aniversario_estudio.body: "More than five years in business, your studio marks another year shipping complex work as a team. Time for a grown-up boss call: share results with a special bonus or hoard every liquid euro for taxes."
empleados_paga_aniversario_estudio.choices.abonar_paga_extra_consolidacion.label: "Pay an €850 anniversary profit bonus to cement long-term loyalty"
empleados_paga_aniversario_estudio.choices.abonar_paga_extra_consolidacion.result_text: "Your bank balance feels the dip, yet shared pride propels commercial output across the entire next six months."
empleados_paga_aniversario_estudio.choices.financiar_formacion_y_dias_libres.label: "Reward with deductible advanced training (€360) and extra days off"
empleados_paga_aniversario_estudio.choices.financiar_formacion_y_dias_libres.result_text: "You balance appreciation with fiscal caution, sharpening studio skills without draining your quarterly tax reserve."
empleados_paga_aniversario_estudio.choices.congelar_primas_por_tesoreria.label: "Open the books and explain this year calls for conserving cash"
empleados_paga_aniversario_estudio.choices.congelar_primas_por_tesoreria.result_text: "Every euro stays safely in the bank, though the anniversary passes without fanfare and daily momentum noticeably cools."

empleados_primer_fichaje.title: "An Extra Pair of Hands"
empleados_primer_fichaje.body: "Incoming work is starting to swamp you when you meet Dani, an eager junior looking for a stable first break. Bringing him into your tiny office will multiply your output—right alongside your fixed bills."
empleados_primer_fichaje.choices.fichar_dani_plantilla.label: "Hire Dani onto payroll (€1,350/mo, ×1.58)"
empleados_primer_fichaje.choices.fichar_dani_plantilla.result_text: "You file the social security paperwork and clear half a desk. Monday morning Dani arrives with a liter thermos, fresh notebook, and contagious energy."
empleados_primer_fichaje.choices.subcontratar_apoyo_puntual.label: "Offer a one-off freelance collaboration to clear the current backlog"
empleados_primer_fichaje.choices.subcontratar_apoyo_puntual.result_text: "You ship a big commission and deduct his freelance invoice: thinner net margin than doing it all solo, with zero fixed payroll next month."
empleados_primer_fichaje.choices.seguir_como_lobo_solitario.label: "Thank him warmly and keep rowing solo for now"
empleados_primer_fichaje.choices.seguir_como_lobo_solitario.result_text: "Paying your own monthly self-employed contribution is plenty of adrenaline without taking on a payroll. Dani leaves his card for later."

empleados_red_veterana_subcontratas.title: "Your Black Book of On-Call Specialists"
empleados_red_veterana_subcontratas.body: "After years surviving solo, three trusted senior subcontractors offer to reserve priority capacity for your studio next semester so you can land major accounts without hiring permanent staff."
empleados_red_veterana_subcontratas.choices.asegurar_cupo_preferente_semestral.label: "Advance a deductible €780 retainer and lock in major commissions"
empleados_red_veterana_subcontratas.choices.asegurar_cupo_preferente_semestral.result_text: "You punch like a boutique agency with zero permanent payroll, absorbing big billing spikes while keeping total independence."
empleados_red_veterana_subcontratas.choices.colaborar_solo_bajo_demanda.label: "Stick to project-by-project freelance splits with no upfront retainer"
empleados_red_veterana_subcontratas.choices.colaborar_solo_bajo_demanda.result_text: "You co-deliver a solid commission paying their share on completion and carry zero commitments into next month."
empleados_red_veterana_subcontratas.choices.replegar_a_cartera_artesanal.label: "Pass on priority slots and stick strictly to craft solo accounts"
empleados_red_veterana_subcontratas.choices.replegar_a_cartera_artesanal.result_text: "You wave bigger contracts goodbye and savor the quiet craft of relying solely on your own keyboard."

empleados_reestructuracion_despido.title: "Scissors or Reinvention in the Studio"
empleados_reestructuracion_despido.body: "After a couple of tight months, meeting a fixed payroll on the 28th starts keeping you awake staring at bank statements. Decide calmly whether to hustle new sales to save the job or downsize with severance."
empleados_reestructuracion_despido.choices.reorganizar_cartera_y_mantener.label: "Protect the job, trim wasteful subscriptions, and pitch new business"
empleados_reestructuracion_despido.choices.reorganizar_cartera_y_mantener.result_text: "You cut bloat, grit your teeth together, and close a fast commercial push that justifies keeping the team intact."
empleados_reestructuracion_despido.choices.acordar_salida_pactada.label: "Agree on an amicable exit with full severance (€1,450) and references"
empleados_reestructuracion_despido.choices.acordar_salida_pactada.result_text: "It is a hard conversation, yet you part with mutual respect and clean accounts. The office falls quiet again and fixed overhead drops."
empleados_reestructuracion_despido.choices.recorte_drastico_minimo_legal.label: "Execute a bare-minimum dismissal payout to shield cash reserves"
empleados_reestructuracion_despido.choices.recorte_drastico_minimo_legal.outcomes.finiquito_tenso_firmado.result_text: "Severance closes at €750 without going to court, though the goodbye is icy and word always gets around in a small industry."
empleados_reestructuracion_despido.choices.recorte_drastico_minimo_legal.outcomes.papeleta_conciliacion_laboral.result_text: "Cutting corners triggers a formal labor conciliation claim: you end up paying €1,900 in severance plus legal advisory fees."

empleados_registro_horario_obligatorio.title: "Mandatory Daily Time-Tracking Logs"
empleados_registro_horario_obligatorio.body: "Over coffee, a neighboring business owner warns that Labor Inspectors are auditing tiny studios for mandatory daily clock-in records. Right now your time tracking consists of good faith and a crumpled sticky note."
empleados_registro_horario_obligatorio.choices.implantar_app_fichaje_homologada.label: "Subscribe to a simple compliant mobile clock-in app (€210)"
empleados_registro_horario_obligatorio.choices.implantar_app_fichaje_homologada.result_text: "Setup takes ten minutes, digital disconnect hours are clear, and you sleep soundly knowing every timestamp log is audit-ready."
empleados_registro_horario_obligatorio.choices.llevar_hojas_firmadas_a_mano.label: "Print monthly paper timesheets and chase ink signatures every Friday"
empleados_registro_horario_obligatorio.choices.llevar_hojas_firmadas_a_mano.result_text: "Software costs zero euros, though every month ends hunting for a pen and filing ring binders like it is 1994."
empleados_registro_horario_obligatorio.choices.pasar_del_tramite_por_pequenos.label: "Ignore the paperwork assuming nobody inspects a two-desk office"
empleados_registro_horario_obligatorio.choices.pasar_del_tramite_por_pequenos.outcomes.trimestre_sin_visitas.result_text: "Months roll by without a peep from the ministry, sparing you one more bureaucratic chore."
empleados_registro_horario_obligatorio.choices.pasar_del_tramite_por_pequenos.outcomes.requerimiento_sancion_leve.result_text: "An official notice arrives for missing time logs, sticking you with a non-deductible €750 fine and an expensive lesson."

empleados_relevo_senior_proyecto_clave.title: "Senior Backup for Flagship Accounts"
empleados_relevo_senior_proyecto_clave.body: "Years into your career, a flagship client asks for continuity guarantees in case the flu knocks you flat. Laura is free either to join your payroll or sign a mutual cross-coverage pact as peers."
empleados_relevo_senior_proyecto_clave.choices.fichar_laura_etapa_consolidada.label: "Bring Laura onto payroll to scale up (€2,100/mo, ×2.05)"
empleados_relevo_senior_proyecto_clave.choices.fichar_laura_etapa_consolidada.result_text: "With Laura running technical delivery, the client signs the annual contract on the spot and your studio stops depending on your throat."
empleados_relevo_senior_proyecto_clave.choices.firmar_pacto_cobertura_mutua.label: "Sign a deductible mutual backup retainer with Laura as peers"
empleados_relevo_senior_proyecto_clave.choices.firmar_pacto_cobertura_mutua.result_text: "You present a rock-solid continuity plan between senior independents, winning the big account without permanent payroll."
empleados_relevo_senior_proyecto_clave.choices.defender_estudio_unipersonal.label: "Defend your solo boutique model and accept a smaller contract scope"
empleados_relevo_senior_proyecto_clave.choices.defender_estudio_unipersonal.result_text: "The client trims scope out of caution, while you keep absolute ownership of your calendar and zero fixed payroll."

empleados_reparto_proyecto_conjunto.title: "Splitting the Joint Project Invoice"
empleados_reparto_proyecto_conjunto.body: "The client approves the final milestone on your joint freelance bid, and tension surfaces: one collaborator claims an extra slice of your fee, arguing their eleventh-hour edits saved the pitch."
empleados_reparto_proyecto_conjunto.choices.aplicar_anexo_firmado.label: "Pull out the signed split agreement and settle to the exact euro"
empleados_reparto_proyecto_conjunto.choices.aplicar_anexo_firmado.result_text: "Written clauses end the debate in five minutes with zero hard feelings. Everyone invoices cleanly, ready to team up again."
empleados_reparto_proyecto_conjunto.choices.ceder_parte_margen_por_paz.label: "Give up part of your margin to keep the peace and preserve ties"
empleados_reparto_proyecto_conjunto.choices.ceder_parte_margen_por_paz.result_text: "You swallow hard, cover their extra hours out of your share, and keep the professional bridge intact—at a thinner profit."
empleados_reparto_proyecto_conjunto.choices.plantarse_y_romper_alianza.label: "Refuse unapproved overruns even if sparks fly across the group"
empleados_reparto_proyecto_conjunto.choices.plantarse_y_romper_alianza.outcomes.cobro_integro_y_frialdad.result_text: "You hold firm and collect every euro of your share, though that freelance alliance is officially history."
empleados_reparto_proyecto_conjunto.choices.plantarse_y_romper_alianza.outcomes.discusion_salpica_al_cliente.result_text: "An ill-advised reply-all spills the argument in front of the client, who trims final scope fed up with bickering suppliers."

empleados_subcontratacion_pico_trabajo.title: "Delivery Bottleneck in a Crunch Fortnight"
empleados_subcontratacion_pico_trabajo.body: "Three dormant quotes get approved on the exact same Tuesday morning. With nobody on payroll, you must quickly outsource to a trusted peer, gamble on bargain gig platforms, or cap what you accept."
empleados_subcontratacion_pico_trabajo.choices.subcontratar_especialista_fiable.label: "Subcontract a trusted senior peer on a deductible invoice"
empleados_subcontratacion_pico_trabajo.choices.subcontratar_especialista_fiable.result_text: "Paying fair rates to a pro pays off: all three projects ship on schedule, net margin stays healthy, and you sleep seven hours."
empleados_subcontratacion_pico_trabajo.choices.encargar_en_plataforma_gangas.label: "Farm modules out to the lowest bidder on a fast-turnaround site"
empleados_subcontratacion_pico_trabajo.choices.encargar_en_plataforma_gangas.outcomes.cumple_con_retoques_tuyos.result_text: "After two evenings polishing rough edges, the work passes muster and you pocket nearly the entire surge margin."
empleados_subcontratacion_pico_trabajo.choices.encargar_en_plataforma_gangas.outcomes.chapuza_rehecha_de_madrugada.result_text: "Unusable slop arrives hours before deadline. You eat the fee and spend all weekend rebuilding everything from scratch."
empleados_subcontratacion_pico_trabajo.choices.aceptar_solo_lo_abarcable.label: "Accept only what your own hands can deliver and refer the rest"
empleados_subcontratacion_pico_trabajo.choices.aceptar_solo_lo_abarcable.result_text: "You bill less this month, deliver surgical quality, and earn goodwill for refusing to overpromise."

empleados_teletrabajo_mudanza_provincia.title: "Moving Out of Town and Full Remote Work"
empleados_teletrabajo_mudanza_provincia.body: "Priced out of city rent, your employee plans to relocate two hours away by train and asks to switch to full remote work, commuting in once a month to plan sprints at the studio."
empleados_teletrabajo_mudanza_provincia.choices.aprobar_remoto_con_compensacion.label: "Approve full remote and cover home-office stipend plus train (€240)"
empleados_teletrabajo_mudanza_provincia.choices.aprobar_remoto_con_compensacion.result_text: "Freed from a two-hour daily commute, focus jumps noticeably—and you even save on mid-morning coffee pods."
empleados_teletrabajo_mudanza_provincia.choices.pactar_trimestre_prueba_remoto.label: "Sign a reversible three-month remote trial tied to clear milestones"
empleados_teletrabajo_mudanza_provincia.choices.pactar_trimestre_prueba_remoto.result_text: "Short Monday check-ins and clear deliverables keep output steady without spending extra cash or losing trained talent."
empleados_teletrabajo_mudanza_provincia.choices.exigir_presencialidad_o_extincion.label: "Insist the role is on-site and settle an agreed exit (€650)"
empleados_teletrabajo_mudanza_provincia.choices.exigir_presencialidad_o_extincion.result_text: "You stick to your in-person rule, losing a trained teammate and inheriting the entire pending backlog overnight."


empleados_auditoria_prevencion_riesgos_prl.title: "Workplace Safety Compliance and Monitor Height"
empleados_auditoria_prevencion_riesgos_prl.body: "Having someone on payroll brings fine print beyond wages: it is time to renew your mandatory workplace risk-prevention contract, offer an annual health checkup, and document desk ergonomics."
empleados_auditoria_prevencion_riesgos_prl.choices.contratar_servicio_prl_completo_y_mejoras.label: "Book full safety coverage, health check, and desk upgrades (€340)"
empleados_auditoria_prevencion_riesgos_prl.choices.contratar_servicio_prl_completo_y_mejoras.result_text: "Your labor compliance binder sits bulletproof against audits, and your teammate appreciates genuine care for health."
empleados_auditoria_prevencion_riesgos_prl.choices.cubrir_minimo_legal_documental.label: "Sign the mandatory baseline safety policy with zero extras (€165)"
empleados_auditoria_prevencion_riesgos_prl.choices.cubrir_minimo_legal_documental.result_text: "You meet the letter of the law on a deductible invoice and file the certificate away without fanfare."
empleados_auditoria_prevencion_riesgos_prl.choices.dejar_renovacion_en_bandeja_pendientes.label: "Postpone renewal hoping nobody checks a tiny two-person studio"
empleados_auditoria_prevencion_riesgos_prl.choices.dejar_renovacion_en_bandeja_pendientes.outcomes.pasa_el_ano_sin_visita.result_text: "Nobody knocks this half-year, though you flinch slightly every time an official electronic notice lands."
empleados_auditoria_prevencion_riesgos_prl.choices.dejar_renovacion_en_bandeja_pendientes.outcomes.requerimiento_laboral_menor.result_text: "An automated registry cross-check flags your expired policy: you pay a non-deductible penalty and sign up in a rush."

empleados_baja_gripe_entrega_trimestral.title: "A 39-Degree Fever Forty-Eight Hours Before Delivery"
empleados_baja_gripe_entrega_trimestral.body: "Winter flu strikes without mercy: your employee messages in a raspy croak with a 39-degree fever, still offering to log in from under the duvet so Thursday's client milestone ships on time."
empleados_baja_gripe_entrega_trimestral.choices.prohibirle_conectarse_y_cubrir_tu.label: "Forbid opening the laptop, order rest, and finish the job yourself"
empleados_baja_gripe_entrega_trimestral.choices.prohibirle_conectarse_y_cubrir_tu.result_text: "You sleep five hours on Wednesday, ship the milestone cleanly, and earn lasting gratitude for putting health first."
empleados_baja_gripe_entrega_trimestral.choices.pedir_tres_dias_de_margen_al_cliente.label: "Tell the client honestly and push delivery to next Monday"
empleados_baja_gripe_entrega_trimestral.choices.pedir_tres_dias_de_margen_al_cliente.result_text: "The client grumbles for ten seconds and agrees; nobody works fever-delirious and you keep your evenings sane."
empleados_baja_gripe_entrega_trimestral.choices.aceptar_que_trabaje_con_fiebre_en_remoto.label: "Accept the offer so their half gets finished from bed on schedule"
empleados_baja_gripe_entrega_trimestral.choices.aceptar_que_trabaje_con_fiebre_en_remoto.result_text: "You hit the date at the cost of two avoidable typos and a quiet disappointment that lingers for months."

empleados_bono_coworking_hibrido.title: "Jackhammers Upstairs and a Coworking Pass Request"
empleados_bono_coworking_hibrido.body: "Without a street-level studio, remote work collides with neighborhood renovations: crews just started gutting the apartment right above your employee's flat, prompting a request for a nearby coworking pass."
empleados_bono_coworking_hibrido.choices.pagar_pase_coworking_deducible.label: "Cover a deductible monthly desk pass with phone booths (€185)"
empleados_bono_coworking_hibrido.choices.pagar_pase_coworking_deducible.result_text: "Focus rebounds overnight, client calls sound crisp again, and you book a clean tax deduction with zero long lease."
empleados_bono_coworking_hibrido.choices.enviar_auriculares_cancelacion_ruido.label: "Buy studio-grade active noise-canceling headphones (€145)"
empleados_bono_coworking_hibrido.choices.enviar_auriculares_cancelacion_ruido.result_text: "They tame most of the neighbor's masonry drill without adding a new recurring bill to your monthly overhead."
empleados_bono_coworking_hibrido.choices.decirle_que_tire_de_biblioteca_o_cafe.label: "Suggest working from the public library until the rubble clears"
empleados_bono_coworking_hibrido.choices.decirle_que_tire_de_biblioteca_o_cafe.result_text: "You save the invoice, though whispering on calls beside exam students drags output down and sours morale."

empleados_cesta_navidad_cena_estudio.title: "Christmas Hamper, Year-End Lunch, and Holiday Cheer"
empleados_cesta_navidad_cena_estudio.body: "December fills the sidewalks with couriers lugging wine cases and cured hams. Inside the studio, it is time to decide how to wrap up the year with your employee before January's tax bill lands."
empleados_cesta_navidad_cena_estudio.choices.cesta_artesana_cena_y_tarde_libre.label: "Gift a proper hamper, closing lunch, and all of Dec 24th off (€320)"
empleados_cesta_navidad_cena_estudio.choices.cesta_artesana_cena_y_tarde_libre.result_text: "You close the year toasting unhurriedly, and January kicks off with studio loyalty through the roof."
empleados_cesta_navidad_cena_estudio.choices.detalle_sobrio_y_brindis_mediodia.label: "Order a tasteful gourmet box and share Friday midday tapas (€110)"
empleados_cesta_navidad_cena_estudio.choices.detalle_sobrio_y_brindis_mediodia.result_text: "You come across as thoughtful without denting your cash cushion ahead of year-end tax filings."
empleados_cesta_navidad_cena_estudio.choices.felicitacion_por_correo_y_austeridad.label: "Cite year-end prudence and wrap December with a polite email"
empleados_cesta_navidad_cena_estudio.choices.felicitacion_por_correo_y_austeridad.result_text: "You keep every cent in the bank today, though watching friends haul hampers home leaves a frosty chill till January."

empleados_cliente_intenta_fichar_directo.title: "A Client Privately Tries to Poach Your Teammate"
empleados_cliente_intenta_fichar_directo.body: "Your employee holds up a phone screen with a wry half-smile: a regular client just sent a private message offering an in-house job so they can stop paying your monthly studio invoices."
empleados_cliente_intenta_fichar_directo.choices.agradecer_lealtad_y_cortar_al_cliente.label: "Reward the honesty (€220) and demand formal respect from the client"
empleados_cliente_intenta_fichar_directo.choices.agradecer_lealtad_y_cortar_al_cliente.outcomes.cliente_se_disculpa_y_renueva.result_text: "Caught red-handed, the client backs down sheepishly, signs a renewal, and your teammate closes ranks with you."
empleados_cliente_intenta_fichar_directo.choices.agradecer_lealtad_y_cortar_al_cliente.outcomes.rompes_con_cliente_desleal.result_text: "The client gets huffy and you part ways, earning ironclad loyalty inside the studio that money cannot buy."
empleados_cliente_intenta_fichar_directo.choices.subir_tarifa_y_blindar_clausula.label: "Add a non-solicitation clause on renewal without making a scene"
empleados_cliente_intenta_fichar_directo.choices.subir_tarifa_y_blindar_clausula.result_text: "You tighten contract terms with legal poise and make the price of fishing in your pond crystal clear."
empleados_cliente_intenta_fichar_directo.choices.hacer_como_que_no_has_visto_nada.label: "Stay silent out of fear of losing that account's revenue this quarter"
empleados_cliente_intenta_fichar_directo.choices.hacer_como_que_no_has_visto_nada.result_text: "You keep the monthly billing intact while looking spineless in front of the person who warned you upfront."

empleados_colaborador_externo_exclusividad.title: "Your Subcontractor Publicly Tags Your Best Client"
empleados_colaborador_externo_exclusividad.body: "Staying payroll-free after five years keeps overhead light, yet requires guarding boundaries: a freelancer you subcontract overflow to starts showcasing your project online and tagging the client's executives."
empleados_colaborador_externo_exclusividad.choices.firmar_marca_blanca_con_tarifa_justa.label: "Sign a white-label addendum with a slight rate bump (€160)"
empleados_colaborador_externo_exclusividad.choices.firmar_marca_blanca_con_tarifa_justa.result_text: "Clear terms and fair pay defuse temptation: the tags come down quietly and you both keep billing in peace."
empleados_colaborador_externo_exclusividad.choices.cortar_colaboracion_y_rotar_proveedor.label: "Revoke access after this milestone and handle the account solo"
empleados_colaborador_externo_exclusividad.choices.cortar_colaboracion_y_rotar_proveedor.result_text: "You protect your direct client tie at the root, eating two intense keyboard weeks while rotating backups."
empleados_colaborador_externo_exclusividad.choices.dejarlo_pasar_por_no_tener_conversacion_incomoda.label: "Let it slide to avoid an awkward confrontation mid-delivery"
empleados_colaborador_externo_exclusividad.choices.dejarlo_pasar_por_no_tener_conversacion_incomoda.outcomes.queda_en_ego_de_escaparate.result_text: "It turns out to be harmless portfolio vanity and nothing blows up on this phase."
empleados_colaborador_externo_exclusividad.choices.dejarlo_pasar_por_no_tener_conversacion_incomoda.outcomes.puenteo_comercial_siguiente_fase.result_text: "Next month you learn they pitched the client a cheaper direct quote behind your back for phase two."

empleados_dani_ascenso_semi_senior.title: "Dani Asks to Outgrow the Junior Label"
empleados_dani_ascenso_semi_senior.body: "That kid with the giant thermos and forty open tabs has been shipping clean work unassisted for months. Dani asks for thirty minutes with a neat notebook: he is ready for a mid-level title and real ownership."
empleados_dani_ascenso_semi_senior.choices.ascender_categoria_y_dar_cuentas_propias.label: "Promote his pay band and hand him direct studio accounts"
empleados_dani_ascenso_semi_senior.choices.ascender_categoria_y_dar_cuentas_propias.result_text: "Training talent in-house pays off handsomely: Dani steps up with contagious pride and frees your calendar."
empleados_dani_ascenso_semi_senior.choices.dar_titulo_nuevo_y_prima_puntual.label: "Upgrade his title, pay a spot bonus (€250), and review pay in six months"
empleados_dani_ascenso_semi_senior.choices.dar_titulo_nuevo_y_prima_puntual.result_text: "You recognize his growth without spiking fixed monthly payroll overnight and strengthen his pride in the studio."
empleados_dani_ascenso_semi_senior.choices.pedirle_otro_ano_de_rodaje_igual.label: "Tell him he still needs another year of seasoning before touching pay"
empleados_dani_ascenso_semi_senior.choices.pedirle_otro_ano_de_rodaje_igual.result_text: "Dani nods quietly and ships the pending milestone, though you just gave recruiters every reason to catch his eye."

empleados_dimision_silenciosa_desgaste.title: "Two-Syllable Replies and Zero Initiative"
empleados_dimision_silenciosa_desgaste.body: "You feel it in every detail: camera off whenever possible, tasks completed to the barest literal spec, and zero fresh ideas. Accumulated burnout has triggered quiet quitting inside your studio."
empleados_dimision_silenciosa_desgaste.choices.sentarse_a_escuchar_y_reajustar_carga.label: "Own your management slips, prune fake emergencies, and give two days off (€180)"
empleados_dimision_silenciosa_desgaste.choices.sentarse_a_escuchar_y_reajustar_carga.result_text: "Listening without defensiveness clears months of bottled-up frustration; by next week the studio breathes again."
empleados_dimision_silenciosa_desgaste.choices.apretar_tuercas_y_exigir_ritmo.label: "Demand sharper energy while reminding how hard it is to make payroll"
empleados_dimision_silenciosa_desgaste.choices.apretar_tuercas_y_exigir_ritmo.outcomes.cumplimiento_helado.result_text: "Work gets delivered with icy robotic compliance by day while résumés go out every evening at home."
empleados_dimision_silenciosa_desgaste.choices.apretar_tuercas_y_exigir_ritmo.outcomes.carta_baja_voluntaria_lunes.result_text: "First thing Monday morning, formal resignation lands on your desk. You pay zero severance and inherit every open task."
empleados_dimision_silenciosa_desgaste.choices.pactar_salida_ordenada_mutuo_acuerdo.label: "Agree the chapter has run its course and settle a clean exit (€620)"
empleados_dimision_silenciosa_desgaste.choices.pactar_salida_ordenada_mutuo_acuerdo.result_text: "You sign an orderly handover with zero personal drama and lighten your monthly fixed overhead."

empleados_formacion_ia_plantilla.title: "Free AI Shortcuts and Client Confidentiality"
empleados_formacion_ia_plantilla.body: "You spot your employee pasting raw client drafts into free public AI tools to speed through tasks. It shaves hours off the clock, yet a single privacy leak could torpedo your studio's reputation."
empleados_formacion_ia_plantilla.choices.licencia_privada_y_protocolo_equipo.label: "Pay for a private zero-training license and hands-on workshop (€240)"
empleados_formacion_ia_plantilla.choices.licencia_privada_y_protocolo_equipo.result_text: "You capture the productivity boost with proper confidentiality guardrails and human judgment in charge."
empleados_formacion_ia_plantilla.choices.redactar_guia_interna_sin_datos_sensibles.label: "Allow usage strictly on anonymized text with mandatory review"
empleados_formacion_ia_plantilla.choices.redactar_guia_interna_sin_datos_sensibles.result_text: "Half a morning's rulebook sets sensible boundaries without spending extra cash or killing technical curiosity."
empleados_formacion_ia_plantilla.choices.prohibicion_tajante_y_bronca.label: "Ban every assistant outright after a tense dressing-down"
empleados_formacion_ia_plantilla.choices.prohibicion_tajante_y_bronca.result_text: "Client confidentiality stays locked down by decree, leaving a chill of distrust and slower manual grind."

empleados_iniciativa_cliente_referido.title: "A Warm Client Referral Straight from Your Team"
empleados_iniciativa_cliente_referido.body: "Treating staff well pays unexpected dividends: a direct contact of your employee requests a quote with zero haggling after hearing glowing praise about how seriously and humanely your studio works."
empleados_iniciativa_cliente_referido.choices.firmar_encargo_y_dar_comision_captacion.label: "Sign the project and add a finder's bonus on payroll (€260)"
empleados_iniciativa_cliente_referido.choices.firmar_encargo_y_dar_comision_captacion.result_text: "The client signs happily and your employee sees firsthand that pulling together shares real rewards."
empleados_iniciativa_cliente_referido.choices.convertirlo_en_iguala_compartida.label: "Set up a calm monthly retainer led directly by your teammate"
empleados_iniciativa_cliente_referido.choices.convertirlo_en_iguala_compartida.result_text: "You lock in clean recurring revenue while giving your hire genuine ownership over the account."
empleados_iniciativa_cliente_referido.choices.aceptar_proyecto_y_reservar_margen.label: "Give warm public thanks, bill the project, and keep the full margin"
empleados_iniciativa_cliente_referido.choices.aceptar_proyecto_y_reservar_margen.result_text: "The invoice pads your quarter nicely, even if a tangible thank-you bonus would have sealed the moment."

empleados_inspeccion_control_horario.title: "Labor Inspectorate Request for Time-Tracking Logs"
empleados_inspeccion_control_horario.body: "An official labor notice lands electronically: ten business days to submit signed daily start, break, and finish logs for the past four months. Time to open the studio's clock-in folder."
empleados_inspeccion_control_horario.choices.aportar_historico_digital_impecable.label: "Export your up-to-date signed digital log in two clicks and file it"
empleados_inspeccion_control_horario.choices.aportar_historico_digital_impecable.result_text: "Thank goodness you set up proper time tracking early: the audit closes spotless inside forty-eight hours."
empleados_inspeccion_control_horario.choices.pagar_laboralista_y_ordenar_partes.label: "Hire urgent labor counsel to cure formal record gaps (€310)"
empleados_inspeccion_control_horario.choices.pagar_laboralista_y_ordenar_partes.result_text: "A labor specialist organizes proper annexes, sets up real daily logging, and closes the file penalty-free."
empleados_inspeccion_control_horario.choices.improvisar_hojas_a_ultima_hora.label: "Scramble to piece backlogged sheets together before the deadline"
empleados_inspeccion_control_horario.choices.improvisar_hojas_a_ultima_hora.outcomes.apercibimiento_leve_sin_multa.result_text: "You escape with a formal warning to fix logging immediately and a racing pulse that lasts all month."
empleados_inspeccion_control_horario.choices.improvisar_hojas_a_ultima_hora.outcomes.sancion_leve_por_defectos_forma.result_text: "The inconsistencies stick out a mile away: an administrative fine lands alongside mandatory digital logging."

empleados_laura_ponencia_congreso_sector.title: "Laura Gets Invited to Keynote an Industry Conference"
empleados_laura_ponencia_congreso_sector.body: "Organizers of a flagship national conference invite Laura to deliver a Friday talk. Putting your studio's name onstage brings real prestige—though the venue lobby will be swarming with recruiters."
empleados_laura_ponencia_congreso_sector.choices.patrocinar_viaje_e_ir_juntos_orgulloso.label: "Sponsor travel and hotel as a studio (€290) and cheer from row one"
empleados_laura_ponencia_congreso_sector.choices.patrocinar_viaje_e_ir_juntos_orgulloso.result_text: "Laura nails the keynote, two serious leads ask for your card offstage, and she values your confident backing."
empleados_laura_ponencia_congreso_sector.choices.autorizar_viernes_sin_exponer_casos.label: "Grant paid Friday leave after agreeing which internal metrics stay private"
empleados_laura_ponencia_congreso_sector.choices.autorizar_viernes_sin_exponer_casos.result_text: "You back her professional profile naturally while keeping sensitive client figures under wraps."
empleados_laura_ponencia_congreso_sector.choices.vetar_asistencia_por_carga_viernes.label: "Ask her to decline the talk because Friday deadlines are tight"
empleados_laura_ponencia_congreso_sector.choices.vetar_asistencia_por_carga_viernes.result_text: "You save one billable Friday at the cost of a small-minded gesture a senior specialist does not forget easily."

empleados_paga_extra_verano.title: "Summer Bonus Hopes in Quarterly Tax Month"
empleados_paga_extra_verano.body: "Summer heat arrives and, although extra pay is prorated on paper, your employee gently asks whether there might be a mid-year bonus after six strong months. Second-quarter taxes are due in ten days."
empleados_paga_extra_verano.choices.diferir_gratificacion_a_septiembre.label: "Explain July's tax hit honestly and pay half a bonus now (€190)"
empleados_paga_extra_verano.choices.diferir_gratificacion_a_septiembre.result_text: "Straight talk about studio cash flow works wonders: the gesture lands warmly without draining your tax reserve."
empleados_paga_extra_verano.choices.abonar_gratificacion_verano_completa.label: "Include a full deductible summer bonus on this month's payslip (€450)"
empleados_paga_extra_verano.choices.abonar_gratificacion_verano_completa.result_text: "Your teammate heads into summer grinning ear to ear and returns energized for the autumn push."
empleados_paga_extra_verano.choices.recordar_prorrateo_sin_extra.label: "Politely remind them that fourteen payslips are already prorated monthly"
empleados_paga_extra_verano.choices.recordar_prorrateo_sin_extra.result_text: "Not a single extra euro leaves your account, though enthusiasm for covering summer emergencies cools noticeably."

empleados_propuesta_mejora_procesos.title: "An Internal Playbook Saving Ten Hours a Week"
empleados_propuesta_mejora_procesos.body: "High morale leaves room to think ahead: your employee has drafted a set of kickoff templates and QA checklists that trim dead time on every project, asking for two meeting-free afternoons to roll it out."
empleados_propuesta_mejora_procesos.choices.bloquear_dos_tardes_e_implantar_todo.label: "Clear two call-free afternoons and reward the initiative (€180)"
empleados_propuesta_mejora_procesos.choices.bloquear_dos_tardes_e_implantar_todo.result_text: "The new workflow clicks like clockwork: fewer silly mistakes, cleaner handoffs, and shared pride of authorship."
empleados_propuesta_mejora_procesos.choices.aplicar_mejoras_poco_a_poco.label: "Adopt the new templates gradually between deliveries without pausing"
empleados_propuesta_mejora_procesos.choices.aplicar_mejoras_poco_a_poco.result_text: "You capture most of the organizational upgrade without slowing down this week's billable output."

empleados_reparto_beneficios_anual.title: "A Strong Veteran Year and Sharing the Pie"
empleados_reparto_beneficios_anual.body: "More than five years in, the studio closes a healthy fiscal year. Your employee knows the billing pace inside out, raising the classic veteran call: share a profit bonus or hoard every euro in reserves."
empleados_reparto_beneficios_anual.choices.repartir_prima_variable_transparente.label: "Pay an annual profit-share bonus and set clear next-year targets (€690)"
empleados_reparto_beneficios_anual.choices.repartir_prima_variable_transparente.result_text: "Sharing strong years builds the kind of long-term commitment no pep talk could ever buy."
empleados_reparto_beneficios_anual.choices.dar_gratificacion_moderada_y_dias_libres.label: "Pay a modest bonus (€280) plus three floating long-weekend days"
empleados_reparto_beneficios_anual.choices.dar_gratificacion_moderada_y_dias_libres.result_text: "You balance financial caution with real downtime, starting the new year on warm terms."
empleados_reparto_beneficios_anual.choices.guardar_todo_el_colchon_en_caja.label: "Keep the entire surplus in studio reserves just in case"
empleados_reparto_beneficios_anual.choices.guardar_todo_el_colchon_en_caja.result_text: "Your bank cushion sleeps warm and safe, though asking for extra hustle gets harder when good years stay invisible."

empleados_subida_cotizaciones_seguridad_social.title: "January's New Employer Social Security Hike"
empleados_subida_cotizaciones_seguridad_social.body: "The new year opens with statutory updates to contribution bases and employer surcharges: your employee takes home the exact same net pay, while your end-of-month bank debit grows without asking."
empleados_subida_cotizaciones_seguridad_social.choices.repercutir_alza_en_presupuestos_nuevos.label: "Nudge new client quotes up five percent to absorb the surcharge"
empleados_subida_cotizaciones_seguridad_social.choices.repercutir_alza_en_presupuestos_nuevos.result_text: "You pass the cost hike through commercially without drama and protect the studio's operating margin."
empleados_subida_cotizaciones_seguridad_social.choices.asumir_sobrecoste_contra_margen.label: "Swallow the hike out of your own margin rather than touching rates"
empleados_subida_cotizaciones_seguridad_social.choices.asumir_sobrecoste_contra_margen.result_text: "You dodge pricing talks with clients while your fixed monthly overhead takes one more quiet bite."
empleados_subida_cotizaciones_seguridad_social.choices.recortar_extras_internos_para_compensar.label: "Trim training, coffee, and small studio perks to balance the ledger"
empleados_subida_cotizaciones_seguridad_social.choices.recortar_extras_internos_para_compensar.result_text: "The bank line balances on paper at the cost of a noticeably stingier office mood."

empleados_ultimatum_carga_mental.title: "'If We Keep Firefighting Like This, I'm Out'"
empleados_ultimatum_carga_mental.body: "Your employee asks to talk late Thursday with deep dark circles: 'I value this studio, yet I have spent weeks absorbing outside chaos and already have offers elsewhere.' You have to act today."
empleados_ultimatum_carga_mental.choices.blindar_horarios_y_prima_retencion.label: "Rein in chaotic clients today and sign a retention bonus (€480)"
empleados_ultimatum_carga_mental.choices.blindar_horarios_y_prima_retencion.result_text: "Backing words with immediate action stops the walkout and resets healthier boundaries for the whole studio."
empleados_ultimatum_carga_mental.choices.contratar_apoyo_puntual_para_aliviar.label: "Outsource repetitive grunt work this month to clear breathing room (€290)"
empleados_ultimatum_carga_mental.choices.contratar_apoyo_puntual_para_aliviar.result_text: "Taking the most thankless tasks off the desk right away buys genuine space to reorganize accounts."
empleados_ultimatum_carga_mental.choices.dejar_que_acepte_oferta_externa.label: "Refuse to promise calm you cannot deliver and wish them well"
empleados_ultimatum_carga_mental.choices.dejar_que_acepte_oferta_externa.result_text: "Your honesty earns a respectful goodbye; payroll ends with zero severance, leaving you solo at the helm again."
