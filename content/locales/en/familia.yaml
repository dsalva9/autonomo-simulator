"familia_visita_sorpresa_tuppers.choices.parar_a_tomar_cafe_y_comer_juntos.result_text": "Half a productive morning vanishes, leaving your freezer stocked for two weeks and your spirits noticeably warmer."
"familia_visita_sorpresa_tuppers.choices.recibirles_con_auricular_puesto.label": "Thank them for the containers at the door right before a call"
"familia_visita_sorpresa_tuppers.choices.recibirles_con_auricular_puesto.result_text": "Your schedule stays intact and you keep the stew, though your mother's hallway sigh echoes until Thursday."
"familia_visita_sorpresa_tuppers.choices.invitarles_tu_al_menu_del_dia.label": "Take them downstairs and treat them to the daily set lunch (48 €)"
"familia_visita_sorpresa_tuppers.choices.invitarles_tu_al_menu_del_dia.result_text": "Seeing you pick up the bill without flinching makes their week, and you return to your desk grinning."
