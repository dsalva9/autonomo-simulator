<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Sello gráfico de números rojos y descubierto">
  <!-- Stamp Ink Splatters -->
  <circle cx="34" cy="72" r="5.5" fill="#b42b24" stroke="#1f2421" stroke-width="1.6" />
  <circle cx="48" cy="56" r="3" fill="#b42b24" />
  <circle cx="222" cy="180" r="6" fill="#b42b24" stroke="#1f2421" stroke-width="1.6" />
  <circle cx="206" cy="198" r="3.5" fill="#b42b24" />
  <circle cx="58" cy="208" r="4" fill="#b42b24" opacity="0.85" />

  <!-- Tilted Heavy Bureaucratic Warning Emblem (100% Graphic Paths) -->
  <g transform="translate(128, 128) rotate(-11) translate(-106, -74)">
    <!-- Hard Offset Comic Ink Shadow -->
    <rect x="6" y="7" width="212" height="148" rx="12" fill="#1f2421" opacity="0.88" />

    <!-- Cream Dossier Backing with Warm Crimson Gouache Wash -->
    <rect x="0" y="0" width="212" height="148" rx="12" fill="#fffdf8" stroke="#1f2421" stroke-width="4" />
    <rect x="6" y="6" width="200" height="136" rx="8" fill="#f6efe0" stroke="#b42b24" stroke-width="4.5" />
    <rect x="13" y="13" width="186" height="122" rx="5" fill="none" stroke="#b42b24" stroke-width="2" stroke-dasharray="32 5 54 5 18 5" />

    <!-- Top Crimson Alert Bar with Wordless Warning Stripes & Triangle -->
    <rect x="20" y="20" width="172" height="26" rx="4" fill="#b42b24" stroke="#1f2421" stroke-width="2.5" />
    <!-- Diagonal Hazard Hatching Inside Header -->
    <path d="M 28 40 L 40 26 M 44 40 L 56 26 M 156 40 L 168 26 M 172 40 L 184 26" stroke="#fffdf8" stroke-width="2.6" stroke-linecap="round" opacity="0.7" />
    <!-- Central Warning Triangle Badge -->
    <polygon points="106,15 123,44 89,44" fill="#f7d98c" stroke="#1f2421" stroke-width="2.8" stroke-linejoin="round" />
    <line x1="106" y1="24" x2="106" y2="34" stroke="#1f2421" stroke-width="3" stroke-linecap="round" />
    <circle cx="106" cy="39.5" r="2" fill="#1f2421" />

    <!-- Left Graphic: Hand-Inked Vector Euro Symbol (€) -->
    <g transform="translate(26, 56)">
      <!-- Subtle Shadow Behind € -->
      <path d="M 48 16 C 32 8 12 18 12 38 C 12 58 32 68 48 60" fill="none" stroke="#1f2421" stroke-width="10" stroke-linecap="round" opacity="0.18" />
      <!-- Outer Ink Stroke of € -->
      <path d="M 46 14 C 30 6 10 16 10 36 C 10 56 30 66 46 58" fill="none" stroke="#1f2421" stroke-width="11" stroke-linecap="round" />
      <line x1="2" y1="29" x2="38" y2="29" stroke="#1f2421" stroke-width="9" stroke-linecap="round" />
      <line x1="2" y1="43" x2="35" y2="43" stroke="#1f2421" stroke-width="9" stroke-linecap="round" />
      <!-- Crimson Gouache Core of € -->
      <path d="M 46 14 C 30 6 10 16 10 36 C 10 56 30 66 46 58" fill="none" stroke="#b42b24" stroke-width="5.5" stroke-linecap="round" />
      <line x1="2" y1="29" x2="38" y2="29" stroke="#b42b24" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="43" x2="35" y2="43" stroke="#b42b24" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Right Graphic: Zero Baseline & Plunging Red Deficit Crash Chart -->
    <g transform="translate(88, 56)">
      <!-- Ledger Box -->
      <rect x="0" y="2" width="102" height="68" rx="4" fill="#fffdf8" stroke="#1f2421" stroke-width="2.5" />
      <!-- Red Deficit Zone Below Zero Line -->
      <rect x="2" y="30" width="98" height="38" fill="#b42b24" opacity="0.18" />
      <!-- Dashed Zero Baseline -->
      <line x1="6" y1="30" x2="96" y2="30" stroke="#373f3a" stroke-width="2.2" stroke-dasharray="6 5" />
      <!-- Plunging Jagged Red Crash Arrow -->
      <polyline points="10,16 32,26 48,20 70,46 88,58" fill="none" stroke="#1f2421" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
      <polyline points="10,16 32,26 48,20 70,46 88,58" fill="none" stroke="#b42b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Arrowhead -->
      <polygon points="94,62 74,61 87,44" fill="#b42b24" stroke="#1f2421" stroke-width="2.5" stroke-linejoin="round" />
    </g>
  </g>
</svg>
