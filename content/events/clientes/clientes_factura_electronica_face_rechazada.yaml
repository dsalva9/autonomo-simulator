schema_version: 1
id: clientes_factura_electronica_face_rechazada
category: clientes
title: Factura rechazada tres veces en el portal público
body: "Has entregado en plazo un encargo municipal, pero la plataforma electrónica devuelve tu factura por tercera vez: Intervención ha cambiado un dígito del código contable sin avisar y nadie coge el teléfono."
tags:
  - burocracia
  - administracion
  - face
  - liquidez
requirements:
  min_month: 8
weight: 10
cooldown_months: 11
max_occurrences: 4
exclusive_with: []
choices:
  - id: encargar_tramite_a_gestoria
    label: Pagar un trámite urgente a tu gestoría para que lidie con FACe
    requirements:
      gestor_tiers:
        - cheap
        - premium
    result_text: Tu gestoría habla fluido el dialecto administrativo, reemite el archivo XML exacto y el expediente pasa a pago aprobado.
    effects:
      billed_income: 1100
      deductible_expense: 85
      stress: -1
      moral: 5
      fiscal_risk: -2
  - id: plantarse_en_intervencion_presencial
    label: Pedir cita presencial a primera hora hasta cazar el código bueno
    result_text: Pierdes media mañana entre ventanillas, pero un funcionario compasivo te apunta el código en un pósit y desbloqueas el pago.
    effects:
      billed_income: 1100
      stress: 9
      moral: 0
      personal_life: -2
      reputation: 2
  - id: aparcar_tramite_este_mes
    label: Cerrar el portal hoy antes de lanzar el ratón por la ventana
    result_text: Apagas el ordenador para salvar la tensión arterial, asumiendo que sin el código corregido ese expediente seguirá bloqueado.
    effects:
      stress: -1
      moral: -3
      personal_life: 2
      reputation: -4
