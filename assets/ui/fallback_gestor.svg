<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-label="Categoría Gestoría">
  <defs>
    <linearGradient id="gesBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF5F1" />
      <stop offset="100%" stop-color="#CDE3DA" />
    </linearGradient>
    <pattern id="gesLedger" width="28" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="28" y2="20" stroke="#9EC4B6" stroke-width="1" opacity="0.6" />
      <line x1="28" y1="0" x2="28" y2="20" stroke="#E0A899" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base -->
  <rect x="0" y="0" width="512" height="320" rx="16" fill="url(#gesBg)" />
  <rect x="12" y="12" width="488" height="296" rx="12" fill="url(#gesLedger)" stroke="#2E6F65" stroke-width="2.5" />

  <!-- Header Tab -->
  <path d="M 28 12 L 214 12 L 230 36 L 28 36 Z" fill="#2E6F65" />
  <text x="42" y="29" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#F4FBF8" letter-spacing="1.2">EXP. ASESORÍA FISCAL</text>

  <!-- Backdrop Circle -->
  <circle cx="258" cy="166" r="98" fill="#7AB8A8" opacity="0.26" />

  <!-- A-Z Ring Binder Folder -->
  <g transform="translate(110, 62) rotate(-4)">
    <rect x="0" y="0" width="128" height="174" rx="6" fill="#2E6F65" stroke="#1F2421" stroke-width="3" />
    <rect x="10" y="0" width="16" height="174" fill="#1F4F47" />
    <!-- Spine Label -->
    <rect x="38" y="22" width="72" height="74" rx="4" fill="#FFFDF8" stroke="#1F2421" stroke-width="2" />
    <text x="74" y="44" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#1F2421">FACTURAS</text>
    <text x="74" y="64" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#C83E37">IVA / IRPF</text>
    <line x1="48" y1="78" x2="100" y2="78" stroke="#2E6F65" stroke-width="3" stroke-linecap="round" />
    <!-- Finger hole -->
    <circle cx="74" cy="136" r="14" fill="#EDE2CE" stroke="#1F2421" stroke-width="3" />
  </g>

  <!-- Printing Desk Calculator with Curling Receipt Tape -->
  <g transform="translate(254, 96) rotate(5)">
    <!-- Curling Paper Tape -->
    <path d="M 28 4 C 24 -36 52 -46 92 -38 C 102 -36 108 -18 98 4 Z" fill="#FFFDF8" stroke="#1F2421" stroke-width="2.5" />
    <line x1="42" y1="-26" x2="84" y2="-24" stroke="#2E6F65" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="-14" x2="78" y2="-12" stroke="#C83E37" stroke-width="2.5" stroke-linecap="round" />

    <!-- Calculator Body -->
    <rect x="0" y="0" width="138" height="148" rx="10" fill="#E6DEC8" stroke="#1F2421" stroke-width="3" />
    <!-- Green LCD Screen -->
    <rect x="16" y="16" width="106" height="32" rx="4" fill="#2A3B34" stroke="#1F2421" stroke-width="2" />
    <text x="114" y="38" text-anchor="end" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#7CE0A3">-21,00%</text>

    <!-- Buttons Grid -->
    <g fill="#FFFDF8" stroke="#1F2421" stroke-width="2">
      <rect x="16" y="62" width="22" height="18" rx="3" />
      <rect x="44" y="62" width="22" height="18" rx="3" />
      <rect x="72" y="62" width="22" height="18" rx="3" />
      <rect x="16" y="86" width="22" height="18" rx="3" />
      <rect x="44" y="86" width="22" height="18" rx="3" />
      <rect x="72" y="86" width="22" height="18" rx="3" />
      <rect x="16" y="110" width="50" height="20" rx="3" />
      <rect x="72" y="110" width="22" height="20" rx="3" />
    </g>
    <!-- Accent Keys -->
    <rect x="100" y="62" width="22" height="28" rx="3" fill="#D98A2B" stroke="#1F2421" stroke-width="2" />
    <rect x="100" y="96" width="22" height="34" rx="3" fill="#2E6F65" stroke="#1F2421" stroke-width="2" />
  </g>

  <!-- Stamp Badge -->
  <g transform="translate(36, 246) rotate(-3)">
    <rect x="0" y="0" width="228" height="42" rx="5" fill="#EBF5F1" fill-opacity="0.92" stroke="#23574F" stroke-width="3" />
    <rect x="4" y="4" width="220" height="34" rx="3" fill="none" stroke="#23574F" stroke-width="1.2" />
    <text x="114" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#23574F" letter-spacing="1.4">LIBRO DE GASTOS</text>
  </g>
</svg>
