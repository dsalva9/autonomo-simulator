schema_version: 1
id: gestor_revision_estrategia_anual
category: gestor
title: "Revisión de estrategia antes del cierre anual"
body: "Se acerca el cierre del ejercicio fiscal y Elena Montes convoca reunión estratégica: aún estás a tiempo de ordenar amortizaciones, calibrar retenciones y planificar gastos deducibles antes de que diciembre selle el año."
tags:
  - planificacion
  - cierre_anual
  - estrategia
character_id: gestor_premium_elena
character_expression: neutral
illustration_id: null
requirements:
  min_month: 10
  months_of_year:
    - 10
    - 11
    - 12
  gestor_tiers:
    - premium
weight: 11
cooldown_months: 9
max_occurrences: 4
exclusive_with: []
choices:
  - id: cerrar_ejercicio_sin_cambios
    label: "Dejar el ejercicio tal cual está y no tocar lo que funciona"
    result_text: "Cierras carpetas sin gastar un euro extra hoy, confiando en que la liquidación anual venga mansa."
    effects:
      stress: -3
      moral: 1
      fiscal_risk: 4
  - id: ajustar_retenciones_cierre_elena
    label: "Reordenar vencimientos y amortizaciones pendientes sin gastar caja (75 €)"
    result_text: "Elena ajusta las tablas de amortización y el calendario de facturas de diciembre con precisión quirúrgica."
    effects:
      deductible_expense: 75
      stress: -5
      moral: 4
      fiscal_risk: -8
  - id: ejecutar_plan_cierre_con_gestoria
    label: "Ejecutar el plan completo de optimización anual con Elena (180 €)"
    requirements:
      stats:
        money:
          min: 350
    result_text: "Reordenáis vencimientos y gastos deducibles al milímetro, reduciendo tus costes operativos durante todo el arranque del próximo año."
    effects:
      deductible_expense: 180
      add_modifier:
        id: mod_plan_cierre_anual
        label: "Cierre fiscal optimizado"
        remaining_months: 4
        monthly_expense_delta: -90
        monthly_stress_delta: -1
      moral: 5
      fiscal_risk: -11
