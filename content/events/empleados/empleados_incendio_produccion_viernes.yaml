schema_version: 1
id: empleados_incendio_produccion_viernes
category: empleados
title: "Viernes a las siete: carpeta equivocada"
body: "Faltan diez minutos para cerrar la semana cuando Dani palidece frente al monitor con el termo en la mano: al limpiar archivos temporales ha machacado la versión final que el cliente presenta el lunes a primera hora, y la copia automática está a medias."
tags:
  - plantilla
  - junior
  - error
  - incendio
character_id: empleado_junior_dani
character_expression: stressed
illustration_id: null
requirements:
  min_month: 6
  has_employee: true
  forbidden_flags:
    - empleada_laura_activa
weight: 8
cooldown_months: 12
max_occurrences: 3
exclusive_with: []
choices:
  - id: mentorizar_y_reconstruir_juntos
    label: "Respirar hondo, pedir cena y reconstruir la entrega codo con codo"
    outcomes:
      - id: rescate_y_aprendizaje
        weight: 75
        result_text: "Rehacéis el entregable antes de medianoche y dejáis montado un sistema de copias a prueba de bombas. Dani aprende en una tarde lo que no enseñan tres cursos."
        effects:
          deductible_expense: 160
          moral: 5
          stress: 6
          personal_life: -4
          reputation: 3
          add_modifier:
            id: protocolo_calidad_estudio
            label: "Protocolo de copias y revisión en estudio"
            remaining_months: 4
            monthly_billed_delta: 220
            monthly_stress_delta: -1
      - id: salvado_sobre_la_bocina
        weight: 25
        result_text: "Cuesta medio sábado recuperar las piezas sueltas, pero el lunes a las 8:55 el cliente recibe todo en orden sin enterarse del susto."
        effects:
          cash_delta: -90
          moral: 1
          stress: 10
          personal_life: -6
  - id: echar_bronca_y_dejarlo_solo
    label: "Echarle la bronca del siglo y exigirle que lo arregle él solo el fin de semana"
    outcomes:
      - id: chapuza_detectada_por_cliente
        weight: 60
        result_text: "Sin supervisión y muerto de nervios, Dani entrega un parche con fallos visibles. Toca aplicar descuento comercial el lunes y aguantar un ambiente fúnebre en la oficina."
        effects:
          cash_delta: -600
          moral: -6
          stress: 10
          reputation: -7
          set_flags:
            - desgaste_plantilla
          schedule_events:
            - event_id: empleados_negociacion_condiciones
              delay_months: 2
              probability: 0.55
      - id: parche_con_ojeras
        weight: 40
        result_text: "Dani empalma el sábado entero y logra salvar los muebles por su cuenta, pero el lunes apenas levanta la vista del teclado."
        effects:
          moral: -5
          stress: 3
          reputation: -1
          set_flags:
            - desgaste_plantilla
  - id: dar_la_cara_y_pedir_margen
    label: "Llamar tú mismo al cliente, asumir el fallo como estudio y pactar entrega el martes"
    result_text: "Asumes la responsabilidad sin señalar a nadie y compensas la demora con un pequeño ajuste comercial. Pierdes algo de margen hoy, pero ganas respeto dentro y fuera."
    effects:
      cash_delta: -250
      moral: 3
      stress: 4
      reputation: -2
