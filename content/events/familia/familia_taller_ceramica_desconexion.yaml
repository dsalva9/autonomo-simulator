        monthly_moral_delta: 1
  - id: ir_a_clase_de_prueba_suelta
    label: "Probar una sesión suelta de sábado sin atarte el calendario (30 €)"
    result_text: "Pasas una mañana estupenda manchándote hasta los codos y vuelves a casa con una taza torcida y buen humor."
