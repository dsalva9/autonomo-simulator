schema_version: 1
id: clientes_pagare_corporativo_noventa_dias
category: clientes
title: Un pagaré en papel como en mil novecientos noventa
body: "Al cerrar un gran pedido corporativo, Marta te avisa de que Tesorería no hace transferencias: pagan con un pagaré físico en papel a noventa días que tendrás que recoger en recepción o descontar en tu banco."
tags:
  - pagare
  - corporativo
  - liquidez
  - cadena_pagare
character_id: cliente_corporativo_marta
character_expression: neutral
requirements:
  min_month: 5
weight: 11
cooldown_months: 12
max_occurrences: 4
exclusive_with: []
choices:
  - id: guardar_pagare_hasta_vencimiento
    label: Ejecutar el pedido y custodiar el pagaré los noventa días
    result_text: Custodias ese papelito timbrado como si fuera el anillo único esperando que dentro de tres meses haya fondos y nadie ponga pegas.
    effects:
      deferred_invoice:
        amount: 1900
        delay_months: 3
        default_prob: 0.1
      stress: 10
      moral: -5
      reputation: 1
      schedule_events:
        - event_id: clientes_renovacion_pagare_tesoreria
          delay_months: 3
  - id: descontar_pagare_en_banco
    label: Aceptar y descontar el pagaré en el banco asumiendo comisión (180 €)
    result_text: El director de la sucursal se frota las manos con los intereses, pero sales con liquidez inmediata y desgravas los gastos financieros.
    effects:
      billed_income: 1600
      deductible_expense: 180
      stress: 7
      moral: -4
      reputation: 1
      schedule_events:
        - event_id: clientes_renovacion_pagare_tesoreria
          delay_months: 3
  - id: rechazar_pedido_con_pagare
    label: "No firmar el pedido: solo trabajas mediante transferencia bancaria"
    result_text: Renuncias al contrato antes de coleccionar papel timbrado del siglo pasado y te ahorras tres meses de suspense financiero.
    effects:
      stress: -1
      moral: 1
      personal_life: 2
      reputation: -4
