    label: Aportar tickets de cenas y capturas de grupos de amigos
    outcomes:
      - id: gastos_compartidos_acreditados
        weight: 60
        result_text: Tras leer tres conversaciones sobre pizzas y regalos de cumpleaños, Gómez archiva las partidas domésticas.
