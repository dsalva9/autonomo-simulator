    label: Aceptar solo si firma tarifa exprés festiva y resolverlo en una hora
    requirements:
      stats:
        reputation:
          min: 50
    result_text: "Con tu prestigio aprueban los 850 € festivos al instante: despachas el ajuste en cuarenta minutos y llegas a tiempo a los langostinos."
