  <path d="M 62 102 L 174 102 L 166 188 C 164 204 72 204 70 188 Z" fill="#D96B43" stroke="#1F2421" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Cream Band & Lightning Caffeine Emblem -->
