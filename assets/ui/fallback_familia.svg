<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-label="Categoría Familia y Vida Personal">
  <defs>
    <linearGradient id="famBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF2EC" />
      <stop offset="100%" stop-color="#F2D7C7" />
    </linearGradient>
    <pattern id="famDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#DFAC93" opacity="0.55" />
    </pattern>
  </defs>

  <!-- Base -->
  <rect x="0" y="0" width="512" height="320" rx="16" fill="url(#famBg)" />
  <rect x="12" y="12" width="488" height="296" rx="12" fill="url(#famDots)" stroke="#C9643B" stroke-width="2.5" />

  <!-- Header Tab -->
  <path d="M 28 12 L 214 12 L 230 36 L 28 36 Z" fill="#D96B43" />
  <text x="42" y="29" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFDF9" letter-spacing="1.2">EXP. VIDA PERSONAL</text>

  <!-- Warm Sun Circle -->
  <circle cx="256" cy="164" r="98" fill="#F4A27E" opacity="0.28" />

  <!-- Framed Weekend Photo / Home -->
  <g transform="translate(114, 68) rotate(-5)">
    <rect x="0" y="0" width="150" height="162" rx="8" fill="#FFFDF9" stroke="#1F2421" stroke-width="3" />
    <rect x="12" y="12" width="126" height="110" rx="4" fill="#DCECE5" stroke="#1F2421" stroke-width="2" />
    <!-- Little house & sun inside photo -->
    <circle cx="106" cy="40" r="14" fill="#F2B84B" />
    <polygon points="44,78 75,50 106,78" fill="#D96B43" stroke="#1F2421" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="52" y="78" width="46" height="44" fill="#FFFDF9" stroke="#1F2421" stroke-width="2.5" />
    <rect x="69" y="96" width="12" height="26" fill="#5D8A66" stroke="#1F2421" stroke-width="2" />
    <!-- Heart below photo -->
    <path d="M 75 148 C 75 148 61 138 61 131 A 7 7 0 0 1 75 129 A 7 7 0 0 1 89 131 C 89 138 75 148 75 148 Z" fill="#D96B43" />
  </g>

  <!-- Two Clinking Cups / Tapas Moment -->
  <g transform="translate(264, 128)">
    <!-- Left Cup -->
    <g transform="rotate(-8 34 46)">
      <path d="M 10 24 L 54 24 L 48 74 C 47 82 17 82 16 74 Z" fill="#5D8A66" stroke="#1F2421" stroke-width="3" />
      <path d="M 10 28 C 0 28 0 54 12 56" fill="none" stroke="#1F2421" stroke-width="3" />
    </g>
    <!-- Right Cup -->
    <g transform="translate(56, 4) rotate(8 34 46)">
      <path d="M 10 24 L 54 24 L 48 74 C 47 82 17 82 16 74 Z" fill="#E89973" stroke="#1F2421" stroke-width="3" />
      <path d="M 54 28 C 64 28 64 54 52 56" fill="none" stroke="#1F2421" stroke-width="3" />
    </g>
    <!-- Sparkle between cups -->
    <path d="M 60 6 L 63 16 L 73 19 L 63 22 L 60 32 L 57 22 L 47 19 L 57 16 Z" fill="#F2B84B" stroke="#1F2421" stroke-width="2" />
  </g>

  <!-- Buzzing Phone Interrupting Weekend -->
  <g transform="translate(362, 62) rotate(12)">
    <rect x="0" y="0" width="58" height="98" rx="9" fill="#2B302C" stroke="#1F2421" stroke-width="3" />
    <rect x="6" y="12" width="46" height="70" rx="4" fill="#FFF7E2" />
    <circle cx="29" cy="40" r="11" fill="#E05347" />
    <text x="29" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">!</text>
    <line x1="14" y1="62" x2="44" y2="62" stroke="#1F2421" stroke-width="2.5" stroke-linecap="round" />
    <!-- Vibration Waves -->
    <path d="M -9 22 L -14 34 L -8 46" fill="none" stroke="#D96B43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 67 22 L 72 34 L 66 46" fill="none" stroke="#D96B43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Stamp Badge -->
  <g transform="translate(36, 246) rotate(-3)">
    <rect x="0" y="0" width="224" height="42" rx="5" fill="#FDF2EC" fill-opacity="0.92" stroke="#B8522E" stroke-width="3" />
    <rect x="4" y="4" width="216" height="34" rx="3" fill="none" stroke="#B8522E" stroke-width="1.2" />
    <text x="112" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#B8522E" letter-spacing="1.4">CONCILIACIÓN 404</text>
  </g>
</svg>
