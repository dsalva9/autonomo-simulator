          stress: 8
          moral: 5
          personal_life: -3
          fiscal_risk: -14
      - id: abonos_sueltos_recalificados
        weight: 40
        result_text: Cuatro envíos con conceptos bromistas no cuelan como cena y Gómez abre propuesta sobre ingresos no declarados.
