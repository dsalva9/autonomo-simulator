<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Sello de Números Rojos">
  <!-- Ink Splatters Around Stamp -->
  <circle cx="40" cy="78" r="5" fill="#C83E37" opacity="0.75" />
  <circle cx="52" cy="64" r="3" fill="#C83E37" opacity="0.65" />
  <circle cx="218" cy="176" r="6" fill="#C83E37" opacity="0.75" />
  <circle cx="204" cy="192" r="3.5" fill="#C83E37" opacity="0.65" />
  <circle cx="66" cy="204" r="4" fill="#C83E37" opacity="0.6" />

  <!-- Tilted Heavy Bureaucratic Rubber Stamp -->
  <g transform="translate(128, 128) rotate(-12) translate(-108, -72)">
    <!-- Soft Red Paper Tint Backing for Legibility Over Any Surface -->
    <rect x="0" y="0" width="216" height="144" rx="10" fill="#FFF5F4" fill-opacity="0.94" stroke="#C83E37" stroke-width="6" />
    <rect x="9" y="9" width="198" height="126" rx="5" fill="none" stroke="#C83E37" stroke-width="2.5" stroke-dasharray="28 4 64 4" />

    <!-- Top Warning Header -->
    <rect x="20" y="20" width="176" height="24" rx="3" fill="#C83E37" />
    <text x="108" y="37" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#FFF5F4" letter-spacing="1.6">AVISO BANCARIO</text>

    <!-- Main Bold Stamp Text -->
    <text x="108" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="900" fill="#9E2A25" letter-spacing="0.8">NÚMEROS</text>
    <text x="108" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#C83E37" letter-spacing="1.8">ROJOS</text>

    <!-- Downward Crash Arrow & Sub-caption -->
    <polyline points="26,112 52,122 72,114 96,126" fill="none" stroke="#9E2A25" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="87,127 97,126 93,117" fill="none" stroke="#9E2A25" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="190" y="124" text-anchor="end" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#9E2A25">DESCUBIERTO</text>
  </g>
</svg>
