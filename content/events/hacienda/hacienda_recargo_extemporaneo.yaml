schema_version: 1
id: hacienda_recargo_extemporaneo
category: hacienda
title: "Liquidación de recargo por presentación extemporánea"
body: "Una autoliquidación entró con cuarenta y ocho horas de retraso por un baile de dígitos en el IBAN y el sistema automático no perdona: recibes carta de pago con recargo por declaración extemporánea sin requerimiento previo."
tags:
  - recargo
  - plazos
  - apremio
character_id: hacienda_inspector_gomez
character_expression: neutral
illustration_id: null
requirements:
