schema_version: 1
id: clientes_proyecto_escaparate
category: clientes
title: «Presupuesto hay poquito, pero te verá todo el sector»
body: Un festival cultural de relumbrón te ofrece firmar su campaña principal. Pagan poco más que los costes, pero Borja jura que la repercusión en prensa especializada te pondrá en el mapa nacional.
tags:
  - visibilidad
  - portfolio
  - prestigio
character_id: cliente_regateador
character_expression: neutral
illustration_id: null
requirements:
  min_month: 3
weight: 10
cooldown_months: 10
max_occurrences: 3
exclusive_with: []
choices:
  - id: presupuestar_sin_rebaja
    label: "Pasar tarifa comercial normal: en el súper no aceptan prestigio"
    result_text: Recortan el alcance a lo que realmente pueden pagar y cobras un encargo digno sin regalar noches.
    effects:
      billed_income: 950
      stress: 4
      moral: 3
      reputation: 2
  - id: apostar_por_el_escaparate
    label: Volcarte para lucir músculo creativo y ganar prestigio
    outcomes:
      - id: escaparate_real
        weight: 65
        result_text: "Por una vez en la historia, la visibilidad existía: varios medios citan tu autoría y te llegan consultas de clientes con presupuesto de adulto."
        effects:
          billed_income: 450
          deductible_expense: 110
          stress: 8
          moral: 6
          reputation: 9
          set_flags:
            - portfolio_actualizado
      - id: creditos_recortados
        weight: 35
        result_text: El proyecto queda precioso, pero en la nota de prensa olvidan poner tu nombre y agradecen solo al patrocinador de cervezas.
        effects:
          billed_income: 450
          stress: 10
          moral: -6
          reputation: 2
  - id: pasar_del_festival
    label: Agradecer la invitación y guardar energías para quien pague en euros
    result_text: Ves la inauguración desde el sofá sin ojeras ni rencor.
    effects:
      stress: -5
      moral: 1
      personal_life: 4
