schema_version: 1
id: empleados_iniciativa_cliente_referido
category: empleados
title: "Un cliente nuevo entra recomendado por tu equipo"
body: "Cuidar a la gente tiene premio inesperado: un contacto directo de tu persona en plantilla pide presupuesto sin regatear porque «le han contado maravillas del rigor y el buen trato de vuestro estudio»."
tags:
