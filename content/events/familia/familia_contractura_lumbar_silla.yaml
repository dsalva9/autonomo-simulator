    label: "Parar cuarenta y ocho horas, caminar suave y retrasar lo secundario"
    result_text: "Bajas el ritmo antes de romperte del todo. Pierdes algo de tracción comercial esta semana, pero vuelves a caminar erguido."
    effects:
      stress: -7
      moral: 4
      personal_life: 6
      reputation: -2
