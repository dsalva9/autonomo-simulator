      cash_delta: 18000
      reputation: 6
      moral: 4
      add_modifier:
        id: mod_cuota_prestamo_participativo
        label: "Devolución de préstamo participativo"
        remaining_months: 12
        monthly_expense_delta: 1200
  - id: rechazar_y_mantener_cien_por_cien
    label: "Declinar la oferta y seguir siendo dueño del 100 %"
    result_text: "Prefieres crecer con tus propias facturas antes que explicar tus vacaciones en una junta de socios. Cierras el dossier con calma absoluta."
    effects:
      moral: 8
      personal_life: 4
      stress: -4
