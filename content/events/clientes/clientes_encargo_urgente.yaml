title: «Era para ayer, pero es muy facilito»
body: "Borja te escribe con mayúsculas y tres signos de exclamación: necesita un entregable urgente porque se le ha caído su proveedor habitual. Jura que está todo clarísimo en un documento de media página sin puntuación."
tags:
  - urgencia
