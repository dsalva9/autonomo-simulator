schema_version: 1
id: clientes_concurso_acreedores_proyecto
category: clientes
title: Persiana bajada a mitad de proyecto
body: "A mitad de un gran proyecto tus correos rebotan y el BOE lo confirma: el cliente entra en concurso de acreedores. Borja susurra que antes de que llegue el administrador «igual rescatas 1.950 € en mano»."
tags:
  - concurso_acreedores
  - impago
  - liquidez
character_id: cliente_regateador
character_expression: neutral
illustration_id: null
requirements:
  min_month: 8
weight: 9
cooldown_months: 14
max_occurrences: 3
exclusive_with: []
choices:
  - id: rectificativa_iva_con_gestoria
    label: Emitir factura rectificativa con gestoría y recuperar el IVA (190 €)
    requirements:
      gestor_tiers:
        - cheap
        - premium
    result_text: Cumples los plazos legales al milímetro para no regalar encima el IVA de una factura incobrable y rescatas una pequeña compensación limpia dentro del procedimiento.
    effects:
      deductible_expense: 190
      cash_delta: 340
      stress: 5
      moral: 1
      fiscal_risk: -4
  - id: asumir_perdida_y_pasar_pagina
    label: Asumir la pérdida hoy y reciclar las piezas en tu catálogo
    result_text: Tragas saliva al tachar la previsión de cobro, cubres los gastos vivos de tu bolsillo y reciclas las mejores piezas en tu catálogo comercial.
    effects:
      cash_delta: -180
      stress: 7
      moral: -5
      reputation: 2
  - id: aceptar_arreglo_rapido_borja
    label: Aceptar el «arreglo en mano» de Borja antes del precinto judicial
    outcomes:
      - id: rescate_parcial_en_mano
        weight: 70
        result_text: Sales de aquella nave medio vacía con un sobre discreto que cubre parte de tus horas, aunque sabes que esa contabilidad la van a mirar con lupa en el juzgado.
        effects:
          cash_delta: 1950
          moral: -3
          stress: 6
          fiscal_risk: 18
          set_flags:
            - cobro_en_b_reciente
          schedule_events:
            - event_id: clientes_cliente_en_b_extorsion_tardia
              delay_months: 18
              probability: 0.3
              priority: high
            - event_id: hacienda_inspeccion_efectivo_tres_anos
              delay_months: 34
              probability: 0.3
              priority: high
      - id: cerradura_cambiada
        weight: 30
        result_text: La nave ya tiene precinto, pero Borja te alcanza en el aparcamiento con un sobre más flaco de 1.200 € en efectivo antes de desaparecer.
        effects:
          cash_delta: 1200
          moral: -3
          stress: 9
          fiscal_risk: 18
          set_flags:
            - cobro_en_b_reciente
          schedule_events:
            - event_id: clientes_cliente_en_b_extorsion_tardia
              delay_months: 18
              probability: 0.3
              priority: high
            - event_id: hacienda_inspeccion_efectivo_tres_anos
              delay_months: 34
              probability: 0.3
              priority: high
