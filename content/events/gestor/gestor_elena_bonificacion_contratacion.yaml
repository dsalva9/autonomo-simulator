schema_version: 1
id: gestor_elena_bonificacion_contratacion
category: gestor
title: Elena activa créditos formativos y bonificación laboral
body: Revisando los seguros sociales de tu estudio, Elena Montes detecta créditos de formación bonificada sin consumir y una reducción limpia en cotizaciones si formalizas un plan de carrera.
tags:
  - gestoria
  - elena
  - laboral
  - optimizacion_fiscal
character_id: gestor_premium_elena
character_expression: pleased
illustration_id: null
requirements:
  min_month: 14
  gestor_tiers:
    - premium
  has_employee: true
weight: 12
cooldown_months: 12
max_occurrences: 3
choices:
  - id: implantar_plan_carrera_y_credito_formativo
    label: Formalizar el plan formativo completo con anexo laboral (420 €)
    requirements:
      stats:
        money:
          min: 600
        fiscal_risk:
          max: 30
    result_text: Adelantas la inversión formativa deducible con trazabilidad impecable y la motivación de tu plantilla se dispara al ver carrera real.
    effects:
      deductible_expense: 420
      stress: 2
      moral: 4
      reputation: 4
      fiscal_risk: -6
      employee_satisfaction: 12
  - id: aplicar_solo_bonificacion_automatica_tgss
    label: Aplicar solo el crédito básico sin restar horas de entrega
    result_text: Aprovechas el descuento directo en el boletín mensual sin alterar el ritmo de producción del estudio.
    effects:
      cash_delta: 90
      stress: 2
      moral: 2
      fiscal_risk: -3
      employee_satisfaction: 4
  - id: priorizar_facturacion_y_dejar_pasar_credito
    label: Descartar cursos este trimestre para exprimir entregas urgentes
    result_text: Sacas adelante más horas facturables inmediatas, aunque el equipo nota que nunca hay hueco para formarse.
    effects:
      billed_income: 540
      stress: 7
      moral: -2
      employee_satisfaction: -10
