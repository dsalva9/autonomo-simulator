"familia_taller_ceramica_desconexion.choices.apuntarse_al_trimestre_completo.result_text": "Your first bowls resemble prehistoric ashtrays, yet two notification-free hours a week reset your brain."
"familia_taller_ceramica_desconexion.choices.ir_a_clase_de_prueba_suelta.label": "Try a single Saturday taster session with no commitment (30 €)"
"familia_taller_ceramica_desconexion.choices.ir_a_clase_de_prueba_suelta.result_text": "You spend a cheerful morning covered in clay up to your elbows and come home with a lopsided mug."
"familia_taller_ceramica_desconexion.choices.intentar_vender_lo_que_hagas.label": "Skip the class and use that slot to prospect for new clients"
"familia_taller_ceramica_desconexion.choices.intentar_vender_lo_que_hagas.result_text": "Hustle brain wins again: you land a small assignment and still have zero small talk outside work."

# 34. familia_tarde_canas_amigos_oficina
"familia_tarde_canas_amigos_oficina.title": "Thursday Terrace Beers with Your Salaried Friends"
"familia_tarde_canas_amigos_oficina.body": "It is six sharp on a mild Thursday and your salaried friends clock out straight onto a sunny terrace. You are still in sweatpants wrestling a stubborn spreadsheet when their live location pings."
"familia_tarde_canas_amigos_oficina.choices.cerrar_todo_y_bajar_a_la_terraza.label": "Put on real jeans and head down for cold beers and tapas (42 €)"
"familia_tarde_canas_amigos_oficina.choices.cerrar_todo_y_bajar_a_la_terraza.result_text": "You laugh until your ribs ache over other people's office gossip and walk home feeling human again."
"familia_tarde_canas_amigos_oficina.choices.pasar_una_hora_a_por_un_refresco.label": "Drop by for one quick round, then finish a short evening shift (18 €)"
"familia_tarde_canas_amigos_oficina.choices.pasar_una_hora_a_por_un_refresco.result_text": "Fresh air and familiar faces recharge you enough to wrap up your pending delivery cleanly afterward."
"familia_tarde_canas_amigos_oficina.choices.responder_con_sticker_triste.label": "Send a photo of your monitor saying 'swamped today' and keep typing"
"familia_tarde_canas_amigos_oficina.choices.responder_con_sticker_triste.result_text": "You pull ahead on billings in a dim room while eating a cold sandwich beside three open spreadsheets."

# 35. familia_test_positivo_sorpresa
"familia_test_positivo_sorpresa.title": "Two Pink Lines and Mental Napkin Math"
"familia_test_positivo_sorpresa.body": "Álex steps out of the bathroom holding the test with a nervous grin while your brain tallies diapers, cribs, and daycare. Growing the crew adds fixed costs (+280 €/mo) and flips every priority upside down."
"familia_test_positivo_sorpresa.choices.bajar_marcha_primeros_meses.label": "Celebrate, dial back gigs for a few months, and embrace parenting"
"familia_test_positivo_sorpresa.choices.bajar_marcha_primeros_meses.result_text": "Endless calls give way to ultrasounds, cribs, and 3 AM bottles. Billings dip for a season while the house brims with life."
"familia_test_positivo_sorpresa.choices.organizar_turnos_y_abuelos.label": "Go all in with air-traffic-control shifts to keep revenue steady"
"familia_test_positivo_sorpresa.choices.organizar_turnos_y_abuelos.result_text": "Your shared calendar runs with military precision. Invoices ship on time between naps, though you yawn on every call."
"familia_test_positivo_sorpresa.choices.pedir_un_ano_de_margen.label": "Exhale: the follow-up test is negative and you wait a little longer"
"familia_test_positivo_sorpresa.choices.pedir_un_ano_de_margen.result_text": "A second test confirms a false alarm—half relief, half quiet ache. You agree to pad your savings cushion first."

# 36. familia_ultimatum_casero_mudanza
"familia_ultimatum_casero_mudanza.title": "Your Landlord's Imaginary Nephew Needs the Flat"
"familia_ultimatum_casero_mudanza.body": "Your lease is up and the landlord calls in a syrupy voice: accept an outrageous 'market adjustment,' or a mysterious nephew suddenly needs to move in next month. Swallow the hike or pack up your life."
"familia_ultimatum_casero_mudanza.choices.buscar_piso_y_mudarse.label": "Walk away, rent in another neighborhood, and hire a van (640 €)"
"familia_ultimatum_casero_mudanza.choices.buscar_piso_y_mudarse.result_text": "Deposits, vans, and tape take a serious bite, yet you escape annual extortion for a fairer roof overhead."
"familia_ultimatum_casero_mudanza.choices.plantarse_con_la_ley_en_mano.label": "Cite housing law clauses and demand your mandatory lease extension"
"familia_ultimatum_casero_mudanza.choices.plantarse_con_la_ley_en_mano.outcomes.prorroga_respetada.result_text": "One certified notice quoting the exact statute makes the mythical nephew vanish overnight, preserving your rent."
"familia_ultimatum_casero_mudanza.choices.plantarse_con_la_ley_en_mano.outcomes.guerra_fria_y_mudanza.result_text": "Talks blow up into a shouting match, so you hunt for a new flat rather than beg for every future repair."
"familia_ultimatum_casero_mudanza.choices.tragar_con_el_nuevo_alquiler.label": "Grit your teeth and sign the hike so you lose zero billable days"
"familia_ultimatum_casero_mudanza.choices.tragar_con_el_nuevo_alquiler.result_text": "You lose zero hours to packing boxes, though on the first of every month half your Monday goes to the landlord."

# 37. familia_urgencia_veterinaria_nocturna
"familia_urgencia_veterinaria_nocturna.title": "An Eleven-Thirty PM Emergency Vet Run"
"familia_urgencia_veterinaria_nocturna.body": "Your loyal furry desk supervisor swallows half a sock just as you shut down on Wednesday night. The 24-hour emergency vet clinic greets you with urgent X-rays and eye-watering after-hours surcharges."
"familia_urgencia_veterinaria_nocturna.choices.pagar_pruebas_y_observacion.label": "Pay for X-rays, full treatment, and stay right beside them (370 €)"
"familia_urgencia_veterinaria_nocturna.choices.pagar_pruebas_y_observacion.result_text": "The late-night bill stings fiercely, yet you come home at dawn with a healthy, tail-wagging companion."
"familia_urgencia_veterinaria_nocturna.choices.consulta_basica_y_vigilar_en_vela.label": "Cover basic clinic care and stay up monitoring all night (160 €)"
"familia_urgencia_veterinaria_nocturna.choices.consulta_basica_y_vigilar_en_vela.outcomes.susto_superado_en_casa.result_text": "You spend the night on the sofa counting breaths until dawn, when they happily demand breakfast as usual."
"familia_urgencia_veterinaria_nocturna.choices.consulta_basica_y_vigilar_en_vela.outcomes.segunda_visita_por_la_manana.result_text": "At eight sharp you rush back to the clinic, losing the whole work morning and paying for full tests anyway."
"familia_urgencia_veterinaria_nocturna.choices.empalmar_consulta_y_entregas.label": "Pay the vet bill and pull an all-nighter to hit client deadlines"
"familia_urgencia_veterinaria_nocturna.choices.empalmar_consulta_y_entregas.result_text": "Your patient snoozes in a plastic cone at your feet while you power through invoices on four espressos."

