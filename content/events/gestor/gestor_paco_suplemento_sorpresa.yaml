schema_version: 1
id: gestor_paco_suplemento_sorpresa
category: gestor
title: "El suplemento sorpresa por «carpetas y modelos anuales»"
body: "Revisas el banco y descubres un recibo extra de 95 € girado por la gestoría de Paco bajo el concepto «Campaña resúmenes anuales, fotocopias color y subcarpetas». En su cartel de sesenta euros al mes no decía ni pío."
tags:
  - gestoria
  - paco
  - comisiones
