          deductible_expense: 40
          stress: 1
          moral: 4
          fiscal_risk: -2
      - id: paco_se_planta_con_tarifario
        weight: 35
        result_text: "Saca un cartel plastificado de 2011 escondido tras el archivador y solo consigues rascar veinte euros tras discutir media mañana."
        effects:
          deductible_expense: 75
          stress: 6
          moral: -3
  - id: devolver_recibo_y_marcharse
    label: "Devolver el recibo en la app del banco y volver a la autogestión"
    result_text: "Recuperas tus noventa y cinco euros al instante, recoges tu archivador y vuelves a ser tu propio departamento contable."
