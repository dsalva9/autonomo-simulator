<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Dani, empleado junior multiusos">
  <defs>
    <linearGradient id="daniBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFECFA" />
      <stop offset="100%" stop-color="#94B8E0" />
    </linearGradient>
    <clipPath id="daniClip">
      <rect x="20" y="20" width="472" height="472" rx="28" />
    </clipPath>
  </defs>

  <!-- Portrait Frame -->
  <rect x="20" y="20" width="472" height="472" rx="28" fill="url(#daniBg)" stroke="#1F2421" stroke-width="6" />

  <g clip-path="url(#daniClip)">
    <!-- Bright Energetic Backdrop Circle -->
    <circle cx="256" cy="242" r="172" fill="#F5F9FF" opacity="0.7" />
    <circle cx="256" cy="242" r="148" fill="none" stroke="#3B6698" stroke-width="2.5" stroke-dasharray="10 6" />

    <!-- Yellow Hoodie Hood Resting Behind Neck -->
    <ellipse cx="256" cy="354" rx="94" ry="32" fill="#E5A93C" stroke="#1F2421" stroke-width="4.5" />

    <!-- Shoulders: Mustard Hoodie Under Cobalt Denim Overshirt -->
    <path d="M 88 500 C 98 386 164 354 256 354 C 348 354 414 386 424 500 Z" fill="#F2B84B" stroke="#1F2421" stroke-width="5" />
    <path d="M 88 500 C 98 392 152 360 206 358 L 194 500 Z" fill="#3B6698" stroke="#1F2421" stroke-width="5" stroke-linejoin="round" />
    <path d="M 424 500 C 414 392 360 360 306 358 L 318 500 Z" fill="#3B6698" stroke="#1F2421" stroke-width="5" stroke-linejoin="round" />
    <!-- Hoodie Drawstrings -->
    <line x1="234" y1="368" x2="230" y2="442" stroke="#FFFDF8" stroke-width="5" stroke-linecap="round" />
    <line x1="278" y1="368" x2="282" y2="442" stroke="#FFFDF8" stroke-width="5" stroke-linecap="round" />

    <!-- Oversized Headphones Resting Around Neck -->
    <path d="M 188 348 C 188 394 324 394 324 348" fill="none" stroke="#2B302C" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="198" cy="358" rx="22" ry="28" fill="#2B302C" stroke="#1F2421" stroke-width="4" transform="rotate(-18 198 358)" />
    <ellipse cx="202" cy="358" rx="12" ry="18" fill="#E05347" transform="rotate(-18 202 358)" />
    <ellipse cx="314" cy="358" rx="22" ry="28" fill="#2B302C" stroke="#1F2421" stroke-width="4" transform="rotate(18 314 358)" />
    <ellipse cx="310" cy="358" rx="12" ry="18" fill="#E05347" transform="rotate(18 310 358)" />

    <!-- Neck -->
    <rect x="232" y="302" width="48" height="54" rx="16" fill="#EBBE9E" stroke="#1F2421" stroke-width="4.5" />

    <!-- Ears -->
    <ellipse cx="176" cy="236" rx="16" ry="24" fill="#EBBE9E" stroke="#1F2421" stroke-width="4.5" />
    <ellipse cx="336" cy="236" rx="16" ry="24" fill="#EBBE9E" stroke="#1F2421" stroke-width="4.5" />

    <!-- Youthful Face -->
    <path d="M 184 172 C 184 124 328 124 328 172 L 324 258 C 320 302 286 322 256 322 C 226 322 192 302 188 258 Z" fill="#F5CBAE" stroke="#1F2421" stroke-width="5" />

    <!-- Messy Fluffy Curly Hair Cloud -->
    <path d="M 164 190 C 148 156 168 120 198 118 C 208 90 250 84 270 104 C 300 88 338 108 334 140 C 358 154 354 188 334 198 C 322 168 302 158 282 168 C 266 150 238 152 224 170 C 202 160 180 172 164 190 Z" fill="#2F2520" stroke="#1F2421" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Eager High Eyebrows & Wide Caffeinated Eyes -->
    <path d="M 198 188 Q 220 174 240 186" fill="none" stroke="#2F2520" stroke-width="5" stroke-linecap="round" />
    <path d="M 272 186 Q 292 174 314 188" fill="none" stroke="#2F2520" stroke-width="5" stroke-linecap="round" />

    <circle cx="220" cy="214" r="14" fill="#FFFDF8" stroke="#1F2421" stroke-width="3.5" />
    <circle cx="292" cy="214" r="14" fill="#FFFDF8" stroke="#1F2421" stroke-width="3.5" />
    <circle cx="222" cy="214" r="7.5" fill="#1F2421" />
    <circle cx="294" cy="214" r="7.5" fill="#1F2421" />
    <circle cx="225" cy="211" r="3" fill="#FFFFFF" />
    <circle cx="297" cy="211" r="3" fill="#FFFFFF" />
    <!-- Slight Late-Night Tutorial Eye Bags -->
    <path d="M 208 233 Q 220 239 232 233" fill="none" stroke="#C6987B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 280 233 Q 292 239 304 233" fill="none" stroke="#C6987B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Button Nose & Band-Aid / Enthusiastic Grin -->
    <path d="M 256 218 L 250 244 L 262 246" fill="none" stroke="#1F2421" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 222 268 L 290 268 C 288 296 224 296 222 268 Z" fill="#FFFDF8" stroke="#1F2421" stroke-width="4" stroke-linejoin="round" />

    <!-- Sticker-Covered Laptop Corner Held Up -->
    <g transform="translate(306, 392) rotate(-8)">
      <rect x="0" y="0" width="136" height="110" rx="8" fill="#2B302C" stroke="#1F2421" stroke-width="4.5" />
      <circle cx="42" cy="46" r="16" fill="#F2B84B" stroke="#1F2421" stroke-width="2.5" />
      <rect x="72" y="28" width="44" height="24" rx="4" fill="#63D471" stroke="#1F2421" stroke-width="2.5" transform="rotate(10 94 40)" />
      <text x="94" y="44" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#1F2421" transform="rotate(10 94 40)">v1.0</text>
    </g>
  </g>

  <!-- Corner Role Stamp -->
  <rect x="34" y="34" width="166" height="30" rx="6" fill="#2D527C" />
  <text x="117" y="54" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#FFFDF8" letter-spacing="1.2">EMPLEADO JUNIOR</text>
</svg>
