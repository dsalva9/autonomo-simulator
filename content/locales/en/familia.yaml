"familia_vacaciones_agosto_cerrado.title": "August in Spain and the 'Closed for Holidays' Sign"
"familia_vacaciones_agosto_cerrado.body": "Half your clients already switched on out-of-office replies until September, and Álex shows you a fair seaside booking. It is your annual shot at ten straight days off without pretending to stay online."
"familia_vacaciones_agosto_cerrado.choices.diez_dias_de_playa_sin_portatil.label": "Book it, set an auto-reply, and feel sand underfoot ten days (460 €)"
"familia_vacaciones_agosto_cerrado.choices.diez_dias_de_playa_sin_portatil.result_text": "For three days you phantom-check your phone; by day five nobody has died and you return genuinely recharged."
