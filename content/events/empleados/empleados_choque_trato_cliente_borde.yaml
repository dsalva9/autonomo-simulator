schema_version: 1
id: empleados_choque_trato_cliente_borde
category: empleados
title: Falta de respeto en videollamada grupal
body: Un cliente con buena facturación pierde las formas en directo y culpa con desprecio a tu persona en plantilla de un retraso que causó él mismo. Al colgar, en el estudio se corta el silencio esperando ver cómo reaccionas.
tags:
  - plantilla
  - liderazgo
  - clientes
  - dignidad
requirements:
  min_month: 11
  has_employee: true
weight: 9
cooldown_months: 13
max_occurrences: 3
exclusive_with: []
choices:
  - id: absorber_tu_al_cliente_dificil
    label: Asumir tú el trato directo con esa cuenta y darle la tarde libre
    result_text: Proteges a tu equipo del mal trago y salvas la factura, a cambio de tragarte tú solo todas las llamadas tensas del mes.
    effects:
      billed_income: 1350
      moral: 3
      stress: 7
      personal_life: -3
      employee_satisfaction: 8
  - id: parar_los_pies_por_escrito
    label: Enviar un mensaje firme exigiendo respeto y centralizando el trato
    requirements:
      stats:
        moral:
          min: 65
    result_text: "Tu firmeza impecable desarma al cliente en veinte minutos: pide disculpas por escrito, paga 1.350 € y tu equipo iría contigo al fin del mundo."
    effects:
      billed_income: 1350
      moral: 8
      stress: -3
      reputation: 5
      employee_satisfaction: 18
      clear_flags:
        - desgaste_plantilla
  - id: pedir_tragar_porque_paga_bien
    label: Decir en frío que quien paga manda y que no conviene hacer olas
    result_text: La transferencia entra puntual en el banco, pero algo importante se rompe para siempre en la confianza del despacho.
    effects:
      billed_income: 1550
      moral: -9
      stress: 8
      employee_satisfaction: -18
      set_flags:
        - desgaste_plantilla
