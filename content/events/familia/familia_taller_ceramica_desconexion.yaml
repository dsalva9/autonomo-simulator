schema_version: 1
id: familia_taller_ceramica_desconexion
category: familia
title: "Manos llenas de barro y móvil fuera de cobertura"
body: "Descubres que llevas meses sin una sola afición que no podáis monetizar ni tú ni el algoritmo. En el centro cultural del barrio abren plaza en un taller vespertino donde es físicamente imposible mirar pantallas."
tags:
  - aficiones
  - desconexion
  - salud_mental
  - barrio
requirements:
