<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Paco, gestor barato">
  <defs>
    <linearGradient id="pacoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7EBD8" />
      <stop offset="100%" stop-color="#BFC8A4" />
    </linearGradient>
    <clipPath id="pacoClip">
      <rect x="20" y="20" width="472" height="472" rx="28" />
    </clipPath>
  </defs>

  <!-- Portrait Frame -->
  <rect x="20" y="20" width="472" height="472" rx="28" fill="url(#pacoBg)" stroke="#1F2421" stroke-width="6" />

  <g clip-path="url(#pacoClip)">
    <!-- Manila Folder Circle Backdrop -->
    <circle cx="256" cy="244" r="172" fill="#F6EFE0" opacity="0.68" />
    <circle cx="256" cy="244" r="150" fill="none" stroke="#6B7B53" stroke-width="2.5" stroke-dasharray="12 6" />

    <!-- Round Slumped Shoulders: Short-Sleeve Cream Dress Shirt + Loose Brown Tie -->
    <path d="M 74 500 C 82 376 156 344 256 344 C 356 344 430 376 438 500 Z" fill="#F5EEDB" stroke="#1F2421" stroke-width="5" />
    <!-- Vertical Subtle Shirt Stripes -->
    <line x1="146" y1="368" x2="146" y2="500" stroke="#D8CEB4" stroke-width="3" />
    <line x1="186" y1="354" x2="186" y2="500" stroke="#D8CEB4" stroke-width="3" />
    <line x1="326" y1="354" x2="326" y2="500" stroke="#D8CEB4" stroke-width="3" />
    <line x1="366" y1="368" x2="366" y2="500" stroke="#D8CEB4" stroke-width="3" />

    <!-- Slightly Crooked Brown Tie -->
    <polygon points="244,368 272,366 282,464 258,488 234,462" fill="#8C5830" stroke="#1F2421" stroke-width="4" />
    <polygon points="238,354 276,352 270,372 244,372" fill="#6E4322" stroke="#1F2421" stroke-width="4" />

    <!-- Shirt Pocket Protector with 3 Biro Pens & Small Ink Stain -->
    <g transform="translate(302, 412)">
      <line x1="14" y1="8" x2="12" y2="-16" stroke="#3B6698" stroke-width="5" stroke-linecap="round" />
      <line x1="28" y1="8" x2="28" y2="-18" stroke="#C83E37" stroke-width="5" stroke-linecap="round" />
      <line x1="42" y1="8" x2="44" y2="-14" stroke="#2E6F65" stroke-width="5" stroke-linecap="round" />
      <path d="M 4 4 L 52 4 L 52 46 C 52 54 4 54 4 46 Z" fill="#FFFDF8" stroke="#1F2421" stroke-width="3" />
      <circle cx="18" cy="40" r="6" fill="#2A4D7F" opacity="0.65" />
    </g>

    <!-- Wide Neck & Open Collar -->
    <rect x="218" y="302" width="76" height="58" rx="26" fill="#ECAF88" stroke="#1F2421" stroke-width="4.5" />
    <polygon points="210,344 252,374 196,386" fill="#FFFDF8" stroke="#1F2421" stroke-width="4" stroke-linejoin="round" />
    <polygon points="302,344 260,374 316,386" fill="#FFFDF8" stroke="#1F2421" stroke-width="4" stroke-linejoin="round" />

    <!-- Fluffy Side Hair Tufts (Classic Balding Crown) -->
    <path d="M 162 192 C 142 184 138 228 158 242 Z" fill="#6B625B" stroke="#1F2421" stroke-width="4" />
    <path d="M 350 192 C 370 184 374 228 354 242 Z" fill="#6B625B" stroke="#1F2421" stroke-width="4" />

    <!-- Ears -->
    <ellipse cx="164" cy="236" rx="18" ry="26" fill="#ECAF88" stroke="#1F2421" stroke-width="4.5" />
    <ellipse cx="348" cy="236" rx="18" ry="26" fill="#ECAF88" stroke="#1F2421" stroke-width="4.5" />

    <!-- Round Friendly Sweaty Head -->
    <path d="M 168 182 C 168 106 344 106 344 182 L 342 268 C 340 322 300 340 256 340 C 212 340 172 322 170 268 Z" fill="#F4BC97" stroke="#1F2421" stroke-width="5" />
    <!-- Three Wispy Combover Strands on Top -->
    <path d="M 204 126 Q 256 108 304 128" fill="none" stroke="#6B625B" stroke-width="4" stroke-linecap="round" />
    <path d="M 216 138 Q 258 122 296 140" fill="none" stroke="#6B625B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Nervous Sweat Drop on Forehead -->
    <path d="M 316 154 C 316 154 326 168 326 175 A 8 8 0 1 1 310 175 C 310 168 316 154 316 154 Z" fill="#7CC6FE" stroke="#1F2421" stroke-width="2.5" />

    <!-- Worried-Friendly Eyebrows & Wide Tired Eyes -->
    <path d="M 196 190 Q 218 176 238 192" fill="none" stroke="#4D453F" stroke-width="6" stroke-linecap="round" />
    <path d="M 274 192 Q 294 176 316 190" fill="none" stroke="#4D453F" stroke-width="6" stroke-linecap="round" />
    <circle cx="218" cy="212" r="8" fill="#1F2421" />
    <circle cx="294" cy="212" r="8" fill="#1F2421" />
    <circle cx="220" cy="209" r="2.5" fill="#FFFFFF" />
    <circle cx="296" cy="209" r="2.5" fill="#FFFFFF" />

    <!-- Half-Moon Reading Glasses Sliding Low Down Bulbous Nose -->
    <ellipse cx="256" cy="244" rx="20" ry="16" fill="#E89D72" stroke="#1F2421" stroke-width="4" />
    <path d="M 192 228 L 244 228 A 24 18 0 0 1 192 228 Z" fill="#FFFFFF" fill-opacity="0.72" stroke="#1F2421" stroke-width="3.5" />
    <path d="M 268 228 L 320 228 A 24 18 0 0 1 268 228 Z" fill="#FFFFFF" fill-opacity="0.72" stroke="#1F2421" stroke-width="3.5" />
    <line x1="244" y1="228" x2="268" y2="228" stroke="#1F2421" stroke-width="3.5" />

    <!-- Big Bushy Walrus Mustache & Reassuring Half-Smile ("No pasa ná") -->
    <path d="M 198 282 C 204 256 244 256 256 268 C 268 256 308 256 314 282 C 296 288 272 284 256 278 C 240 284 216 288 198 282 Z" fill="#5E554E" stroke="#1F2421" stroke-width="4" stroke-linejoin="round" />
    <path d="M 228 294 Q 256 310 284 294" fill="none" stroke="#1F2421" stroke-width="4" stroke-linecap="round" />

    <!-- Crumpled Receipts Sticking Out in Bottom Left -->
    <g transform="translate(88, 396) rotate(-12)">
      <rect x="0" y="18" width="96" height="86" rx="4" fill="#D4B483" stroke="#1F2421" stroke-width="4" />
      <polygon points="10,18 22,-8 46,6 68,-10 86,18" fill="#FFFDF8" stroke="#1F2421" stroke-width="3" stroke-linejoin="round" />
      <text x="48" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#1F2421">60€/MES</text>
    </g>
  </g>

  <!-- Corner Role Stamp -->
  <rect x="34" y="34" width="164" height="30" rx="6" fill="#52633D" />
  <text x="116" y="54" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#FFFDF8" letter-spacing="1.2">GESTOR BARATO</text>
</svg>
