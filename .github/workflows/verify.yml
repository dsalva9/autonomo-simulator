name: Verify

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full verification pipeline
        run: pnpm verify

      - name: Build portable itch.io release archive
        run: pnpm build:itch

      - name: Upload portable itch.io release artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomo-simulator-web
          path: release/autonomo-simulator-web.zip
          if-no-files-found: error
