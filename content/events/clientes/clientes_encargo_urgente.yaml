choices:
  - id: entrega_express_contado
    label: Echar horas extra y cobrar por adelantado con recargo de urgencia
    result_text: Sobrevives a base de termos de café y entregas a tiempo. La transferencia entra al instante, aunque el tic del párpado izquierdo vuelve a saludarte.
    effects:
      billed_income: 950
      stress: 9
      moral: -3
      personal_life: -4
      reputation: 3
  - id: presupuesto_estandar_60_dias
    label: Aceptar a ritmo razonable emitiendo factura a 60 días
    result_text: Pactas una entrega civilizada y mandas una factura mayor «a sesenta días», esa tradición nacional donde trabajas hoy y cobras cuando se alineen los planetas.
    effects:
      deferred_invoice:
        amount: 1350
        delay_months: 2
        default_prob: 0.15
      stress: 3
      moral: 1
      reputation: 2
  - id: rechazar_y_descansar
    label: Decir que tienes la agenda completa y descansar esta semana
    result_text: Pronuncias la palabra sagrada «no» sin pedir perdón tres veces. El mundo sigue girando, tu espalda se destensa y duermes ocho horas seguidas.
    effects:
      stress: -8
      moral: 4
      personal_life: 4
      reputation: -1
