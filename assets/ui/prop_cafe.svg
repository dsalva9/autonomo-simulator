  <ellipse cx="118" cy="104" rx="47" ry="10" fill="#3B2314" stroke="#1F2421" stroke-width="2" />
  <!-- Crema Swirl -->
  <path d="M 92 104 Q 118 98 142 105" fill="none" stroke="#C68B53" stroke-width="3" stroke-linecap="round" />
