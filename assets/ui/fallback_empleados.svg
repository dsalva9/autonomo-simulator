<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320" role="img" aria-label="Categoría Empleados">
  <defs>
    <linearGradient id="empBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF4FB" />
      <stop offset="100%" stop-color="#D4E2F2" />
    </linearGradient>
    <pattern id="empGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#B4CAE4" stroke-width="1" opacity="0.55" />
    </pattern>
  </defs>

  <!-- Base -->
  <rect x="0" y="0" width="512" height="320" rx="16" fill="url(#empBg)" />
  <rect x="12" y="12" width="488" height="296" rx="12" fill="url(#empGrid)" stroke="#3B6698" stroke-width="2.5" />

  <!-- Header Tab -->
  <path d="M 28 12 L 210 12 L 226 36 L 28 36 Z" fill="#3B6698" />
  <text x="42" y="29" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#F8FBFF" letter-spacing="1.2">EXP. PERSONAL / RRHH</text>

  <!-- Backdrop Circle -->
  <circle cx="258" cy="166" r="98" fill="#8FB6E0" opacity="0.28" />

  <!-- Contract Clipboard -->
  <g transform="translate(114, 66) rotate(-5)">
    <rect x="0" y="10" width="136" height="168" rx="8" fill="#D9A86C" stroke="#1F2421" stroke-width="3" />
    <rect x="10" y="22" width="116" height="144" rx="4" fill="#FFFDF9" stroke="#1F2421" stroke-width="2" />
    <rect x="42" y="2" width="52" height="18" rx="4" fill="#6F7A85" stroke="#1F2421" stroke-width="2.5" />
    <!-- Avatar box on CV -->
    <rect x="22" y="36" width="32" height="32" rx="4" fill="#D4E2F2" stroke="#1F2421" stroke-width="2" />
    <circle cx="38" cy="48" r="6" fill="#3B6698" />
    <path d="M 28 64 C 28 57 48 57 48 64" fill="#3B6698" />
    <!-- CV Lines -->
    <line x1="64" y1="42" x2="112" y2="42" stroke="#1F2421" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="56" x2="104" y2="56" stroke="#7A8691" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="84" x2="112" y2="84" stroke="#7A8691" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="100" x2="106" y2="100" stroke="#7A8691" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="116" x2="94" y2="116" stroke="#7A8691" stroke-width="2.5" stroke-linecap="round" />
    <!-- Nómina / Seg Social tag -->
    <rect x="22" y="132" width="90" height="22" rx="4" fill="#FCE7B2" stroke="#1F2421" stroke-width="2" />
    <text x="67" y="147" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#1F2421">NÓMINA + S.S.</text>
  </g>

  <!-- Junior Laptop with Stickers -->
  <g transform="translate(248, 108)">
    <rect x="18" y="0" width="144" height="94" rx="8" fill="#2B302C" stroke="#1F2421" stroke-width="3" />
    <rect x="26" y="8" width="128" height="78" rx="4" fill="#3B6698" />
    <!-- Stickers on lid -->
    <circle cx="58" cy="40" r="14" fill="#F2B84B" stroke="#1F2421" stroke-width="2" />
    <polygon points="58,31 61,38 69,38 63,43 65,50 58,45 51,50 53,43 47,38 55,38" fill="#C83E37" />
    <rect x="88" y="26" width="44" height="22" rx="4" fill="#FFFDF9" stroke="#1F2421" stroke-width="2" transform="rotate(8 110 37)" />
    <text x="110" y="41" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#1F2421" transform="rotate(8 110 37)">JUNIOR</text>
    <circle cx="102" cy="68" r="9" fill="#63A375" stroke="#1F2421" stroke-width="2" />
    <!-- Laptop Base -->
    <path d="M 4 94 L 176 94 L 166 108 L 14 108 Z" fill="#9AA5B1" stroke="#1F2421" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Yellow Sticky Note "SE BUSCA" -->
  <g transform="translate(342, 50) rotate(9)">
    <rect x="0" y="0" width="102" height="68" rx="3" fill="#FCE068" stroke="#1F2421" stroke-width="2.5" />
    <circle cx="51" cy="10" r="5" fill="#C83E37" />
    <text x="51" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1F2421">¡AYUDA!</text>
    <text x="51" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#2B302C">MAX: 1 EMP.</text>
  </g>

  <!-- Stamp Badge -->
  <g transform="translate(36, 246) rotate(-3)">
    <rect x="0" y="0" width="222" height="42" rx="5" fill="#EEF4FB" fill-opacity="0.92" stroke="#2D527C" stroke-width="3" />
    <rect x="4" y="4" width="214" height="34" rx="3" fill="none" stroke="#2D527C" stroke-width="1.2" />
    <text x="111" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#2D527C" letter-spacing="1.4">RÉGIMEN LABORAL</text>
  </g>
</svg>
