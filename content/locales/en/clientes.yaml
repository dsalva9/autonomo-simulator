clientes_absorcion_cuenta_huerfana.body: Two months after the meltdown, the intermediary agency shutters the unit and waives non-competes. Marta calls from the end client offering you the entire 3,100 € account directly.
clientes_absorcion_cuenta_huerfana.choices.asumir_cuenta_directa_con_iguala.label: Sign a direct agreement capturing the margin the agency used to skim
clientes_absorcion_cuenta_huerfana.choices.asumir_cuenta_directa_con_iguala.result_text: Same craft, zero broken telephone, and 100% of the fee flowing straight into your studio.
clientes_absorcion_cuenta_huerfana.choices.cobrar_solo_traspaso_ordenado.label: Bill 1,500 € for a clean audit and handover without ongoing lock-in
clientes_absorcion_cuenta_huerfana.choices.cobrar_solo_traspaso_ordenado.result_text: You wrap a ten-day transition cleanly, banking solid cash while keeping your calendar light.
clientes_absorcion_cuenta_huerfana.title: The middleman folds—and the end client calls you directly
clientes_acuerdo_marco_multianual_ibex.body: "Eight years in the trenches put you across from procurement at a listed group: a preferred Master Services Agreement guaranteeing 3,800 € up front in exchange for reserved monthly capacity."
clientes_acuerdo_marco_multianual_ibex.choices.aceptar_disponibilidad_prioritaria_total.label: Take the full 4,400 € tier with priority 24-hour turnaround SLA
clientes_acuerdo_marco_multianual_ibex.choices.aceptar_disponibilidad_prioritaria_total.result_text: Your bank balance leaps a bracket, though Thursday evening pings now own first dibs on your desk.
clientes_acuerdo_marco_multianual_ibex.choices.entrar_solo_para_proyectos_singulares.label: Skip capacity lock-in and onboard solely for standalone senior briefs
clientes_acuerdo_marco_multianual_ibex.choices.entrar_solo_para_proyectos_singulares.result_text: You bank a crisp 2,700 € opening brief while keeping 100% sovereignty over your calendar.
clientes_acuerdo_marco_multianual_ibex.choices.firmar_marco_con_desconexion_y_tope_horas.label: Sign the MSA with a hard monthly hour cap and right-to-disconnect
clientes_acuerdo_marco_multianual_ibex.choices.firmar_marco_con_desconexion_y_tope_horas.result_text: "Approved-vendor standing lets you dictate healthy boundaries: rock-solid enterprise billing with weekends untouched."
clientes_acuerdo_marco_multianual_ibex.title: "Listed-company two-year MSA: ironclad stability or golden cage"
clientes_agencia_intermediaria.body: A trendy agency with a foosball table wants you to execute a major brand project end to end. They pocket 55% for 'account management' and forbid you from ever mentioning the work is yours.
clientes_agencia_intermediaria.choices.aceptar_marca_blanca.label: Swallow the ghostwriter clause to secure the invoice
clientes_agencia_intermediaria.choices.aceptar_marca_blanca.result_text: You deliver the whole project while three account executives forward your emails taking all the credit. Payment lands on time, though your pride stings.
clientes_agencia_intermediaria.choices.negociar_tarifa_senior_y_credito.label: Demand full senior rates and portfolio credit
clientes_agencia_intermediaria.choices.negociar_tarifa_senior_y_credito.result_text: Nobody else can deliver on time, so they cave. You charge what your craft is worth and add a flagship case study to your portfolio.
clientes_agencia_intermediaria.choices.rechazar_intermediacion.label: Decline being invisible labor for someone else's slide deck
clientes_agencia_intermediaria.choices.rechazar_intermediacion.result_text: You close the video call with an impeccable smile and dedicate the week to your own direct clients.
clientes_agencia_intermediaria.title: "White-label subcontracting: you grind, they sign"
clientes_agencia_prueba_remunerada.body: Borja spins up a pop-up agency and asks for a 'short pilot proposal' at a token fee to woo a major company. He swears on his honour you'll lead the whole annual account once they win.
clientes_agencia_prueba_remunerada.choices.entregar_boceto_con_marca_agua.label: Bill the capped pilot with your authorship clearly stamped
clientes_agencia_prueba_remunerada.choices.entregar_boceto_con_marca_agua.result_text: You deliver strictly within scope with clear technical credit on every page. Modest fee today, unmistakable authorship tomorrow.
clientes_agencia_prueba_remunerada.choices.rechazar_pilotos_especulativos.label: Refuse to subsidize someone else's pitch with your hours
clientes_agencia_prueba_remunerada.choices.rechazar_pilotos_especulativos.result_text: Borja mutters about your 'lack of strategic vision' while you reclaim a clean week for real clients.
clientes_agencia_prueba_remunerada.choices.volcarse_fines_de_semana_en_concurso.label: Grind all weekend betting on the promised annual contract
clientes_agencia_prueba_remunerada.choices.volcarse_fines_de_semana_en_concurso.outcomes.ganan_y_pagan_fase_inicial.result_text: Your deck dazzles the end client and Borja pays a solid first slice while bragging loudly about 'his in-house team'.
clientes_agencia_prueba_remunerada.choices.volcarse_fines_de_semana_en_concurso.outcomes.presentan_tu_trabajo_y_desaparecen.result_text: They win the pitch using your slides, then hand execution to three interns so Borja can pocket the entire margin.
clientes_agencia_prueba_remunerada.title: "'Just a tiny paid test so we win the annual pitch'"
clientes_app_millonaria_primo.body: "A distant cousin corners you over espresso alongside Borja: they've dreamed up 'Uber meets condo board meetings'. There is zero cash today, only a generous 8% of an unincorporated company."
clientes_app_millonaria_primo.choices.cobrar_prototipo_cerrado.label: Quote a small Phase 1 prototype paid on a real invoice
clientes_app_millonaria_primo.choices.cobrar_prototipo_cerrado.result_text: Once 800 € of real money hits the table, they trim the wishful thinking, split the bill for a lean mockup, and pay for your time.
clientes_app_millonaria_primo.choices.entrar_a_riesgo_por_participaciones.label: Burn midnight oil gambling on phantom equity
clientes_app_millonaria_primo.choices.entrar_a_riesgo_por_participaciones.outcomes.compra_sorpresa_prototipo.result_text: Against every law of thermodynamics, a property-management firm buys the working prototype and you cash out a glorious windfall.
clientes_app_millonaria_primo.choices.entrar_a_riesgo_por_participaciones.outcomes.pivote_a_kombucha.result_text: After two months of endless voice notes, your cousin gets bored and decides the real future lies in farming gourmet mushrooms.
clientes_app_millonaria_primo.choices.pagar_los_cortados_y_huir.label: Pay for the coffees and bolt before signing a napkin
clientes_app_millonaria_primo.choices.pagar_los_cortados_y_huir.result_text: Best 3 € spent all quarter. You return to your desk safe, sound, and still in charge of your evenings.
clientes_app_millonaria_primo.title: "'I bring the million-euro idea, you just build it'"
clientes_archivos_perdidos_hace_dos_anos.body: "A client silent for twenty months emails in panic: they lost every master file you delivered back then and assume your studio hard drives serve as their eternal free cloud backup."
clientes_archivos_perdidos_hace_dos_anos.choices.cobrar_tasa_recuperacion_y_actualizacion.label: Bill an archive-retrieval and format-migration fee
clientes_archivos_perdidos_hace_dos_anos.choices.cobrar_tasa_recuperacion_y_actualizacion.result_text: Dusting off an external drive and updating legacy formats turns their slip-up into an easy afternoon invoice.
clientes_archivos_perdidos_hace_dos_anos.choices.enviar_copia_cortesia_y_vender_mantenimiento.label: Send the backup free as goodwill while pitching a support plan
clientes_archivos_perdidos_hace_dos_anos.choices.enviar_copia_cortesia_y_vender_mantenimiento.outcomes.contratan_mantenimiento_agradecidos.result_text: Scared straight, they thank you profusely and sign a three-month backup and maintenance retainer.
clientes_archivos_perdidos_hace_dos_anos.choices.enviar_copia_cortesia_y_vender_mantenimiento.outcomes.descargan_y_ni_gracias.result_text: They download the zip in three minutes flat and reply solely with a thumbs-up emoji.
clientes_archivos_perdidos_hace_dos_anos.choices.remitir_a_politica_borrado_anual.label: Cite your twelve-month archive purge policy for closed jobs
clientes_archivos_perdidos_hace_dos_anos.choices.remitir_a_politica_borrado_anual.result_text: Two polite lines close the thread without digging through cold-storage drives for free.
clientes_archivos_perdidos_hace_dos_anos.title: "'We wiped our laptop and lost everything from two years ago'"
clientes_arranque_septiembre_avalancha.body: "On the first Monday of September, four 'URGENT' threads hit your inbox at once: the exact clients who vanished in July all demand simultaneous kickoffs worth up to 2,600 €."
clientes_arranque_septiembre_avalancha.choices.decir_si_a_los_cuatro_y_trasnochar.label: Say yes to all four at once to make up for August's drought
clientes_arranque_septiembre_avalancha.choices.decir_si_a_los_cuatro_y_trasnochar.result_text: You bill a small fortune in three weeks at the cost of reheated coffee and mixing up client names on calls.
clientes_arranque_septiembre_avalancha.choices.derivar_excedente_a_red_colaboradores.label: Keep the flagship brief and route overflow through your partner network
clientes_arranque_septiembre_avalancha.choices.derivar_excedente_a_red_colaboradores.result_text: "You orchestrate the post-summer wave like a boutique studio: nobody gets dropped, you keep a lead margin, and evenings stay yours."
clientes_arranque_septiembre_avalancha.choices.ordenar_cola_por_anticipo_pagado.label: Rank kickoff slots strictly by who wires the 50% deposit first
clientes_arranque_septiembre_avalancha.choices.ordenar_cola_por_anticipo_pagado.result_text: "Deposit-first triage separates noise from real budgets in two hours: two accounts wire cash today and the rest wait till October."
clientes_arranque_septiembre_avalancha.title: "September 1st: everything parked 'until after summer' is due today"
clientes_auditoria_alcance_berlin.body: The Berlin team loves Phase 1 and proposes rolling the project out across three European markets. They pay Northern European rates, provided you join crisp 8:30 AM sync calls three mornings a week.
clientes_auditoria_alcance_berlin.choices.asumir_despliegue_tres_paises.label: Take the full rollout with a fresh thermos at dawn
clientes_auditoria_alcance_berlin.choices.asumir_despliegue_tres_paises.result_text: Your mornings start in English before the corner bakery opens, yet that intra-EU transfer makes every dark circle worthwhile.
clientes_auditoria_alcance_berlin.choices.cerrar_proyecto_en_fase_uno.label: Bill a clean handover session and skip the expansion
clientes_auditoria_alcance_berlin.choices.cerrar_proyecto_en_fase_uno.result_text: You hand over tidy documentation, invoice a wrap-up fee, and keep your mornings blissful.
clientes_auditoria_alcance_berlin.choices.pactar_entregas_asincronas.label: Negotiate async written updates with zero early calls
clientes_auditoria_alcance_berlin.choices.pactar_entregas_asincronas.result_text: You prove crisp weekly memos beat daily meetings. They agree gladly, keeping both the European fee and your mornings intact.
clientes_auditoria_alcance_berlin.title: European expansion with 8:30 AM standup calls
clientes_auditoria_ciberseguridad_proveedor.body: To renew a 3,500 € engagement, corporate security sends over a 140-row compliance spreadsheet clearly designed for 500-seat enterprises.
clientes_auditoria_ciberseguridad_proveedor.choices.implantar_cifrado_copias_y_pasar_auditoria.label: Invest 290 € in encrypted backups and compliance review to pass
clientes_auditoria_ciberseguridad_proveedor.choices.implantar_cifrado_copias_y_pasar_auditoria.outcomes.aprobado_con_nota_y_renovacion.result_text: You earn a green stamp from security, collect 3,500 €, and keep a reusable dossier for enterprise accounts.
clientes_auditoria_ciberseguridad_proveedor.choices.implantar_cifrado_copias_y_pasar_auditoria.outcomes.piden_segunda_ronda_de_evidencias.result_text: A nitpicky auditor demands screenshots of your lock-screen timer. You pass and get paid after a mind-numbing week.
clientes_auditoria_ciberseguridad_proveedor.choices.operar_solo_en_equipos_del_cliente.label: Work strictly inside their VDI environment so zero client data touches your rig
clientes_auditoria_ciberseguridad_proveedor.choices.operar_solo_en_equipos_del_cliente.result_text: Storing zero local files renders 120 rows 'N/A' overnight, unlocking a clean 2,900 € renewal.
clientes_auditoria_ciberseguridad_proveedor.choices.reutilizar_dossier_homologado_y_cobrar_anexo.label: Submit your existing corporate vendor dossier and bill the full 3,500 €
clientes_auditoria_ciberseguridad_proveedor.choices.reutilizar_dossier_homologado_y_cobrar_anexo.result_text: "Prior vendor onboarding saves your week: infosec signs off in 24 hours and the full contract renews cleanly."
clientes_auditoria_ciberseguridad_proveedor.title: "Vendor infosec audit: 140 questions written as if you were a bank"
clientes_auditoria_senior_corporativa.body: Five-plus years in the game bring a call from a major firm to audit and untangle a stalled project that already chewed through two consultancies. They approve your senior specialist rate without blinking.
clientes_auditoria_senior_corporativa.choices.apoyarse_en_empleado_para_ejecucion.label: Direct strategy and split heavy execution with your employee
clientes_auditoria_senior_corporativa.choices.apoyarse_en_empleado_para_ejecucion.result_text: Your senior judgment guides the scalpel while your hire handles implementation—top-tier billing without burnout.
clientes_auditoria_senior_corporativa.choices.declinar_marron_ajeno_y_descansar.label: Pass on inherited fires and protect your neck and sanity
clientes_auditoria_senior_corporativa.choices.declinar_marron_ajeno_y_descansar.result_text: Turning down three grand feels dizzying for half a second; stretching out pain-free on the sofa cures it fast.
clientes_auditoria_senior_corporativa.choices.liderar_intervencion_en_solitario.label: Lead the intensive audit and turnaround solo from start to finish
clientes_auditoria_senior_corporativa.choices.liderar_intervencion_en_solitario.result_text: In three weeks you unblock a year-old mess, banking a memorable windfall while dreaming in flowcharts.
clientes_auditoria_senior_corporativa.title: High-stakes corporate rescue at veteran specialist rates
clientes_automatizacion_propia_ia.body: With disarming corporate candor, Marta asks you to hand over your custom templates and automated workflows in a workshop so her juniors 'can run everything in-house without hiring freelancers'.
clientes_automatizacion_propia_ia.choices.cobrar_licencia_consultoria_precio_oro.label: Price the handover and usage license like premium consultancy
clientes_automatizacion_propia_ia.choices.cobrar_licencia_consultoria_precio_oro.result_text: "If they want to buy the fishing rod, they pay yacht prices: two workshop afternoons net a handsome invoice."
clientes_automatizacion_propia_ia.choices.negar_cesion_metodologia_interna.label: Refuse to give away your secret sauce and sell outcomes only
clientes_automatizacion_propia_ia.choices.negar_cesion_metodologia_interna.result_text: "You guard your internal toolkit with a warm smile: the magician's props aren't included in general admission."
clientes_automatizacion_propia_ia.choices.vender_mantenimiento_mensual_sistema.label: Set up a basic workflow paired with a four-month oversight fee
clientes_automatizacion_propia_ia.choices.vender_mantenimiento_mensual_sistema.result_text: Their juniors handle repetitive grunt work while you bill four calm months making sure nothing catches fire.
clientes_automatizacion_propia_ia.title: "'Teach our juniors your AI workflows so we won't need you'"
clientes_avalancha_cierre_presupuesto_diciembre.body: "Marta calls in peak holiday panic: her department found leftover annual budget that vanishes next year unless invoiced and delivered before New Year's Eve. Great fee, goodbye holidays."
clientes_avalancha_cierre_presupuesto_diciembre.choices.maraton_entre_polvorones.label: Take the holiday sprint and invoice every euro before midnight
clientes_avalancha_cierre_presupuesto_diciembre.choices.maraton_entre_polvorones.result_text: You grind straight between Christmas Eve and New Year's, closing December with a spectacular revenue spike.
clientes_avalancha_cierre_presupuesto_diciembre.choices.proteger_vacaciones_navidenas.label: "Close for the holidays: January will bring fresh budgets anyway"
clientes_avalancha_cierre_presupuesto_diciembre.choices.proteger_vacaciones_navidenas.result_text: You toast the New Year without opening your laptop once all season.
clientes_avalancha_cierre_presupuesto_diciembre.choices.vender_auditoria_ejecutable_en_cinco_dias.label: Scope a sharp five-day strategic deliverable that fits cleanly
clientes_avalancha_cierre_presupuesto_diciembre.choices.vender_auditoria_ejecutable_en_cinco_dias.result_text: They get an impeccable report to justify their budget line, and you still make every holiday dinner relaxed.
clientes_avalancha_cierre_presupuesto_diciembre.title: "December 20th: 'We must burn this budget before the 31st'"
clientes_averia_equipo_trabajo.body: "Tuesday, 11 AM: your main workstation emits a faint burnt-toast aroma and dies forever with three client deliverables half-finished. Without your primary rig, billing drops straight to zero."
clientes_averia_equipo_trabajo.choices.comprar_equipo_profesional_nuevo.label: Buy a new pro-grade machine on a tax-deductible invoice
clientes_averia_equipo_trabajo.choices.comprar_equipo_profesional_nuevo.result_text: Swiping the card hurts, yet you unbox a fast, silent machine today and deduct the expense on your next quarterly return.
clientes_averia_equipo_trabajo.choices.parche_taller_barrio.label: Pay for an emergency patch job at the corner repair shop
clientes_averia_equipo_trabajo.choices.parche_taller_barrio.outcomes.recaida_fatal.result_text: It dies again ten minutes before sending the final file. You end up paying double for a refurbished rig while apologizing profusely.
clientes_averia_equipo_trabajo.choices.parche_taller_barrio.outcomes.soldadura_heroica.result_text: The tech revives the motherboard with solder and faith. It sounds like a helicopter, yet you hit every deadline and save the week.
clientes_averia_equipo_trabajo.choices.renting_equipo_sustitucion.label: Sign a four-month equipment lease to bridge the gap
clientes_averia_equipo_trabajo.choices.renting_equipo_sustitucion.result_text: A loaner rig arrives that afternoon without draining your cash reserves at once, adding only a manageable monthly lease fee.
clientes_averia_equipo_trabajo.title: Black screen in the middle of a deadline
clientes_boda_amigo_encargo_en_b.body: "A friend of a friend asks for a well-paid private job over terrace beers, dropping the national classic: 'I'll hand you crisp bills so we skip the VAT bite—it stays between friends'."
clientes_boda_amigo_encargo_en_b.choices.coger_los_billetes_en_la_terraza.label: Pocket the wad of cash under the table with zero paperwork
clientes_boda_amigo_encargo_en_b.choices.coger_los_billetes_en_la_terraza.result_text: Tax-free bills slide straight into your wallet, plus nagging wonder over how many dinner guests will hear about it.
clientes_boda_amigo_encargo_en_b.choices.hacer_precio_amigo_pero_con_factura.label: Offer a small friend discount on a 100% legal VAT invoice
clientes_boda_amigo_encargo_en_b.choices.hacer_precio_amigo_pero_con_factura.result_text: "A modest courtesy discount with proper VAT settles it: thirty seconds of grumbling, clean wire, peaceful sleep."
clientes_boda_amigo_encargo_en_b.choices.no_mezclar_amistades_y_trabajo.label: Plead a full calendar to avoid mixing beers and invoices
clientes_boda_amigo_encargo_en_b.choices.no_mezclar_amistades_y_trabajo.result_text: Referring another freelancer keeps the friendship intact and spares you awkward money talk.
clientes_boda_amigo_encargo_en_b.title: "'Come on, between friends you won't charge me VAT'"
clientes_bono_subvencion_digital.body: "Borja wants to hire you using a public modernization grant: forty pages of timestamped proof reports, delayed official payout, plus a shady wink about 'splitting the grant money between us'."
clientes_bono_subvencion_digital.choices.ejecutar_expediente_legal_impecable.label: Deliver real work and document every single legal requirement
clientes_bono_subvencion_digital.choices.ejecutar_expediente_legal_impecable.result_text: You fill out compliance forms until your eyes blur, delivering genuine value for a clean, guaranteed payout.
clientes_bono_subvencion_digital.choices.entrar_en_chanchullo_comision_borja.label: Pad the scope and slip him the off-the-books kickback he wants
clientes_bono_subvencion_digital.choices.entrar_en_chanchullo_comision_borja.outcomes.cuela_de_momento.result_text: Quick cash hits your pocket while you pray no public auditor cross-checks those screenshots next year.
clientes_bono_subvencion_digital.choices.entrar_en_chanchullo_comision_borja.outcomes.expediente_denegado_y_bronca.result_text: Reviewers flag inconsistencies and kill the grant; Borja vanishes, leaving you with lost hours and cold sweats.
clientes_bono_subvencion_digital.choices.huir_de_papeleo_subvencionado.label: Refuse shady kickbacks and forty-page grant paperwork alike
clientes_bono_subvencion_digital.choices.huir_de_papeleo_subvencionado.result_text: One crisp 'no' spares you both fraud risk and forty pages of bureaucratic screenshots.
clientes_bono_subvencion_digital.title: The labyrinth of subsidized digitalization vouchers
clientes_boom_boca_oreja.body: "Someone praised your work at an industry lunch and a small miracle happens: three serious quotes get approved in the same week without haggling. Sadly, the day still only has twenty-four hours."
clientes_boom_boca_oreja.choices.abarcar_los_tres_encargos.label: Say yes to all three before anyone changes their mind
clientes_boom_boca_oreja.choices.abarcar_los_tres_encargos.result_text: You bill like a freight train for four weeks straight, though by month's end you mistake the salt shaker for your wireless mouse.
clientes_boom_boca_oreja.choices.convertir_en_iguala_estable.label: Convert the lead client into a four-month retainer
clientes_boom_boca_oreja.choices.convertir_en_iguala_estable.result_text: You trade a chaotic spike for predictable monthly revenue. Knowing what you'll bill on the first almost feels like a salary.
clientes_boom_boca_oreja.choices.elegir_el_mejor_y_derivar.label: Keep the highest-margin project and refer the rest to peers
clientes_boom_boca_oreja.choices.elegir_el_mejor_y_derivar.result_text: You work at a healthy margin, look like class personified in the guild, and bank favours for leaner months ahead.
clientes_boom_boca_oreja.title: "Snowball effect: three serious clients at once"
clientes_cambiecito_grupo_whatsapp.body: Without asking, Borja drops your personal number into a group chat with his brother-in-law, two partners, and sales. Every ten minutes someone requests 'a tiny tweak' contradicting the previous text.
clientes_cambiecito_grupo_whatsapp.choices.archivar_chat_y_cerrar_fase_minima.label: Mute the chat for a year and stick strictly to baseline scope
clientes_cambiecito_grupo_whatsapp.choices.archivar_chat_y_cerrar_fase_minima.result_text: You ignore 140 late-night voice notes, ship exact contracted specs, and keep your sanity intact.
clientes_cambiecito_grupo_whatsapp.choices.salir_del_grupo_y_exigir_interlocutor_unico.label: Exit the chat and demand one point of contact via email
clientes_cambiecito_grupo_whatsapp.choices.salir_del_grupo_y_exigir_interlocutor_unico.result_text: "You enforce surgical order: one spokesperson, consolidated written notes. Noise drops 80% and the invoice clears cleanly."
clientes_cambiecito_grupo_whatsapp.choices.tarificar_cada_ronda_extra.label: Stay in chat and reply to every whim with a euro add-on fee
clientes_cambiecito_grupo_whatsapp.choices.tarificar_cada_ronda_extra.outcomes.pagan_la_fiesta_de_cambios.result_text: Their internal debates end up padding your final bill with three delicious change-order supplements.
clientes_cambiecito_grupo_whatsapp.choices.tarificar_cada_ronda_extra.outcomes.silencio_instantaneo_del_cunado.result_text: Putting a euro tag on his brother-in-law's third whim makes Borja mute the chat and approve version one.
clientes_cambiecito_grupo_whatsapp.title: You were added to 'Project Rocket Launch 🚀'
clientes_campana_black_friday_urgente.body: Borja suddenly notices Black Friday on the calendar and demands copy, visuals, and launch setup by tomorrow morning for 600 €, swearing you'll get the annual retainer if sales explode.
clientes_campana_black_friday_urgente.choices.cobrar_tarifa_expres_por_adelantado.label: Demand 1,450 € upfront today including a rush surcharge
clientes_campana_black_friday_urgente.choices.cobrar_tarifa_expres_por_adelantado.outcomes.paga_con_prisas_y_sale_a_tiempo.result_text: "Fear of missing the sales stampede works miracles: Borja wires payment in minutes and you ship cleanly."
clientes_campana_black_friday_urgente.choices.cobrar_tarifa_expres_por_adelantado.outcomes.se_asusta_y_compra_plantilla_rota.result_text: He balks at the rush rate and slaps together a garish template himself. You dodge a coronary and sleep eight hours.
clientes_campana_black_friday_urgente.choices.declinar_emergencias_comerciales.label: Decline last-minute retail panic and protect your current queue
clientes_campana_black_friday_urgente.choices.declinar_emergencias_comerciales.result_text: You skip the discount frenzy altogether and deliver calmly for clients who plan ahead.
clientes_campana_black_friday_urgente.choices.vender_kit_cerrado_sin_cambios.label: Offer a strict 780 € starter pack with zero revision rounds
clientes_campana_black_friday_urgente.choices.vender_kit_cerrado_sin_cambios.result_text: You lock scope down to the pixel, collect upfront, and shut your laptop at 7 PM sharp.
clientes_campana_black_friday_urgente.title: "'Black Friday is in four days and we have zero assets ready'"
clientes_campana_navidad_contrareloj.body: Holiday lights have hung since November, yet Borja wakes up today demanding a full Christmas campaign in forty-eight hours—offering either an official rush invoice or 'a festive cash envelope'.
clientes_campana_navidad_contrareloj.choices.aceptar_aguinaldo_en_sobre.label: Take the off-the-books holiday envelope and ship in 48 hours
clientes_campana_navidad_contrareloj.choices.aceptar_aguinaldo_en_sobre.result_text: Untaxed gift cash lands in your pocket alongside a mediocre ham and twenty-one points of Hacienda curiosity.
clientes_campana_navidad_contrareloj.choices.facturar_urgencia_navidena_legal.label: Pull off the Christmas miracle on a legal rush invoice
clientes_campana_navidad_contrareloj.choices.facturar_urgencia_navidena_legal.result_text: Forty-eight caffeinated hours save his campaign and put clean euro cushion into your January account.
clientes_campana_navidad_contrareloj.choices.mandarle_villancico_y_cerrar.label: Wish him happy holidays and point to the Gregorian calendar
clientes_campana_navidad_contrareloj.choices.mandarle_villancico_y_cerrar.result_text: Christmas falls on December 25th every single year; discovering it on the sixteenth isn't your emergency.
clientes_campana_navidad_contrareloj.title: "Dec 16th: Borja realizes Christmas is next week"
clientes_chantaje_resena_online.body: After you deliver every single item in the signed quote, Borja demands two extra deliverables for free, hinting darkly that 'a nasty online review really hurts a small studio'.
clientes_chantaje_resena_online.choices.enviar_aviso_legal_con_gestoria.label: Send a formal cease-and-desist letter via legal counsel (75 €)
clientes_chantaje_resena_online.choices.enviar_aviso_legal_con_gestoria.result_text: One glimpse of legal letterhead makes him scrub the threat, pay the balance, and vanish.
clientes_chantaje_resena_online.choices.regalar_un_remate_rapido_y_bloquear.label: Toss him a thirty-minute patch just to get rid of him forever
clientes_chantaje_resena_online.choices.regalar_un_remate_rapido_y_bloquear.result_text: He pays the invoice and you block his number the second the file lands, left with peace and a sour aftertaste.
clientes_chantaje_resena_online.choices.responder_con_pruebas_y_firmeza.label: Refuse blackmail and post a calm, factual public reply
clientes_chantaje_resena_online.choices.responder_con_pruebas_y_firmeza.result_text: Your poised, surgical reply exposes Borja so thoroughly that two prospects message you admiring your professionalism.
clientes_chantaje_resena_online.title: One-star review blackmail over free extras
clientes_clausula_cesion_propiedad_intelectual.body: Marta's legal team slips an addendum into a 2,400 € agreement claiming worldwide exclusive ownership over every source file, internal library, and reusable studio framework.
clientes_clausula_cesion_propiedad_intelectual.choices.firmar_sin_leer_por_cobrar_rapido.label: Sign their boilerplate rider untouched and bank 2,700 € this week
clientes_clausula_cesion_propiedad_intelectual.choices.firmar_sin_leer_por_cobrar_rapido.result_text: You bank 2,700 € fast with zero lawyer back-and-forth, though later you have to rebuild your own starter kits to dodge exclusivity.
clientes_clausula_cesion_propiedad_intelectual.choices.licenciar_resultado_final_sin_editables.label: "Redline it: license final deliverables for 2,400 €, keep your toolkits"
clientes_clausula_cesion_propiedad_intelectual.choices.licenciar_resultado_final_sin_editables.result_text: Corporate legal grumbles out of habit, then accepts your carve-out for pre-existing studio tools.
clientes_clausula_cesion_propiedad_intelectual.choices.tarifar_buyout_exclusivo_al_doble.label: Price full source-file and exclusivity buyout at 4,100 €
clientes_clausula_cesion_propiedad_intelectual.choices.tarifar_buyout_exclusivo_al_doble.result_text: "Putting a real price tag on IP works wonders: leadership approves the full buyout so their team gets editable masters."
clientes_clausula_cesion_propiedad_intelectual.title: "IP buyout rider: legal wants ownership of your reusable templates too"
clientes_cliente_final_puentea_agencia.body: "Two months later, Marta calls directly from the client company: Borja's agency crashed trying to execute your proposal without you. They've fired the agency and want to hire you straight away."
clientes_cliente_final_puentea_agencia.choices.declinar_para_evitar_lios_cruzados.label: Stay out of the crossfire and stick to your current roster
clientes_cliente_final_puentea_agencia.choices.declinar_para_evitar_lios_cruzados.result_text: You skip Borja's angry voice notes and enjoy the karmic fireworks comfortably from the sidelines.
clientes_cliente_final_puentea_agencia.choices.firmar_contrato_directo_sin_peaje.label: Sign directly with the company at full unclipped rates
clientes_cliente_final_puentea_agencia.choices.firmar_contrato_directo_sin_peaje.result_text: With zero middlemen skimming the top, you invoice 100% of the budget and rescue the launch with authority.
clientes_cliente_final_puentea_agencia.choices.revisar_no_competencia_con_gestor.label: Have your gestor check for non-compete traps first (90 €)
clientes_cliente_final_puentea_agencia.choices.revisar_no_competencia_con_gestor.result_text: Turns out Borja never drafted a valid exclusivity clause. You walk through the front door legally bulletproof.
clientes_cliente_final_puentea_agencia.title: The end client figures out who actually did the work
clientes_cliente_husos_horarios_eeuu.body: "A California company approves your quote without haggling a cent and wires upfront in dollars. The catch: their 'bright and early morning sync' lands right in your soup at 10:30 PM Spanish time."
clientes_cliente_husos_horarios_eeuu.choices.aceptar_horario_costa_oeste.label: Take the project, open a multi-currency account, and work late
clientes_cliente_husos_horarios_eeuu.choices.aceptar_horario_costa_oeste.result_text: Converted into euros the payout is glorious, even if you eat dinner wearing headphones three nights a week.
clientes_cliente_husos_horarios_eeuu.choices.acordar_franja_solapada_tarde.label: Cap calls strictly to 6:00 PM Madrid overlap
clientes_cliente_husos_horarios_eeuu.choices.acordar_franja_solapada_tarde.result_text: They sip early coffee in California while you shut your laptop at seven sharp with American rates in the bank.
clientes_cliente_husos_horarios_eeuu.choices.declinar_desfase_horario.label: Pass on the nine-hour time-zone gap and protect your sleep
clientes_cliente_husos_horarios_eeuu.choices.declinar_desfase_horario.result_text: You wave goodbye to greenbacks knowing your circadian rhythm hates living on two continents at once.
clientes_cliente_husos_horarios_eeuu.title: "San Francisco client: big dollars, late nights"
clientes_comision_derivacion_colega.body: An overloaded fellow freelancer offers to hand you a pre-sold mid-sized project in exchange for a 10% finder's fee—either properly invoiced as a deductible cost or 'in an envelope over coffee'.
clientes_comision_derivacion_colega.choices.declinar_por_falta_de_hueco.label: Thank them warmly and pass the referral along to another peer
clientes_comision_derivacion_colega.choices.declinar_por_falta_de_hueco.result_text: You bank goodwill in the guild without sacrificing your evenings this week.
clientes_comision_derivacion_colega.choices.pagar_comision_con_factura_legal.label: Take the project and pay the 10% referral on a clean invoice
clientes_comision_derivacion_colega.choices.pagar_comision_con_factura_legal.result_text: The referred client is a dream, the payout is solid, and your colleague's referral fee is 100% tax-deductible.
clientes_comision_derivacion_colega.choices.repartir_en_efectivo_sin_papeles.label: Settle off the books and slip them cash at the corner café
clientes_comision_derivacion_colega.choices.repartir_en_efectivo_sin_papeles.result_text: Both of you dodge taxes today over espresso while stacking another untraceable cash trail.
clientes_comision_derivacion_colega.title: A swamped guild peer offers you a turnkey client
clientes_concurso_acreedores_cuenta_clave.body: "Morning news drops like a brick: a corporate account carrying 4,200 € in open invoices files for court-supervised insolvency right in the middle of a critical phase."
clientes_concurso_acreedores_cuenta_clave.choices.negociar_pago_prioritario_por_servicio_esencial.label: Demand estate-priority upfront cash in exchange for keep-alive support
clientes_concurso_acreedores_cuenta_clave.choices.negociar_pago_prioritario_por_servicio_esencial.outcomes.autorizan_pago_esencial_inmediato.result_text: "Without your work they cannot operate: management clears 2,100 € in priority cash to keep lights on."
clientes_concurso_acreedores_cuenta_clave.choices.negociar_pago_prioritario_por_servicio_esencial.outcomes.juzgado_congela_caja_dos_meses.result_text: The court freezes bank accounts that very morning, stalling even emergency disbursements for now.
clientes_concurso_acreedores_cuenta_clave.choices.paralizar_servicio_y_reclamar_por_tu_cuenta.label: Freeze work in progress today and file your proof of debt yourself
clientes_concurso_acreedores_cuenta_clave.choices.paralizar_servicio_y_reclamar_por_tu_cuenta.result_text: You stop the bleeding before donating another unpaid month and land on the official creditor roll.
clientes_concurso_acreedores_cuenta_clave.choices.personarse_con_asesoria_y_congelar_entrega.label: Halt unbilled work and have Elena file formal claim & VAT recovery (180 €)
clientes_concurso_acreedores_cuenta_clave.choices.personarse_con_asesoria_y_congelar_entrega.result_text: Elena files your claim cleanly, claws back unpaid VAT on schedule, and secures your standing with the court receiver.
clientes_concurso_acreedores_cuenta_clave.title: "Court gazette shock: a flagship client files for insolvency"
clientes_concurso_acreedores_proyecto.body: "Midway through a major job your emails bounce and the gazette confirms it: the client filed for insolvency. Middleman Borja whispers you might rescue 850 € cash before receivers arrive."
clientes_concurso_acreedores_proyecto.choices.aceptar_arreglo_rapido_borja.label: Take Borja's 'quick cash fix' before they seal the offices
clientes_concurso_acreedores_proyecto.choices.aceptar_arreglo_rapido_borja.outcomes.cerradura_cambiada.result_text: "By the time you arrive, the locks are already changed: no envelope, no client, no pay—just a wasted trip and heartburn."
clientes_concurso_acreedores_proyecto.choices.aceptar_arreglo_rapido_borja.outcomes.rescate_parcial_en_mano.result_text: You leave that half-empty warehouse with a discreet envelope covering part of your hours, knowing a judge will audit their books.
clientes_concurso_acreedores_proyecto.choices.asumir_perdida_y_pasar_pagina.label: Write off the loss today and repurpose the generic work
clientes_concurso_acreedores_proyecto.choices.asumir_perdida_y_pasar_pagina.result_text: You swallow hard crossing off the expected payout, cover out-of-pocket costs, and recycle the best pieces into your pitch deck.
clientes_concurso_acreedores_proyecto.choices.rectificativa_iva_con_gestoria.label: File a credit note via your gestor to recover the VAT (190 €)
clientes_concurso_acreedores_proyecto.choices.rectificativa_iva_con_gestoria.result_text: You hit every legal deadline to avoid gifting Hacienda the VAT on an unpaid bill and salvage a clean partial settlement.
clientes_concurso_acreedores_proyecto.title: Shutters down halfway through the project
clientes_conferencia_magistral_sector.body: A national conference and a business school both invite you this month to lead a senior masterclass on your craft. Speaker honorariums are generous and the room is packed with decision-makers.
clientes_conferencia_magistral_sector.choices.aceptar_congreso_y_masterclass.label: Prep both events thoroughly and maximize senior visibility
clientes_conferencia_magistral_sector.choices.aceptar_congreso_y_masterclass.result_text: You reach Friday hoarse, yet you bank a splendid speaker fee and pocket business cards from no-haggle clients.
clientes_conferencia_magistral_sector.choices.declinar_escenarios_este_semestre.label: Thank them warmly and stay cosy at your own desk
clientes_conferencia_magistral_sector.choices.declinar_escenarios_este_semestre.result_text: You skip building eighty slides past midnight and enjoy a calm week at home.
clientes_conferencia_magistral_sector.choices.hacer_solo_formacion_ejecutiva.label: Take only the higher-paying executive workshop with zero travel
clientes_conferencia_magistral_sector.choices.hacer_solo_formacion_ejecutiva.result_text: Four sharp hours, zero airport queues, and a clean invoice for well-measured effort.
clientes_conferencia_magistral_sector.title: Paid industry keynote and executive masterclass
clientes_congelacion_presupuestos_enero.body: Marta wants you to kick off a 2,200 € Q1 project immediately, warning that corporate finance has frozen January purchase orders and promising 'we'll backdate the paperwork in March'.
clientes_congelacion_presupuestos_enero.choices.adelantar_trabajo_confiando_en_marzo.label: Start in good faith hoping the full budget unlocks by March
clientes_congelacion_presupuestos_enero.choices.adelantar_trabajo_confiando_en_marzo.outcomes.liberan_presupuesto_con_retraso.result_text: January cash flow stings, though procurement eventually approves the full deferred invoice.
clientes_congelacion_presupuestos_enero.choices.adelantar_trabajo_confiando_en_marzo.outcomes.recorte_sorpresa_de_partidas.result_text: February restructurings slash Marta's department by 40%, leaving half your work unpaid and disputed.
clientes_congelacion_presupuestos_enero.choices.facturar_diagnostico_menor_por_tarjeta.label: Carve out an 890 € discovery sprint under her corporate card cap
clientes_congelacion_presupuestos_enero.choices.facturar_diagnostico_menor_por_tarjeta.result_text: Routing Phase 0 through Marta's discretionary card bypasses procurement gridlock and puts clean cash in the bank today.
clientes_congelacion_presupuestos_enero.choices.no_mover_un_dedo_sin_orden_compra.label: Refuse to start a single task without a signed PO number
clientes_congelacion_presupuestos_enero.choices.no_mover_un_dedo_sin_orden_compra.result_text: The moment her timeline looks threatened, an emergency 1,500 € phase-one PO magically materializes.
clientes_congelacion_presupuestos_enero.title: "January freeze: 'Finance hasn't unlocked Q1 purchase orders yet'"
clientes_consejo_asesor_mensual.body: "Four years in the trenches earn Marta's pitch to join a mid-sized firm's monthly steering committee as external advisor: less manual grind and prestige fees, paired with boardroom pressure."
clientes_consejo_asesor_mensual.choices.aceptar_silla_consejero_seis_meses.label: Sign the six-month executive advisory retainer
clientes_consejo_asesor_mensual.choices.aceptar_silla_consejero_seis_meses.result_text: You finally get paid for judgment rather than raw hours, even if each board session feels like an oral exam with sharks.
clientes_consejo_asesor_mensual.choices.acotar_a_informes_trimestrales.label: Cap the role to written strategic briefs without board politics
clientes_consejo_asesor_mensual.choices.acotar_a_informes_trimestrales.result_text: You bill handsomely for crisp strategic audits while steering clear of internal turf wars.
clientes_consejo_asesor_mensual.choices.declinar_corbata_y_cuidar_ritmo.label: Pass on the boardroom seat to protect your peace of mind
clientes_consejo_asesor_mensual.choices.declinar_corbata_y_cuidar_ritmo.result_text: You skip the executive badge and keep quiet afternoons free of three-hour committee meetings.
clientes_consejo_asesor_mensual.title: External seat on an executive steering committee
clientes_consorcio_internacional_senior.body: Your multi-year track record draws a three-country consortium seeking a veteran Spanish lead for a high-budget strategic deliverable with demanding milestones and rock-solid wire payments.
clientes_consorcio_internacional_senior.choices.asumir_coordinacion_completa_consorcio.label: Take full consortium coordination at international senior rates
clientes_consorcio_internacional_senior.choices.asumir_coordinacion_completa_consorcio.result_text: You juggle three time zones and a hundred English threads, banking one of the cleanest big invoices of your career.
clientes_consorcio_internacional_senior.choices.declinar_consorcio_por_conciliacion.label: Decline the cross-border sprint and put personal life first
clientes_consorcio_internacional_senior.choices.declinar_consorcio_por_conciliacion.result_text: "By year seven you know the exact euro value of a calm dinner: you pass on the mega-gig guilt-free."
clientes_consorcio_internacional_senior.choices.subcontratar_apoyo_tecnico_puntual.label: Accept while hiring deductible specialist backup (550 €)
clientes_consorcio_internacional_senior.choices.subcontratar_apoyo_tecnico_puntual.result_text: Sharing the heavy lifting with a trusted peer delivers Swiss-watch precision without costing your evenings.
clientes_consorcio_internacional_senior.title: Lead specialist for an international consortium
clientes_consorcio_transatlantico_endless.body: Three independent partner studios across Europe and the US need a seasoned Spain-based lead to orchestrate cross-border deliverables at 4,600 € per milestone.
clientes_consorcio_transatlantico_endless.choices.asumir_solo_bloque_europeo_asincrono.label: Take only the European workstream at 3,250 € with zero evening calls
clientes_consorcio_transatlantico_endless.choices.asumir_solo_bloque_europeo_asincrono.result_text: New York reads your crisp written handoffs in their morning while you collect clean SEPA euros and dine on time.
clientes_consorcio_transatlantico_endless.choices.coordinar_con_equipo_propio_y_ventana_fija.label: Anchor the Iberian hub with your staffer plus a 400 € international bonus
clientes_consorcio_transatlantico_endless.choices.coordinar_con_equipo_propio_y_ventana_fija.result_text: Smart shift handoffs and a generous team bonus unlock top-tier international billing without late-night burnout.
clientes_consorcio_transatlantico_endless.choices.pilotar_los_tres_husos_en_solitario.label: Run the entire three-timezone coordination solo for the full 4,600 €
clientes_consorcio_transatlantico_endless.choices.pilotar_los_tres_husos_en_solitario.outcomes.desfase_horario_pasa_factura.result_text: Delivery holds and 4,200 € clears, though by Friday you swear off world-clock widgets for good.
clientes_consorcio_transatlantico_endless.choices.pilotar_los_tres_husos_en_solitario.outcomes.ejecucion_brillante_y_bonus.result_text: You stick the landing across three timezones and bank the full fee, even if you start dreaming in English.
clientes_consorcio_transatlantico_endless.title: Madrid–Munich–New York consortium seeks a battle-tested lead
clientes_crisis_marca_blanca_agencia.body: "An agency subcontracting you on a 2,800 € build implodes mid-sprint: their account director quit this morning and they beg you to join the client call pretending to be 'in-house leadership'."
clientes_crisis_marca_blanca_agencia.choices.entregar_archivos_a_agencia_y_bajarse.label: Invoice your 1,100 € completed milestone and stay off the call
clientes_crisis_marca_blanca_agencia.choices.entregar_archivos_a_agencia_y_bajarse.result_text: You hand over clean files up to your signed scope, collect what's owed, and let the agency steer its own shipwreck.
clientes_crisis_marca_blanca_agencia.choices.ponerse_su_camiseta_por_sobreprecio.label: Play along on their borrowed @agency address for 2,400 € upfront
clientes_crisis_marca_blanca_agencia.choices.ponerse_su_camiseta_por_sobreprecio.result_text: You put out the fire dressed as someone else's staff. Strong payout, exhausting charade.
clientes_crisis_marca_blanca_agencia.choices.salvar_reunion_con_identidad_real_y_recargo.label: Join transparently under your own name for 1,950 € paid today
clientes_crisis_marca_blanca_agencia.choices.salvar_reunion_con_identidad_real_y_recargo.result_text: You refuse to fake an email alias, rescue the technical presentation cleanly, and the end client quietly writes down your name.
clientes_crisis_marca_blanca_agencia.title: "White-label meltdown: the agency's account lead quits mid-project"
clientes_cumbre_presencial_europa.body: Your European client hosts its annual leadership retreat and wants you on-site for two days to map next year's roadmap.
clientes_cumbre_presencial_europa.choices.intervenir_por_videollamada_en_bloque_clave.label: Skip the airport and lead your strategy block remotely for 2,100 €
clientes_cumbre_presencial_europa.choices.intervenir_por_videollamada_en_bloque_clave.result_text: Zero boarding queues, a razor-sharp two-hour keynote on the boardroom screen, and dinner on your own couch.
clientes_cumbre_presencial_europa.choices.volar_facturando_jornadas_y_dietas.label: Fly out billing 3,400 € in on-site consulting days plus 380 € expenses
clientes_cumbre_presencial_europa.choices.volar_facturando_jornadas_y_dietas.result_text: You fly home with next year's mandate locked in, partner-level trust, and spotless deductible travel receipts.
clientes_cumbre_presencial_europa.title: "Annual strategy summit in Zurich: two whiteboard days at Swiss rates"
clientes_dependencia_cuenta_gigante.body: Your flagship corporate account wants another massive block of hours, pushing them past half your total revenue. Marta hints they now expect absolute priority over every other client you serve.
clientes_dependencia_cuenta_gigante.choices.abrazar_monocultivo_millonario.label: Accept the full expansion despite single-client dependency
clientes_dependencia_cuenta_gigante.choices.abrazar_monocultivo_millonario.result_text: The invoice total looks glorious, though one corporate reorg over there could now rattle your entire studio.
clientes_dependencia_cuenta_gigante.choices.fijar_techo_y_diversificar_cartera.label: Cap them at 35% capacity and court two mid-sized accounts
clientes_dependencia_cuenta_gigante.choices.fijar_techo_y_diversificar_cartera.result_text: Marta frowns briefly yet respects your independence as you rebalance revenue across healthier accounts.
clientes_dependencia_cuenta_gigante.choices.recortar_exposicion_y_respirar.label: Decline the extra hours and reclaim breathing room this month
clientes_dependencia_cuenta_gigante.choices.recortar_exposicion_y_respirar.result_text: You hit the brakes before turning into a disguised single-company employee and let your pulse settle.
clientes_dependencia_cuenta_gigante.title: When a single client becomes half your studio
clientes_desierto_agosto.body: Half of Spain is at a beach bar and your inbox only echoes out-of-office replies until September. A desk fan stirs warm air in your silent studio while the bank queues up every fixed monthly debit.
clientes_desierto_agosto.choices.bajar_persiana_quince_dias.label: Pull the shutters down properly and unplug for two weeks
clientes_desierto_agosto.choices.bajar_persiana_quince_dias.result_text: You accept the revenue dip and leave the laptop behind. For the first time in months, lunch doesn't end with checking email.
clientes_desierto_agosto.choices.campana_caza_clientes_verano.label: Run a promo campaign to catch orphaned August emergencies
clientes_desierto_agosto.choices.campana_caza_clientes_verano.outcomes.rescate_veraniego.result_text: You land a foreign company desperate because nobody in Madrid is picking up the phone. You save the month comfortably.
clientes_desierto_agosto.choices.campana_caza_clientes_verano.outcomes.silencio_solar.result_text: Your ads only attract early-morning bots and a cousin asking whether you also fix inkjet printers.
clientes_desierto_agosto.choices.ordenar_procesos_y_facturas.label: Use the quiet spell to update rates, templates, and tax files
clientes_desierto_agosto.choices.ordenar_procesos_y_facturas.result_text: You tidy up licenses, leave every folder spotless, and prime your September sales pipeline with a clear head.
clientes_desierto_agosto.title: "August: closed for holidays (except your quota)"
clientes_dilema_sabatico_cartera.body: Seven years of relentless quarters bring a lucrative rush project to your desk alongside deep fatigue a single Sunday on the sofa can no longer cure. You have to choose your pace.
clientes_dilema_sabatico_cartera.choices.derivar_a_red_cobrando_supervision.label: Pass execution to a trusted peer and bill senior oversight
clientes_dilema_sabatico_cartera.choices.derivar_a_red_cobrando_supervision.result_text: Two hours of weekly quality review keep the client delighted while sparing your mind and back.
clientes_dilema_sabatico_cartera.choices.exprimir_sprint_bien_pagado.label: Grit your teeth one more time and bank the rush project
clientes_dilema_sabatico_cartera.choices.exprimir_sprint_bien_pagado.result_text: Muscle memory carries you to a fat invoice, though your nervous system quietly logs the overtime.
clientes_dilema_sabatico_cartera.choices.mes_a_medio_gas_regenerador.label: Freeze new intake for thirty days to reset body and head
clientes_dilema_sabatico_cartera.choices.mes_a_medio_gas_regenerador.result_text: You maintain only essentials, take morning walks in the sun, and remember why you went solo in the first place.
clientes_dilema_sabatico_cartera.title: "Seven years in the trenches: body versus billing"
clientes_direccion_fraccionada_senior.body: A growing mid-market firm can't afford your seniority full-time and offers 3,800 € to step in as fractional lead every Tuesday and Thursday.
clientes_direccion_fraccionada_senior.choices.aceptar_con_respaldo_de_tu_plantilla.label: Take the seat while your motivated employee anchors studio delivery
clientes_direccion_fraccionada_senior.choices.aceptar_con_respaldo_de_tu_plantilla.result_text: Two mornings steering strategy offsite while your studio hums like Swiss clockwork back home.
clientes_direccion_fraccionada_senior.choices.asumir_dos_dias_en_solitario_apretando_agenda.label: Take both days solo for 3,800 € and cram other clients into Wed/Fri
clientes_direccion_fraccionada_senior.choices.asumir_dos_dias_en_solitario_apretando_agenda.result_text: Revenue looks glorious on paper, even if Wednesdays feel like air-traffic control.
clientes_direccion_fraccionada_senior.choices.firmar_un_solo_dia_estrategico_semanal.label: Cap engagement at one strategy day per week for 2,350 € non-exclusive
clientes_direccion_fraccionada_senior.choices.firmar_un_solo_dia_estrategico_semanal.result_text: You avoid disguised employment creep and lock in high-margin recurring fees on your own terms.
clientes_direccion_fraccionada_senior.title: "Fractional director two days a week: executive pay, zero boss"
clientes_encargo_urgente.body: "Borja texts in all caps with three exclamation marks: his regular supplier bailed and he needs a rush deliverable immediately. He swears everything is crystal clear in an unpunctuated half-page doc."
clientes_encargo_urgente.choices.entrega_express_contado.label: Pull overtime and charge upfront with a rush surcharge
clientes_encargo_urgente.choices.entrega_express_contado.result_text: Powered by thermoses of coffee, you deliver on time. The wire lands right away, though your left eyelid starts twitching again.
clientes_encargo_urgente.choices.presupuesto_estandar_60_dias.label: Accept at a sane pace on a 60-day invoice
clientes_encargo_urgente.choices.presupuesto_estandar_60_dias.result_text: You set a civilized schedule and issue a larger 60-day invoice—that grand tradition of working today and getting paid whenever stars align.
clientes_encargo_urgente.choices.rechazar_y_descansar.label: Say your schedule is full and rest this week
clientes_encargo_urgente.choices.rechazar_y_descansar.result_text: You utter the sacred word 'no' without apologizing three times. The world keeps spinning, your shoulders drop, and you sleep eight hours.
clientes_encargo_urgente.title: "'It was due yesterday, super quick job though'"
clientes_esposas_oro_iguala_vip.body: A VIP client offers a five-month renewal at a spectacular monthly fee, yet their executives have grown used to texting Sunday nights expecting full answers before Monday's first coffee.
clientes_esposas_oro_iguala_vip.choices.imponer_clausula_desconexion_digital.label: Renew strictly with a written Friday-to-Monday offline clause
clientes_esposas_oro_iguala_vip.choices.imponer_clausula_desconexion_digital.result_text: "Your track record outweighs their late-night whims: they sign civilized hours and you keep a healthy retainer."
clientes_esposas_oro_iguala_vip.choices.soltar_las_esposas_y_recuperar_vida.label: "Walk away from the toxic retainer: no fee is worth an ulcer"
clientes_esposas_oro_iguala_vip.choices.soltar_las_esposas_y_recuperar_vida.result_text: You wrap up gracefully, and that first Sunday with your phone switched off tastes like pure freedom.
clientes_esposas_oro_iguala_vip.choices.tragar_esposas_oro_cinco_meses.label: Sign the VIP deal and accept near-perpetual availability
clientes_esposas_oro_iguala_vip.choices.tragar_esposas_oro_cinco_meses.result_text: Monthly revenue rockets upward while your nightstand phone buzzes away at your nervous system night after night.
clientes_esposas_oro_iguala_vip.title: "Golden handcuffs: huge monthly retainer, zero sleep"
clientes_evento_networking_canapes.body: A local SME networking night opens downtown. The ticket is tax-deductible and promises genuine leads, provided you trade your couch for two hours of small talk in smart-casual shoes.
clientes_evento_networking_canapes.choices.ir_con_objetivo_comercial_claro.label: Buy the deductible ticket (65 €) and target three real businesses
clientes_evento_networking_canapes.choices.ir_con_objetivo_comercial_claro.outcomes.contacto_directo_rentable.result_text: "Dodging crypto bros pays off: an operations director needed your exact skill set this very week."
clientes_evento_networking_canapes.choices.ir_con_objetivo_comercial_claro.outcomes.solo_vendedores_cruzados.result_text: Everyone in the room came to pitch and nobody came to buy—at least the croquettes are tax-deductible.
clientes_evento_networking_canapes.choices.patrocinar_mesa_breve_presentacion.label: Sponsor a five-minute lightning talk in front of the room (180 €)
clientes_evento_networking_canapes.choices.patrocinar_mesa_breve_presentacion.result_text: Plain, jargon-free expertise wins two signed quotes before the catering tray empties.
clientes_evento_networking_canapes.choices.quedarse_en_casa_descansando.label: Skip the cold canapés and stay home in slippers
clientes_evento_networking_canapes.choices.quedarse_en_casa_descansando.result_text: Your social battery thanks you profoundly from minute one.
clientes_evento_networking_canapes.title: Evening mixer of business cards and lukewarm croquettes
clientes_factura_corporativa_90_dias.body: "Marta in Corporate Procurement approves a 2,600 € project with one catch: upload twelve certificates to a 1998 vendor portal and accept '90-day post-validation payment terms'."
clientes_factura_corporativa_90_dias.choices.exigir_anticipo_inicio.label: "Stand firm: 40% upfront or work doesn't start"
clientes_factura_corporativa_90_dias.choices.exigir_anticipo_inicio.result_text: Marta sighs at her watch, checks with Finance, and unlocks an advance exception. You bank part today and the rest in sixty days.
clientes_factura_corporativa_90_dias.choices.pasar_por_el_aro_corporativo.label: Survive the red-tape obstacle course and float them 90 days
clientes_factura_corporativa_90_dias.choices.pasar_por_el_aro_corporativo.result_text: You lose an afternoon wrestling purchase-order codes and ship the work. The number looks lovely on paper; now begins the desert crossing.
clientes_factura_corporativa_90_dias.choices.rechazar_financiar_multinacional.label: "Decline the offer: you aren't an interest-free bank"
clientes_factura_corporativa_90_dias.choices.rechazar_financiar_multinacional.result_text: You thank her politely and close the Jurassic portal. Less gross volume on the annual spreadsheet, zero cash-crunch risk.
clientes_factura_corporativa_90_dias.title: Vendor onboarding and ninety-day payment terms
clientes_factura_electronica_face_rechazada.body: "You delivered a municipal job on time, yet the FACe e-invoicing portal bounces your bill a third time: City Hall quietly changed one digit of its accounting unit code and nobody picks up the phone."
clientes_factura_electronica_face_rechazada.choices.aparcar_tramite_este_mes.label: Close the browser today before throwing your mouse out the window
clientes_factura_electronica_face_rechazada.choices.aparcar_tramite_este_mes.result_text: You shut the laptop to save your blood pressure, knowing the rejected file stays frozen until someone fixes that code.
clientes_factura_electronica_face_rechazada.choices.encargar_tramite_a_gestoria.label: Pay your gestor a small fee to wrestle the XML portal
clientes_factura_electronica_face_rechazada.choices.encargar_tramite_a_gestoria.result_text: Your gestor speaks fluent bureaucracy, resubmits a clean Facturae file, and moves the invoice straight to approved.
clientes_factura_electronica_face_rechazada.choices.plantarse_en_intervencion_presencial.label: Book an early desk appointment until you hunt down the code
clientes_factura_electronica_face_rechazada.choices.plantarse_en_intervencion_presencial.result_text: Half a morning vanishes at counter windows until a sympathetic clerk scribbles the new code on a sticky note and unlocks payment.
clientes_factura_electronica_face_rechazada.title: Public e-invoice rejected three times in a row
clientes_feria_sectorial_primavera.body: "The flagship spring industry expo opens its doors: three days of 4 € convention-center coffee and directors scouting external specialists before summer."
clientes_feria_sectorial_primavera.choices.agenda_cerrada_con_portfolio_en_tablet.label: Attend one targeted day with 6 booked coffees and your updated portfolio (140 €)
clientes_feria_sectorial_primavera.choices.agenda_cerrada_con_portfolio_en_tablet.result_text: Six focused meetings land a 2,850 € spring engagement without wandering miles of exhibition carpet.
clientes_feria_sectorial_primavera.choices.patear_pabellones_dos_dias_a_puerta_fria.label: Buy the 220 € pass and work the floor cold for two full days
clientes_feria_sectorial_primavera.choices.patear_pabellones_dos_dias_a_puerta_fria.outcomes.bolsa_llena_de_boligrafos_y_pies_rotos.result_text: You come home with fourteen branded pens, aching calves, and one modest gig that barely covers the badge.
clientes_feria_sectorial_primavera.choices.patear_pabellones_dos_dias_a_puerta_fria.outcomes.cazas_expositor_en_apuros.result_text: An overwhelmed exhibitor hires you on the spot for 2,500 € to handle their post-show lead surge.
clientes_feria_sectorial_primavera.choices.quedarse_en_estudio_atendiendo_urgencias.label: Skip the expo and bill quietly while competitors lose their voices
clientes_feria_sectorial_primavera.choices.quedarse_en_estudio_atendiendo_urgencias.result_text: With half your rivals stuck on noisy booths, two urgent briefs land straight on your desk.
clientes_feria_sectorial_primavera.title: "Spring trade expo in Hall 7: lanyards, carpet miles, and fresh budgets"
clientes_fluctuacion_divisa_extranjera.body: Your 2,900 €-equivalent international account loses 9% between FX swings and SWIFT wire fees just as their US team starts booking 'quick syncs' at 8:30 PM your time.
clientes_fluctuacion_divisa_extranjera.choices.abrir_cuenta_multidivisa_deducible.label: Set up a 60 € multi-currency account and switch to async video updates
clientes_fluctuacion_divisa_extranjera.choices.abrir_cuenta_multidivisa_deducible.result_text: You kill the wire-fee bleed and replace three late-night calls with crisp five-minute screen recordings.
clientes_fluctuacion_divisa_extranjera.choices.absorber_cambio_y_atender_noches.label: Take their late calls with rush hours (2,950 €) despite wire fees
clientes_fluctuacion_divisa_extranjera.choices.absorber_cambio_y_atender_noches.result_text: Their US team loves your live availability and approves extra hours, though 95 € vanishes in wire fees and dinner slips past 11 PM.
clientes_fluctuacion_divisa_extranjera.choices.pasar_contrato_a_euros_y_ventana_europea.label: Move the contract to fixed euros and a hard 6:00 PM call cutoff
clientes_fluctuacion_divisa_extranjera.choices.pasar_contrato_a_euros_y_ventana_europea.outcomes.aceptan_euros_y_horario_madrid.result_text: "You're still sharper than their domestic agencies: they lock in 2,950 € net and respect European evenings."
clientes_fluctuacion_divisa_extranjera.choices.pasar_contrato_a_euros_y_ventana_europea.outcomes.reducen_bolsa_pero_en_euros.result_text: They agree to fixed euros and zero late calls while trimming scope to a lighter, stress-free retainer.
clientes_fluctuacion_divisa_extranjera.title: Getting paid in dollars at 8:30 PM comes with fine print
clientes_formacion_in_company_ia_etica.body: After three years of unreviewed generative mishaps, Marta books a 3,600 € two-day in-company workshop to instill real QA standards across twenty-five staffers.
clientes_formacion_in_company_ia_etica.choices.codirigir_taller_practico_con_tu_empleado.label: Co-host hands-on labs with your employee plus a 350 € speaker bonus
clientes_formacion_in_company_ia_etica.choices.codirigir_taller_practico_con_tu_empleado.result_text: Tag-team facilitation elevates the workshop to 4,100 € while giving your staffer a proud career highlight.
clientes_formacion_in_company_ia_etica.choices.entregar_manual_interno_y_sesion_corta.label: Deliver a crisp half-day briefing and internal playbook for 2,300 €
clientes_formacion_in_company_ia_etica.choices.entregar_manual_interno_y_sesion_corta.result_text: Peak hourly margin without losing your voice grading beginner exercises.
clientes_formacion_in_company_ia_etica.choices.impartir_taller_y_vender_supervision_mensual.label: Lead both training days (3,600 €) and attach a monthly QA oversight retainer
clientes_formacion_in_company_ia_etica.choices.impartir_taller_y_vender_supervision_mensual.result_text: You walk out of the boardroom to applause with a light monthly audit retainer signed on top.
clientes_formacion_in_company_ia_etica.title: "Executive workshop: 'Teach our 25-person team how not to ship AI slop'"
clientes_homologacion_portal_ariba.body: "Before paying a 3,200 € corporate engagement, a multinational forces you through its global vendor portal: stamped bank letters, liability insurance, and endless compliance forms."
clientes_homologacion_portal_ariba.choices.delegar_expediente_en_gestoria_premium.label: Hand the dossier and 240 € policy paperwork to your premium advisor
clientes_homologacion_portal_ariba.choices.delegar_expediente_en_gestoria_premium.result_text: Elena clears every compliance check on the first upload. You unlock preferred-vendor status plus a steady block of hours.
clientes_homologacion_portal_ariba.choices.facturar_a_traves_de_partner_homologado.label: Give an already-approved peer 18% to bill through their vendor ID
clientes_homologacion_portal_ariba.choices.facturar_a_traves_de_partner_homologado.result_text: Your colleague routes the invoice under their vendor code, keeps their cut, and spares you every bureaucratic checkbox.
clientes_homologacion_portal_ariba.choices.pelearse_tres_dias_con_el_portal.label: Buy the 240 € policy and wrestle all 48 portal screens yourself
clientes_homologacion_portal_ariba.choices.pelearse_tres_dias_con_el_portal.result_text: After three automated rejections over PDF file sizes, your vendor ID goes live and the opening milestone clears.
clientes_homologacion_portal_ariba.title: "Procurement portal purgatory: 48 tabs just to get paid"
clientes_iguala_urgencias_mensual.body: Marta wants guaranteed priority access to your studio for the next five months. They pay a handsome monthly retainer on top of base billing, expecting replies to urgent tickets in under two hours.
clientes_iguala_urgencias_mensual.choices.declinar_correa_electronica.label: Refuse the electronic leash and stick to fixed-scope projects
clientes_iguala_urgencias_mensual.choices.declinar_correa_electronica.result_text: You pass on easy recurring money in exchange for staying the sole owner of your calendar.
clientes_iguala_urgencias_mensual.choices.firmar_sla_completo.label: Sign the full priority SLA (five months of cash and on-call)
clientes_iguala_urgencias_mensual.choices.firmar_sla_completo.result_text: Your bank account smiles every first of the month, though your inbox chime now triggers a pure Pavlovian flinch.
clientes_iguala_urgencias_mensual.choices.pactar_bolsa_horario_oficina.label: Negotiate a capped hour bank strictly during office hours
clientes_iguala_urgencias_mensual.choices.pactar_bolsa_horario_oficina.result_text: "You set civilized boundaries without losing the contract: slightly smaller monthly fee, peaceful dinners every night."
clientes_iguala_urgencias_mensual.title: Monthly retainer with a priority hotline
clientes_indexacion_iguala_ipc_corporativo.body: You've billed the same 1,800 € monthly retainer for two years while the client raised its own prices 9%. Procurement replies that 'company policy freezes external freelancer rates'.
clientes_indexacion_iguala_ipc_corporativo.choices.aceptar_congelacion_otro_ano.label: Swallow the rate freeze while tacking on a small side task (1,920 €)
clientes_indexacion_iguala_ipc_corporativo.choices.aceptar_congelacion_otro_ano.result_text: You lock in a friction-free renewal plus a minor add-on ticket, though swallowing inflation another year still stings.
clientes_indexacion_iguala_ipc_corporativo.choices.exigir_actualizacion_ipc_o_no_renovar.label: Hold firm at 2,050 €/month citing what replacing you would cost
clientes_indexacion_iguala_ipc_corporativo.choices.exigir_actualizacion_ipc_o_no_renovar.outcomes.compras_cede_ante_marta.result_text: Marta warns replacing you would cost triple, forcing procurement to sign off on the CPI bump.
clientes_indexacion_iguala_ipc_corporativo.choices.exigir_actualizacion_ipc_o_no_renovar.outcomes.no_renuevan_y_liquidas_traspaso.result_text: Procurement digs in out of bureaucratic pride; you bill 1,600 € for handover and free up twenty underpaid hours a month.
clientes_indexacion_iguala_ipc_corporativo.choices.recortar_horas_en_misma_proporcion.label: Keep the 1,800 € headline figure while trimming included hours by 15%
clientes_indexacion_iguala_ipc_corporativo.choices.recortar_horas_en_misma_proporcion.result_text: "Checkmate: procurement brags about holding the line on budget and you reclaim a free morning every week."
clientes_indexacion_iguala_ipc_corporativo.title: "Retainer CPI indexation: 'Inflation clauses don't apply to freelancers'"
clientes_jungla_suscripciones_saas.body: "The first of the month greets you with a volley of charges: your core work suite, cloud storage, and three apps auto-renewed with a 35% hike (540 €) for unasked-for AI tools."
clientes_jungla_suscripciones_saas.choices.migrar_alternativas_sin_cuota.label: Cancel pricey licenses and spend the weekend moving to open tools
clientes_jungla_suscripciones_saas.choices.migrar_alternativas_sin_cuota.outcomes.incompatibilidad_en_plena_entrega.result_text: A stubborn file format scrambles two deliverables on Wednesday afternoon, forcing you to rebuy single-month licenses at peak price.
clientes_jungla_suscripciones_saas.choices.migrar_alternativas_sin_cuota.outcomes.migracion_limpia_y_ahorro.result_text: After two days relearning keyboard shortcuts, everything opens smoothly with zero monthly toll—a sweet victory over digital monopolies.
clientes_jungla_suscripciones_saas.choices.pagar_suite_anual_deducible.label: Swallow the full annual renewal and deduct the invoice (540 €)
clientes_jungla_suscripciones_saas.choices.pagar_suite_anual_deducible.result_text: The hit stings your checking account, yet you lose zero minutes migrating files and deduct the entire bill this quarter.
clientes_jungla_suscripciones_saas.choices.podar_planes_al_minimo.label: Prune add-ons and downgrade to the basic storage tier (240 €)
clientes_jungla_suscripciones_saas.choices.podar_planes_al_minimo.result_text: You spend the afternoon purging old backups to fit the storage cap, staunching the bleeding without halting studio work.
clientes_jungla_suscripciones_saas.title: The jungle of auto-renewing software subscriptions
clientes_licitacion_menor_ayuntamiento.body: A town-hall department must award a 3,400 € minor contract by Friday across three quotes. Public bodies never haggle on price—only on how many months e-invoicing approval takes.
clientes_licitacion_menor_ayuntamiento.choices.concursar_ajustando_horas_y_paciencia.label: Bid a sharp 2,950 € and brace for the public-sector payment queue
clientes_licitacion_menor_ayuntamiento.choices.concursar_ajustando_horas_y_paciencia.outcomes.adjudicado_y_pagado_a_sesenta_dias.result_text: You win on technical score and, after three digital stamps on FACe, the invoice queues cleanly for 60-day payout.
clientes_licitacion_menor_ayuntamiento.choices.concursar_ajustando_horas_y_paciencia.outcomes.eras_el_presupuesto_de_acompanamiento.result_text: Too late you realize they just needed two decoy quotes to rubber-stamp their usual vendor. Two afternoons wasted.
clientes_licitacion_menor_ayuntamiento.choices.declinar_expedientes_publicos.label: Politely pass and stick to private clients who pay on delivery
clientes_licitacion_menor_ayuntamiento.choices.declinar_expedientes_publicos.result_text: You skip 18-page tender specs and digital-stamp gymnastics to focus on fast-paying accounts.
clientes_licitacion_menor_ayuntamiento.choices.presentar_dossier_solvente_con_web.label: Submit a crisp technical dossier backed by your live business site
clientes_licitacion_menor_ayuntamiento.choices.presentar_dossier_solvente_con_web.result_text: "Your credentials tower over two filler quotes: you win the award and clear pre-audit on the first pass."
clientes_licitacion_menor_ayuntamiento.title: "Municipal minor tender: solid fee, paid once the comptroller signs"
clientes_licitacion_publica_pliego.body: A public agency posts a 2,850 € contract tailored to your craft, yet the tender demands notarized affidavits, solvency proofs, and three e-invoicing codes like naval coordinates.
clientes_licitacion_publica_pliego.choices.cerrar_pestana_contratacion.label: Close the tender tab before losing your mind in stamps
clientes_licitacion_publica_pliego.choices.cerrar_pestana_contratacion.result_text: Life is too short for nineteenth-century administrative prose. You close the browser and spend the week on private clients.
clientes_licitacion_publica_pliego.choices.presentar_pliego_blindado_elena.label: Have Elena Montes prep ironclad solvency docs and bid safely (320 €)
clientes_licitacion_publica_pliego.choices.presentar_pliego_blindado_elena.result_text: Her legal prep fee stings today, yet your bid sails past the procurement board without a single flaw for a guaranteed payout.
clientes_licitacion_publica_pliego.choices.rellenar_anexos_de_madrugada.label: Wrestle the annexes and portal solo past midnight (90 € fees)
clientes_licitacion_publica_pliego.choices.rellenar_anexos_de_madrugada.outcomes.adjudicacion_heroica.result_text: You survive two last-minute clerical amendment notices and win the contract. Payment takes months, yet every euro is guaranteed.
clientes_licitacion_publica_pliego.choices.rellenar_anexos_de_madrugada.outcomes.excluido_por_anexo_bis.result_text: You're disqualified when they open envelope one because page seventeen of Annex IV-Bis lacked a digital signature. Three nights gone.
clientes_licitacion_publica_pliego.title: Ninety-page public tender specification
clientes_liquidacion_administrador_concursal.body: "Three months on, the court receiver phones: a solvent group is acquiring the bankrupt client's viable division. You can settle with a 35% haircut plus paid handover, or hold out in court."
clientes_liquidacion_administrador_concursal.choices.pactar_quita_rapida_y_traspaso_al_comprador.label: Accept 2,750 € combined settlement and technical handover with the buyer
clientes_liquidacion_administrador_concursal.choices.pactar_quita_rapida_y_traspaso_al_comprador.result_text: You recover most of the scare in hard cash, clear the unpaid balance, and onboard cleanly with the solvent buyer.
clientes_liquidacion_administrador_concursal.choices.rechazar_quita_y_pelear_cien_por_cien.label: Reject the haircut and hold out for 100% recovery in court
clientes_liquidacion_administrador_concursal.choices.rechazar_quita_y_pelear_cien_por_cien.outcomes.cobro_parcial_tras_larga_espera.result_text: Court distribution yields 1,450 € on the euro. You close the book vowing never to let one account dominate again.
clientes_liquidacion_administrador_concursal.choices.rechazar_quita_y_pelear_cien_por_cien.outcomes.comprador_abona_deuda_integra_por_prisa.result_text: Needing your documentation this week to close, the buyer pays 3,800 € in full rather than stall the deal.
clientes_liquidacion_administrador_concursal.title: "The insolvency receiver calls: 'A buyer is acquiring the healthy unit'"
clientes_liquidacion_earn_out_cartera.body: Ninety days after the portfolio handover, the buyer claims two clients left—right after they hiked prices—and tries trimming your 2,400 € second tranche down to 1,100 €.
clientes_liquidacion_earn_out_cartera.choices.cerrar_acuerdo_rapido_y_recuperar_exclientes.label: Take the 1,100 € cleanly and welcome back the churned client at senior rates
clientes_liquidacion_earn_out_cartera.choices.cerrar_acuerdo_rapido_y_recuperar_exclientes.result_text: Since buyer-triggered churn voids non-solicitation, you bank the floor payout plus a boomerang client at double the old fee.
clientes_liquidacion_earn_out_cartera.choices.invocar_clausula_no_alteracion_tarifas.label: Enforce the contract clause barring price hikes during transition
clientes_liquidacion_earn_out_cartera.choices.invocar_clausula_no_alteracion_tarifas.outcomes.acuerdan_punto_intermedio_sin_juicio.result_text: After tense back-and-forth, they wire an immediate 1,850 € compromise settlement.
clientes_liquidacion_earn_out_cartera.choices.invocar_clausula_no_alteracion_tarifas.outcomes.pagan_integros_los_dos_mil_cuatrocientos.result_text: Caught red-handed in writing, they wire the full 2,400 € within 48 hours rather than face commercial court.
clientes_liquidacion_earn_out_cartera.title: "90-day earn-out true-up: 'Two transferred accounts cancelled'"
clientes_maqueta_ia_ochenta_euros.body: "Borja forwards an AI-generated Frankenstein packed with hallucinated facts and broken pieces: '90% of the work is done, I'll give you 80 € to add your pro polish this afternoon'."
clientes_maqueta_ia_ochenta_euros.choices.aceptar_el_remiendo_por_necesidad.label: Wade into the mess billing actual patch-up hours (520 €)
clientes_maqueta_ia_ochenta_euros.choices.aceptar_el_remiendo_por_necesidad.result_text: "Touch one piece and six collapse: you squeeze out 520 € in overtime, yet burn two grim days scrubbing someone else's hallucinations."
clientes_maqueta_ia_ochenta_euros.choices.cobrar_auditoria_de_errores_cerrada.label: Charge 420 € purely for a red-flag audit without touching his file
clientes_maqueta_ia_ochenta_euros.choices.cobrar_auditoria_de_errores_cerrada.result_text: Two hours later you hand over an 18-point teardown and get paid for expert judgment without owning the mess.
clientes_maqueta_ia_ochenta_euros.choices.desearle_suerte_con_su_cunado.label: Congratulate his brother-in-law and state your 1,200 € project floor
clientes_maqueta_ia_ochenta_euros.choices.desearle_suerte_con_su_cunado.outcomes.no_vuelve_y_ganas_paz_mental.result_text: Borja storms off in a huff for the entire quarter. The silence in your WhatsApp is priceless.
clientes_maqueta_ia_ochenta_euros.choices.desearle_suerte_con_su_cunado.outcomes.vuelve_a_las_dos_semanas_humillado.result_text: The contraption implodes in front of his buyers and a chastened Borja crawls back to sign your full rebuild quote.
clientes_maqueta_ia_ochenta_euros.title: "'My brother-in-law mocked it up in ChatGPT—just polish it for 80 €'"
clientes_mecenazgo_proyecto_autor_endless.body: "Nearly a decade after your very first invoice, a well-funded foundation commissions a flagship piece: 4,200 € pre-approved, zero committee meddling, and your name on the cover."
clientes_mecenazgo_proyecto_autor_endless.choices.ejecutar_edicion_sobria_respetando_descanso.label: Deliver a poised 3,100 € edition while guarding your free weekends
clientes_mecenazgo_proyecto_autor_endless.choices.ejecutar_edicion_sobria_respetando_descanso.result_text: "Veteran restraint beats perfectionist overdrive: a gem of a piece ships on Friday noon and the weekend is all yours."
clientes_mecenazgo_proyecto_autor_endless.choices.volcarse_en_obra_de_referencia.label: Take the full 4,200 € commission and invest 250 € in archival craft
clientes_mecenazgo_proyecto_autor_endless.choices.volcarse_en_obra_de_referencia.result_text: "In a rush, you remember why you went solo in the first place: career-best work, prompt payment, and proud authorship."
clientes_mecenazgo_proyecto_autor_endless.title: "Carte blanche and cover credit: the dream brief from Month One"
clientes_moroso_reincidente.body: With an older invoice still unpaid after three excuses about 'a SEPA batch glitch at the bank', Borja pops back up cheerful as ever demanding a brand-new rush job for tomorrow.
clientes_moroso_reincidente.choices.enviar_burofax_y_cortar_relacion.label: Pay for a certified legal notice to collect debt and fire him
clientes_moroso_reincidente.choices.enviar_burofax_y_cortar_relacion.result_text: An official postal stamp works wonders on Borja's selective memory. He settles the overdue balance and never texts you again.
clientes_moroso_reincidente.choices.fiarse_una_ultima_vez.label: Buy the bank excuse one last time and stack a 60-day invoice
clientes_moroso_reincidente.choices.fiarse_una_ultima_vez.result_text: You ship the files fingers crossed while an inner voice reminds you humanity is capable of tripping twice over the exact same Borja.
clientes_moroso_reincidente.choices.retener_archivos_hasta_transferencia.label: Refuse to open a single file until arrears and 100% new land
clientes_moroso_reincidente.choices.retener_archivos_hasta_transferencia.outcomes.milagro_bancario_instantaneo.result_text: "A financial miracle: within twelve minutes 'accounting' unlocks an instant wire transfer complete with PDF receipt."
clientes_moroso_reincidente.choices.retener_archivos_hasta_transferencia.outcomes.se_esfuma_ofendido.result_text: Offended by your 'lack of trust', he vanishes off the map—saving you from a guaranteed second crater.
clientes_moroso_reincidente.title: "Return of the late payer: 'Accounting has your invoice'"
clientes_nda_cuarenta_paginas_microencargo.body: Before revealing a single word about the job, Borja demands you sign a forty-page NDA badly translated from English carrying 50,000 € penalty clauses.
clientes_nda_cuarenta_paginas_microencargo.choices.enviar_tu_propio_acuerdo_razonable.label: Counter with your own sane one-page confidentiality clause
clientes_nda_cuarenta_paginas_microencargo.choices.enviar_tu_propio_acuerdo_razonable.result_text: He signs your sensible template, unveils a completely ordinary local project, and pays cleanly.
clientes_nda_cuarenta_paginas_microencargo.choices.firmar_sin_leer_por_curiosidad.label: Sign the brick blind just to see what's inside the vault
clientes_nda_cuarenta_paginas_microencargo.choices.firmar_sin_leer_por_curiosidad.outcomes.encargo_normalito_pagado.result_text: All that secrecy hid a routine catalog refresh, though at least the invoice gets paid.
clientes_nda_cuarenta_paginas_microencargo.choices.firmar_sin_leer_por_curiosidad.outcomes.presupuesto_ridiculo_y_susto.result_text: Total budget was 150, € and now he waves penalty clauses if you even roll your eyes in public.
clientes_nda_cuarenta_paginas_microencargo.choices.rechazar_firmar_penalizaciones_absurdas.label: Refuse five-figure liability clauses before hearing a budget
clientes_nda_cuarenta_paginas_microencargo.choices.rechazar_firmar_penalizaciones_absurdas.result_text: You save a whole afternoon of disproportionate legal cosplay.
clientes_nda_cuarenta_paginas_microencargo.title: Nuclear-grade NDA for a pocket-change budget
clientes_operacion_salida_julio.body: "Last week of July at thirty-eight degrees: three clients panic at once demanding final files before heading to the coast—even though nobody will open a single attachment until mid-September."
clientes_operacion_salida_julio.choices.aplicar_jornada_intensiva_propia.label: Enforce your own 3 PM summer schedule and skip new rush jobs
clientes_operacion_salida_julio.choices.aplicar_jornada_intensiva_propia.result_text: You taste the revolutionary joy of summer half-days as a freelancer, trading peak cash for sanity.
clientes_operacion_salida_julio.choices.escalonar_entregas_a_septiembre.label: Send clean previews now and schedule final polish for September
clientes_operacion_salida_julio.choices.escalonar_entregas_a_septiembre.result_text: Everyone leaves for the beach happy without you sacrificing sleep over files nobody would read in August.
clientes_operacion_salida_julio.choices.surfear_la_ola_de_julio.label: Crank the AC and bill all three pre-holiday closings
clientes_operacion_salida_julio.choices.surfear_la_ola_de_julio.result_text: You reach August 1st melted into your chair with a splendid cash buffer for the quiet summer stretch.
clientes_operacion_salida_julio.title: "Late-July stampede: everything is urgent before the beach"
clientes_pagare_corporativo_noventa_dias.body: "Right before signing a major corporate order, Marta warns you Treasury doesn't wire funds: they issue a physical 90-day paper IOU you must pick up at reception or discount at your bank."
clientes_pagare_corporativo_noventa_dias.choices.descontar_pagare_en_banco.label: Accept and discount the paper IOU at the bank (180 € fee)
clientes_pagare_corporativo_noventa_dias.choices.descontar_pagare_en_banco.result_text: Your branch manager rubs his hands over the fee, yet cash lands right away and the financing charge is tax-deductible.
clientes_pagare_corporativo_noventa_dias.choices.guardar_pagare_hasta_vencimiento.label: Deliver the order and lock the paper IOU away for 90 days
clientes_pagare_corporativo_noventa_dias.choices.guardar_pagare_hasta_vencimiento.result_text: You guard that stamped slip of paper like a sacred relic, praying funds clear smoothly ninety days from now.
clientes_pagare_corporativo_noventa_dias.choices.rechazar_pedido_con_pagare.label: "Walk away from the order: you accept bank wires only"
clientes_pagare_corporativo_noventa_dias.choices.rechazar_pedido_con_pagare.result_text: You pass on the contract rather than collecting twentieth-century paper IOUs and dodge ninety days of suspense.
clientes_pagare_corporativo_noventa_dias.title: A paper promissory note straight out of 1990
clientes_pago_especie_trueque.body: When it's time to pay for a finished job, Borja admits his account is dry and offers half by wire and half in cases of wine and spa vouchers 'off the books so nobody pays tax'.
clientes_pago_especie_trueque.choices.aceptar_mitad_efectivo_y_cajas.label: Take the off-the-books cash-and-wine deal and stock the pantry
clientes_pago_especie_trueque.choices.aceptar_mitad_efectivo_y_cajas.result_text: Pocket cash and good wine brighten your dinners, alongside sixteen fresh points of undeclared barter risk.
clientes_pago_especie_trueque.choices.exigir_euros_aunque_sea_en_dos_plazos.label: "Refuse the wine: Social Security doesn't take bottles"
clientes_pago_especie_trueque.choices.exigir_euros_aunque_sea_en_dos_plazos.result_text: You lock him into a two-part euro payment plan—half wired today, half documented for next month.
clientes_pago_especie_trueque.choices.perdonar_resto_y_bloquear_numero.label: Write off the unpaid balance and block his number for good
clientes_pago_especie_trueque.choices.perdonar_resto_y_bloquear_numero.result_text: You forfeit the remaining balance in exchange for never hearing another wine-barter pitch again.
clientes_pago_especie_trueque.title: "'Cash is tight, how about twelve cases of Rioja reserve?'"
clientes_pago_sin_factura.body: "Borja appears late Friday with a 'super simple' job due Monday. He winks and lowers his voice: 'Skip the paperwork, I hand you cash on Sunday, and everybody goes home happy'."
clientes_pago_sin_factura.choices.aceptar_sobre_en_b.label: Take the off-the-books envelope and grind all weekend
clientes_pago_sin_factura.choices.aceptar_sobre_en_b.outcomes.cobro_limpio.result_text: Sunday night brings a bakery envelope stuffed with crumpled bills. Instant tax-free liquidity, though every parked white van spikes your pulse.
clientes_pago_sin_factura.choices.aceptar_sobre_en_b.outcomes.regateo_ultima_hora.result_text: "Upon delivery, Borja pulls out just 950 € grinning like a shark: 'Since you save on taxes, we both win'. And you have zero legal recourse."
clientes_pago_sin_factura.choices.declinar_encargo.label: Turn down the mess and rescue your weekend
clientes_pago_sin_factura.choices.declinar_encargo.result_text: You wish him luck finding another volunteer at eight on a Friday night, shut the laptop, and reclaim your Sunday rest.
clientes_pago_sin_factura.choices.exigir_factura_legal.label: Official invoice with VAT and withholding, strictly by the book
clientes_pago_sin_factura.choices.exigir_factura_legal.result_text: Borja sighs as if you'd asked for a kidney, then signs the official quote. You set aside the quarterly tax share and sleep soundly.
clientes_pago_sin_factura.title: "'With VAT, or... shall we sort it out between us?'"
clientes_peritaje_independiente_litigio.body: "Seven-plus years of track record bring a commercial law firm to your door: they offer 3,900 € for an independent technical opinion on a botched corporate rollout."
clientes_peritaje_independiente_litigio.choices.emitir_dictamen_completo_y_ratificacion.label: Accept the full expert report backed by a 3,900 € retainer upfront
clientes_peritaje_independiente_litigio.choices.emitir_dictamen_completo_y_ratificacion.result_text: Your report is so airtight both sides settle before setting foot in court. Clean fee, benchmark authority.
clientes_peritaje_independiente_litigio.choices.limitarse_a_nota_tecnica_sin_juzgado.label: Write an internal 2,100 € technical memo with zero courtroom appearances
clientes_peritaje_independiente_litigio.choices.limitarse_a_nota_tecnica_sin_juzgado.result_text: Two afternoons of calm forensic review pay handsomely without setting foot near a courthouse.
clientes_peritaje_independiente_litigio.choices.publicar_servicio_pericial_en_tu_web.label: Deliver the brief and launch a dedicated forensic-audit page on your site
clientes_peritaje_independiente_litigio.choices.publicar_servicio_pericial_en_tu_web.result_text: "You unlock a dream niche: nobody haggles over day rates when corporate litigation is on the line."
clientes_peritaje_independiente_litigio.title: "Expert witness brief: commercial litigators pay top euro for your gray hair"
clientes_podcast_nicho_invitacion.body: A respected trade podcast with zero guest fee invites you to break down a real project for an hour. There's no appearance check, yet the people signing 3,000 € briefs tune in weekly.
clientes_podcast_nicho_invitacion.choices.acudir_improvisando_anecdotas.label: Join the mic unscripted relying on war stories and honest craft
clientes_podcast_nicho_invitacion.choices.acudir_improvisando_anecdotas.result_text: You come across sharp and relatable; even without a dedicated landing page, a listener DMs you to book Phase 1.
clientes_podcast_nicho_invitacion.choices.declinar_y_priorizar_horas_facturables.label: Politely pass and spend that morning on guaranteed billable work
clientes_podcast_nicho_invitacion.choices.declinar_y_priorizar_horas_facturables.result_text: Zero mic jitters and a focused morning shipping paid deliverables.
clientes_podcast_nicho_invitacion.choices.ir_con_embudo_web_y_casos_listos.label: Prep a standout teardown funneling listeners to your live site and cases
clientes_podcast_nicho_invitacion.choices.ir_con_embudo_web_y_casos_listos.result_text: "The episode lands beautifully and your intake form filters gold: two senior discovery engagements close that same week."
clientes_podcast_nicho_invitacion.title: Guest slot on the niche podcast every industry director listens to
clientes_propuesta_compra_cartera.body: A growing boutique consultancy offers up to 5,200 € across two tranches to acquire six small legacy maintenance clients that fragment your week.
clientes_propuesta_compra_cartera.choices.cobrar_precio_cerrado_menor_al_contado.label: Demand 3,600 € cash on the barrelhead today with zero earn-out strings
clientes_propuesta_compra_cartera.choices.cobrar_precio_cerrado_menor_al_contado.result_text: You trade theoretical upside for guaranteed cash today and zero accounting arguments three months from now.
clientes_propuesta_compra_cartera.choices.conservar_cuentas_fieles_y_subirles_cuota.label: Decline the buyout and gently modernize those loyal retainers yourself
clientes_propuesta_compra_cartera.choices.conservar_cuentas_fieles_y_subirles_cuota.result_text: You refuse to flip early believers; a fair rate refresh keeps every one of them happily on board.
clientes_propuesta_compra_cartera.choices.vender_con_anticipo_firme_y_earn_out.label: Sign the transfer for 2,800 € upfront plus a 90-day retention earn-out
clientes_propuesta_compra_cartera.choices.vender_con_anticipo_firme_y_earn_out.result_text: You sweep away dozens of tiny monthly pings in one stroke, bank tranche one, and schedule the 90-day true-up.
clientes_propuesta_compra_cartera.title: Buyout offer for your tail of legacy maintenance accounts
clientes_propuesta_remota_berlin.body: A German tech firm spots your portfolio and offers a well-paid Phase 1 contract in English. Billing them VAT-free across borders requires valid intra-EU VIES registration on your tax census.
clientes_propuesta_remota_berlin.choices.delegar_revision_fiscal_y_traduccion.label: Pay for translation and tax prep to make the contract airtight
clientes_propuesta_remota_berlin.choices.delegar_revision_fiscal_y_traduccion.result_text: Deductible prep buys you a spotless bilingual contract and VIES setup. Berlin is impressed by your operational polish.
clientes_propuesta_remota_berlin.choices.quedarse_en_mercado_nacional.label: "Decline politely: Spanish tax forms are plenty of excitement"
clientes_propuesta_remota_berlin.choices.quedarse_en_mercado_nacional.result_text: You thank them warmly without adding cross-border tax forms or English calls to your week.
clientes_propuesta_remota_berlin.choices.tramitar_alta_europea_y_firmar.label: File the intra-EU registration and dive in with your English
clientes_propuesta_remota_berlin.choices.tramitar_alta_europea_y_firmar.result_text: You survive the census form and two German-punctual video calls. They wire the exact sum on the due date without haggling a cent.
clientes_propuesta_remota_berlin.title: Remote client in Berlin and intra-EU VAT paperwork
clientes_proyecto_escaparate.body: A high-profile cultural festival invites you to lead its flagship campaign. The fee barely covers costs, yet Borja swears trade-press coverage will put your name on the national map.
clientes_proyecto_escaparate.choices.apostar_por_el_escaparate.label: Go all in to flex creative muscle and win prestige
clientes_proyecto_escaparate.choices.apostar_por_el_escaparate.outcomes.creditos_recortados.result_text: The campaign looks gorgeous, except the press release omits your name entirely and only thanks the beer sponsor.
clientes_proyecto_escaparate.choices.apostar_por_el_escaparate.outcomes.escaparate_real.result_text: "For once in history, the exposure was real: trade outlets credit your work and inquiries arrive from clients with adult budgets."
clientes_proyecto_escaparate.choices.pasar_del_festival.label: Thank them politely and save energy for euro-paying clients
clientes_proyecto_escaparate.choices.pasar_del_festival.result_text: You watch opening night from the couch with zero dark circles and zero regrets.
clientes_proyecto_escaparate.choices.presupuestar_sin_rebaja.label: "Quote standard commercial rates: supermarkets don't take prestige"
clientes_proyecto_escaparate.choices.presupuestar_sin_rebaja.result_text: They trim scope to match what they can actually afford, and you bill a fair job without donating sleepless nights.
clientes_proyecto_escaparate.title: "'Budget is tight, but the whole industry will see you'"
clientes_proyecto_fantasma_anticipo.body: A new client approves your quote in half an hour, wires the deposit, and asks you to block two full weeks on your calendar. They swear the key source materials will land 'tomorrow morning without fail'.
clientes_proyecto_fantasma_anticipo.choices.bloquear_agenda_y_arrancar.label: Block the two weeks, invoice the deposit, and prep the base
clientes_proyecto_fantasma_anticipo.choices.bloquear_agenda_y_arrancar.result_text: You bill the deposit and lay out the entire project scaffolding while awaiting their files. So far, it smells like a dream client.
clientes_proyecto_fantasma_anticipo.choices.declinar_por_agenda_saturada.label: Pass on the job rather than locking two straight weeks
clientes_proyecto_fantasma_anticipo.choices.declinar_por_agenda_saturada.result_text: You avoid mortgaging half a month at once and keep capacity open for existing clients.
clientes_proyecto_fantasma_anticipo.choices.incluir_clausula_caducidad_agenda.label: Sign with an expiry clause if source files arrive late
clientes_proyecto_fantasma_anticipo.choices.incluir_clausula_caducidad_agenda.result_text: "You bank the deposit with ironclad scheduling terms: if they vanish, their slot drops to the back of the queue penalty-free."
clientes_proyecto_fantasma_anticipo.title: Enthusiastic kickoff with a thirty-percent deposit
clientes_reaparicion_urgente_fantasma.body: "Your vanished client rises from the dead on Tuesday at 8 PM as if ten minutes had passed: 'We finally have the files! Since it was nearly done anyway, we can wrap up this Thursday, right?'."
clientes_reaparicion_urgente_fantasma.choices.cobrar_reactivacion_y_resto_contado.label: Charge a reactivation fee plus 100% of the balance upfront
clientes_reaparicion_urgente_fantasma.choices.cobrar_reactivacion_y_resto_contado.result_text: Time travel carries a toll. They wire the full remaining milestone plus surcharge, and you finish it over two intense afternoons.
clientes_reaparicion_urgente_fantasma.choices.entregar_archivos_base_y_despedirse.label: Hand over what the deposit covered and decline the rest
clientes_reaparicion_urgente_fantasma.choices.entregar_archivos_base_y_despedirse.result_text: You send a tidy archive matching their initial deposit and wish them luck. Your peace of mind has a strict no-zombies policy.
clientes_reaparicion_urgente_fantasma.choices.reprogramar_para_proximo_mes.label: Skip the surcharge but schedule it in your next real 30-day slot
clientes_reaparicion_urgente_fantasma.choices.reprogramar_para_proximo_mes.result_text: They drop the panic once they grasp you weren't frozen in amber waiting for them. You finish at a sane pace and bill the rest.
clientes_reaparicion_urgente_fantasma.title: "'Sorry, crazy few months! We need it live by Thursday'"
clientes_recomendacion_excliente_directivo.body: "A manager you worked wonderfully with years ago just joined a solvent company as department director. Her message is music: 'I want to bring you in directly without a three-agency pitch'."
clientes_recomendacion_excliente_directivo.choices.cerrar_proyecto_llave_en_mano.label: Send a sharp proposal and execute her flagship kickoff project
clientes_recomendacion_excliente_directivo.choices.cerrar_proyecto_llave_en_mano.result_text: "Pre-built trust feels like another sport entirely: zero haggling, clear goals, and punctual month-end payment."
clientes_recomendacion_excliente_directivo.choices.posponer_arranque_por_saturacion.label: Thank her over coffee and keep this month's workload light
clientes_recomendacion_excliente_directivo.choices.posponer_arranque_por_saturacion.result_text: You nurture the relationship over a relaxed coffee without overloading your current schedule.
clientes_recomendacion_excliente_directivo.choices.proponer_acuerdo_trimestral_estable.label: Propose a smooth four-month advisory deal for her first quarter
clientes_recomendacion_excliente_directivo.choices.proponer_acuerdo_trimestral_estable.result_text: You back her first hundred days on the job with steady monthly revenue and mutual respect.
clientes_recomendacion_excliente_directivo.title: A former client lands a director role and calls you first
clientes_recorte_presupuesto_renovacion.body: "Contract renewal arrives and Marta drops the bomb in polished corporate-speak: Finance mandates a 20% fee cut across external vendors while expecting the exact same deliverables."
clientes_recorte_presupuesto_renovacion.choices.mantener_precio_aportando_valor_clave.label: Hold full rate by showing what switching vendors would cost
clientes_recorte_presupuesto_renovacion.choices.mantener_precio_aportando_valor_clave.result_text: Onboarding a replacement would cost them triple; Finance backs down and renews at 100%.
clientes_recorte_presupuesto_renovacion.choices.no_renovar_bajo_coste.label: Decline below-market rates and free capacity for healthier clients
clientes_recorte_presupuesto_renovacion.choices.no_renovar_bajo_coste.result_text: You part ways gracefully rather than teaching corporate buyers your rates are made of putty.
clientes_recorte_presupuesto_renovacion.choices.recortar_alcance_en_misma_proporcion.label: Accept 20% less pay only by trimming 20% of the deliverables
clientes_recorte_presupuesto_renovacion.choices.recortar_alcance_en_misma_proporcion.result_text: "Cheerful mathematical symmetry wins the day: smaller bill, smaller scope, identical hourly margin."
clientes_recorte_presupuesto_renovacion.title: "'To renew this year we need a twenty-percent haircut'"
clientes_relevo_generacional_cliente_historico.body: After six years of clockwork payments on the 1st of every month, a family firm's founder retires. His newly minted successor audits every longstanding external freelancer.
clientes_relevo_generacional_cliente_historico.choices.ofrecer_descuento_defensivo_por_miedo.label: Offer a 15% discount for prepaying the quarter upfront (2,550 €)
clientes_relevo_generacional_cliente_historico.choices.ofrecer_descuento_defensivo_por_miedo.result_text: You lock 2,550 € into your bank account today, though the new director senses leverage and piles on weekly status trackers.
clientes_relevo_generacional_cliente_historico.choices.pactar_salida_elegante_y_formacion_relevo.label: Bill 2,150 € for an executive handover workshop and bow out gracefully
clientes_relevo_generacional_cliente_historico.choices.pactar_salida_elegante_y_formacion_relevo.result_text: You exit on a high note before micromanagement starts, banking a clean transition fee.
clientes_relevo_generacional_cliente_historico.choices.presentar_retorno_historico_y_plan_modernizacion.label: Lead with a six-year ROI brief and a 3,100 € modernization roadmap
clientes_relevo_generacional_cliente_historico.choices.presentar_retorno_historico_y_plan_modernizacion.outcomes.divide_cuenta_con_agencia_amiga.result_text: He hands half the budget to a b-school classmate's agency while keeping you on the mission-critical 1,800 € core.
clientes_relevo_generacional_cliente_historico.choices.presentar_retorno_historico_y_plan_modernizacion.outcomes.le_haces_brillar_ante_el_consejo.result_text: You hand him the exact metrics he needed to impress the family board, unlocking an expanded renewal.
clientes_relevo_generacional_cliente_historico.title: The founder who hired you retires—enter the MBA heir with a spreadsheet
clientes_renegociacion_iguala_inflada.body: "Checking your time tracker confirms your gut feeling: a monthly retainer scoped at ten hours now devours nearly thirty thanks to endless 'quick five-minute questions' from Marta's team."
clientes_renegociacion_iguala_inflada.choices.callar_y_seguir_regalando_horas.label: Stay quiet out of fear they might cancel the contract
clientes_renegociacion_iguala_inflada.choices.callar_y_seguir_regalando_horas.result_text: You collect the flat monthly fee without an awkward call while your real hourly rate sinks toward pocket change.
clientes_renegociacion_iguala_inflada.choices.cortar_excesos_con_contador_mensual.label: Share a live hour tracker and pause strictly at hour ten
clientes_renegociacion_iguala_inflada.choices.cortar_excesos_con_contador_mensual.result_text: Every Friday they receive an exact balance of remaining hours—an instant cure for pointless meetings.
clientes_renegociacion_iguala_inflada.choices.presentar_informe_horas_y_actualizar_cuota.label: Present the real time logs and upgrade the retainer fee
clientes_renegociacion_iguala_inflada.choices.presentar_informe_horas_y_actualizar_cuota.outcomes.aceptan_nuevo_tramo.result_text: "Hard numbers leave zero room to argue: they sign the higher tier and you finally bill every hour worked."
clientes_renegociacion_iguala_inflada.choices.presentar_informe_horas_y_actualizar_cuota.outcomes.prefieren_cenirse_a_diez_horas.result_text: Budget stays flat, so they ruthlessly cut extra requests to stay inside ten hours—handing you twenty free hours back.
clientes_renegociacion_iguala_inflada.title: The ten-hour retainer quietly eating twenty-eight
clientes_renovacion_cartera_veterana.body: Five years in, your longest-standing accounts renew together for next semester. Marta leads a lucrative retainer bundle, though your back no longer forgives 60-hour weeks.
clientes_renovacion_cartera_veterana.choices.filtrar_clientes_rentables_senior.label: Drop burnout accounts and renew only the highest-margin tier
clientes_renovacion_cartera_veterana.choices.filtrar_clientes_rentables_senior.result_text: "You pull rank: Sunday callers are let go, leaving a mature, profitable roster compatible with eight hours of sleep."
clientes_renovacion_cartera_veterana.choices.renovar_bloque_completo_intensivo.label: Sign the full bundle and maximize billing another six months
clientes_renovacion_cartera_veterana.choices.renovar_bloque_completo_intensivo.result_text: You lock in formidable monthly cashflow at the price of living glued to your phone and collecting neck spasms.
clientes_renovacion_cartera_veterana.choices.renovar_con_colchon_colaboradores.label: Renew sustainably by paying external backup for peaks (420 €)
clientes_renovacion_cartera_veterana.choices.renovar_con_colchon_colaboradores.result_text: You trim today's margin with deductible freelance backup, keeping historic clients happy without mortgaging your health.
clientes_renovacion_cartera_veterana.title: Block renewal of your old-guard client roster
clientes_renovacion_pagare_tesoreria.body: "Days before the promissory note matures, Marta calls sounding tight-lipped: Finance wants to roll over a slice to window-dress quarterly books, dangling a no-bid add-on job in return."
clientes_renovacion_pagare_tesoreria.choices.aceptar_anexo_compensatorio.label: Accept the accounting rollover in exchange for the signed add-on
clientes_renovacion_pagare_tesoreria.choices.aceptar_anexo_compensatorio.result_text: You flatter their quarterly balance sheet and pocket a lucrative extra commission, ending the week thoroughly drained.
clientes_renovacion_pagare_tesoreria.choices.cerrar_carpeta_sin_mas_pagares.label: Collect what's due, skip the add-on, and ban future paper IOUs
clientes_renovacion_pagare_tesoreria.choices.cerrar_carpeta_sin_mas_pagares.result_text: "You close the file in peace and add a bold line to every quote template: bank wire only."
clientes_renovacion_pagare_tesoreria.choices.invocar_ley_morosidad_firme.label: Cite Spain's Late Payment Act and demand full settlement on time
clientes_renovacion_pagare_tesoreria.choices.invocar_ley_morosidad_firme.outcomes.cobro_seco_y_nevera.result_text: They pay every cent on the due date, though Marta quietly parks your name in procurement's penalty box for a while.
clientes_renovacion_pagare_tesoreria.choices.invocar_ley_morosidad_firme.outcomes.pago_integro_con_intereses.result_text: "Mentioning statutory late-payment interest works wonders: cash materializes in Treasury and they settle with compensation."
clientes_renovacion_pagare_tesoreria.title: Treasury wants to 'reprofile maturity' for quarter-end
clientes_rescate_desastre_generativo.body: "One month later Borja calls on the verge of tears: his nephew's output published fabricated figures to a flagship client and broke their workflow. He begs you to rebuild it from scratch by Monday."
clientes_rescate_desastre_generativo.choices.apagar_fuego_critico_en_semana.label: Rebuild only the critical core during weekday hours at senior rate
clientes_rescate_desastre_generativo.choices.apagar_fuego_critico_en_semana.result_text: You staunch the bleeding across three structured weekdays, bill handsomely, and refuse to sacrifice your weekend.
clientes_rescate_desastre_generativo.choices.aplicar_tarifa_demolicion_doble.label: Charge double 'demolition and rebuild' rate upfront
clientes_rescate_desastre_generativo.choices.aplicar_tarifa_demolicion_doble.result_text: He wires double your original quote without a peep before you open a single folder. Poetic justice tastes magnificent.
clientes_rescate_desastre_generativo.choices.remitirle_al_soporte_del_chatbot.label: Gently suggest asking his nephew for one more prompt
clientes_rescate_desastre_generativo.choices.remitirle_al_soporte_del_chatbot.result_text: You hang up savouring the sweetest silence of the quarter and enjoy an unbothered weekend.
clientes_rescate_desastre_generativo.title: "Live meltdown: the AI deliverable hallucinated everything"
clientes_rescate_sistema_heredado_chantaje.body: A former client who refused maintenance for forty months let an intern wreck your original build. Now he demands a free rebuild today or threatens to trash your name online.
clientes_rescate_sistema_heredado_chantaje.choices.hacer_parche_minimo_pagado_por_horas.label: Restore your archived master for 1,150 € upfront and cut ties forever
clientes_rescate_sistema_heredado_chantaje.choices.hacer_parche_minimo_pagado_por_horas.result_text: Once cash clears, you restore the clean backup in one afternoon along with a final release waiver.
clientes_rescate_sistema_heredado_chantaje.choices.presupuestar_rescate_forense_y_custodia.label: Attach his 4-year-old sign-off plus a 2,600 € emergency rescue quote
clientes_rescate_sistema_heredado_chantaje.choices.presupuestar_rescate_forense_y_custodia.result_text: Faced with timestamped receipts and real downtime, he swallows hard, wires the full rescue fee, and signs ongoing custody.
clientes_rescate_sistema_heredado_chantaje.choices.remitir_a_clausula_fin_garantia_y_bloquear.label: CC his business partner with the expired warranty clause and close thread
clientes_rescate_sistema_heredado_chantaje.choices.remitir_a_clausula_fin_garantia_y_bloquear.result_text: His embarrassed partner shuts the tantrum down immediately and apologizes privately. Zero revenue, royal sleep.
clientes_rescate_sistema_heredado_chantaje.title: "Four-year-old build broken: 'Fix it free under warranty or else'"
clientes_retainer_europeo_consolidado.body: After a smooth European rollout, Berlin offers to make you their go-to external specialist on a five-month retainer. Transfers hit on the first like clockwork, paired with high quality expectations.
clientes_retainer_europeo_consolidado.choices.declinar_fijo_y_quedar_disponible.label: Thank them and stick to occasional standalone projects
clientes_retainer_europeo_consolidado.choices.declinar_fijo_y_quedar_disponible.result_text: You keep the relationship warm without monthly obligations and enjoy a well-earned breather.
clientes_retainer_europeo_consolidado.choices.firmar_asesoria_europea_ligera.label: Agree to a half-capacity advisory retainer to stay sane
clientes_retainer_europeo_consolidado.choices.firmar_asesoria_europea_ligera.result_text: You secure a steady monthly cushion covering fixed studio costs without swallowing your entire workweek.
clientes_retainer_europeo_consolidado.choices.firmar_iguala_europea_completa.label: Sign the full five-month European retainer
clientes_retainer_europeo_consolidado.choices.firmar_iguala_europea_completa.result_text: You lock in five months of punctual Northern European billing. Local peers ask whether Berlin is adopting more freelancers.
clientes_retainer_europeo_consolidado.title: German retainer wired on the first of every month
clientes_reunion_diaria_falso_autonomo.body: Marta issues you a corporate email, books mandatory 9 AM daily standups, and asks you to notify HR before doctor visits—all while paying zero Social Security or holiday pay on your behalf.
clientes_reunion_diaria_falso_autonomo.choices.marcar_autonomia_mercantil_por_escrito.label: Put your B2B schedule independence in writing and bill milestones
clientes_reunion_diaria_falso_autonomo.choices.marcar_autonomia_mercantil_por_escrito.result_text: One mention of independent contractor rules sends HR scrambling to cancel roll call out of labour-audit fear.
clientes_reunion_diaria_falso_autonomo.choices.rescindir_acuerdo_encubierto.label: End the arrangement before they make you clock out for coffee
clientes_reunion_diaria_falso_autonomo.choices.rescindir_acuerdo_encubierto.result_text: You hand back the internal login and reclaim true ownership of your mornings.
clientes_reunion_diaria_falso_autonomo.choices.tragar_horario_por_ingreso_seguro.label: Swallow the office leash without paid holidays for steady cash
clientes_reunion_diaria_falso_autonomo.choices.tragar_horario_por_ingreso_seguro.result_text: You endure the worst of salaried life and freelance taxes combined, though the monthly wire clears.
clientes_reunion_diaria_falso_autonomo.title: Daily 9 AM roll call and disguised-employee vibes
clientes_silencio_radio_mitad_entrega.body: Weeks have passed since that eager kickoff and the client has vanished into thin air. Calls and emails go unanswered, the main milestone sits unbilled, and your calendar has a question-mark-shaped hole.
clientes_silencio_radio_mitad_entrega.choices.congelar_expediente_por_escrito.label: Send a formal hold notice and free up your schedule
clientes_silencio_radio_mitad_entrega.choices.congelar_expediente_por_escrito.result_text: You shelve the files cleanly, note a reactivation fee in writing, and fill the open week with paying work.
clientes_silencio_radio_mitad_entrega.choices.liquidar_fase_hecha_y_cerrar.label: Close the file for good and keep the initial deposit
clientes_silencio_radio_mitad_entrega.choices.liquidar_fase_hecha_y_cerrar.result_text: "You shut the folder without looking back: lower total billing than planned, zero uncertainty hanging overhead."
clientes_silencio_radio_mitad_entrega.choices.perseguir_cada_semana_reservando_hueco.label: Keep chasing them weekly while holding their calendar slot
clientes_silencio_radio_mitad_entrega.choices.perseguir_cada_semana_reservando_hueco.result_text: You burn mornings sending polite follow-ups into the void while turning down smaller gigs just in case they reply today.
clientes_silencio_radio_mitad_entrega.title: Radio silence with the project seventy percent done
clientes_sobrino_experto_prompts.body: "Borja waves off your quote triumphantly: his nineteen-year-old nephew 'already generated the whole thing with AI' and he only wants to pay you 200 € for 'a quick professional polish'."
clientes_sobrino_experto_prompts.choices.cobrar_informe_auditoria_previo.label: Charge a fixed diagnostic fee just to list what's broken
clientes_sobrino_experto_prompts.choices.cobrar_informe_auditoria_previo.result_text: You bill an upfront diagnostic assuming zero liability and hand him twelve pages of hilarious hallucinations.
clientes_sobrino_experto_prompts.choices.desear_suerte_al_sobrino_y_cerrar.label: Congratulate the prodigy nephew and take the afternoon off
clientes_sobrino_experto_prompts.choices.desear_suerte_al_sobrino_y_cerrar.result_text: You archive the thread with zen serenity and go for a walk without touching a line of that experiment.
clientes_sobrino_experto_prompts.choices.mantener_tarifa_sin_tocar_engendro.label: Refuse the 'quick polish' and leave your real quote standing
clientes_sobrino_experto_prompts.choices.mantener_tarifa_sin_tocar_engendro.result_text: You politely explain that untangling automated spaghetti costs more than building it right from scratch. He'll be back.
clientes_sobrino_experto_prompts.title: "'My nephew generated it with a five-minute prompt'"
clientes_subasta_inversa_compras.body: "Marta invites you to Procurement's latest bright idea: a thirty-minute live online bidding war where three freelancers watch a timer and undercut each other on screen to win the contract."
clientes_subasta_inversa_compras.choices.plantar_tarifa_fija_sin_bajar_un_euro.label: Enter your standard rate at minute one and don't touch the mouse
clientes_subasta_inversa_compras.choices.plantar_tarifa_fija_sin_bajar_un_euro.outcomes.el_barato_falla_y_te_llaman.result_text: The lowball winner bails four days later upon reading the real specs, so Marta awards it at your full rate.
clientes_subasta_inversa_compras.choices.plantar_tarifa_fija_sin_bajar_un_euro.outcomes.pierdes_la_puja_con_honra.result_text: Someone reckless wins at half price; you close the browser with your dignity and hourly rate intact.
clientes_subasta_inversa_compras.choices.pujar_a_la_baja_por_volumen.label: Jump in and slash margins to the bone just to win volume
clientes_subasta_inversa_compras.choices.pujar_a_la_baja_por_volumen.result_text: You win by 20 € and spend three grueling weeks working at discount-supermarket margins.
clientes_subasta_inversa_compras.choices.rechazar_participar_en_subastas.label: "Decline the invite: you sell expertise, not wholesale fish"
clientes_subasta_inversa_compras.choices.rechazar_participar_en_subastas.result_text: You politely opt out of race-to-the-bottom auctions and spend the morning on clients who respect craft.
clientes_subasta_inversa_compras.title: Live reverse auction on the vendor portal
clientes_subcontrata_cascada_impago.body: Chasing an overdue invoice reveals Borja's outfit was subcontracted by an agency subcontracted by a larger consultancy. They claim 'pay-when-paid' means you wait until the top of the pyramid settles.
clientes_subcontrata_cascada_impago.choices.aceptar_quita_por_cobro_hoy.label: Take a 20% haircut for instant wire today and sever ties
clientes_subcontrata_cascada_impago.choices.aceptar_quita_por_cobro_hoy.result_text: Losing a fifth stings, yet cash clears today and you vow never to be link four in a chain again.
clientes_subcontrata_cascada_impago.choices.dar_factura_por_incobrable.label: Write off the bad debt today rather than throwing good money after it
clientes_subcontrata_cascada_impago.choices.dar_factura_por_incobrable.result_text: You cross off the invoice through gritted teeth, blacklist pyramid middlemen, and move on.
clientes_subcontrata_cascada_impago.choices.exigir_pago_a_tu_contratante_directo.label: "Send formal notice: your contract is with them, not the pyramid"
clientes_subcontrata_cascada_impago.choices.exigir_pago_a_tu_contratante_directo.result_text: Pointing out their upstream risk isn't legally yours loosens their wallet fast to avoid small-claims court.
clientes_subcontrata_cascada_impago.title: Russian nesting dolls of subcontracting
clientes_subcontrata_equipo_estudio.body: Marta greenlights a 3,600 € three-track rollout and asks for your employee to lead weekly technical check-ins while you oversee high-level strategy.
clientes_subcontrata_equipo_estudio.choices.absorber_tu_las_reuniones_y_exprimir_plazos.label: Hoard every client call yourself and push the studio hard on deadlines
clientes_subcontrata_equipo_estudio.choices.absorber_tu_las_reuniones_y_exprimir_plazos.result_text: You bank the full 3,600 € by acting as a human bottleneck. Delivery holds, though studio morale turns icy.
clientes_subcontrata_equipo_estudio.choices.dar_visibilidad_y_prima_a_tu_empleado.label: Let them co-lead technical syncs backed by a 300 € project bonus
clientes_subcontrata_equipo_estudio.choices.dar_visibilidad_y_prima_a_tu_empleado.result_text: Your hire impresses Marta, you review only key milestones, and for once you feel like you run a real studio.
clientes_subcontrata_equipo_estudio.choices.recortar_alcance_a_dos_frentes_asumibles.label: Negotiate a calmer 2,400 € two-track scope without burning anyone out
clientes_subcontrata_equipo_estudio.choices.recortar_alcance_a_dos_frentes_asumibles.result_text: Marta agrees to phase the third stream later. Healthy revenue, civilized hours, and a calm studio.
clientes_subcontrata_equipo_estudio.title: "Parallel workstreams: Marta wants direct calls with your staffer"
clientes_subida_decada_solo_proyectos_clave.body: "Well past year eight as an autónomo, your annual ledger tells a clear story: your craft is peak-level, yet habit keeps mid-tier jobs clogging your week. Time to double your minimum project floor?"
clientes_subida_decada_solo_proyectos_clave.choices.aplicar_filtro_radical_alto_margen.label: Set a strict 3,500 € project floor and refer everything smaller out
clientes_subida_decada_solo_proyectos_clave.choices.aplicar_filtro_radical_alto_margen.outcomes.efecto_prestigio_inmediato.result_text: "Luxury-pricing physics strikes again: charging like the benchmark makes two executives sign without blinking while your week calms right down."
clientes_subida_decada_solo_proyectos_clave.choices.aplicar_filtro_radical_alto_margen.outcomes.trimestre_selectivo_pero_muy_sano.result_text: Three small quotes walk and one clean flagship lands. Slightly lighter cash this month, ten hours of life back every week.
clientes_subida_decada_solo_proyectos_clave.choices.mantener_mix_prudente_de_cartera.label: Nudge rates up a measured 12% and keep your balanced client mix
clientes_subida_decada_solo_proyectos_clave.choices.mantener_mix_prudente_de_cartera.result_text: "Evolution beats revolution: zero regulars flinch and you close a steady 2,950 € month."
clientes_subida_decada_solo_proyectos_clave.title: "The decade rule: half as many projects at twice the minimum fee"
clientes_subida_tarifa_veterania.body: Six years into freelancing, tiny nitpicky gigs drain energy meant for flagship accounts. Borja turns up haggling over three micro-jobs right while serious clients are waiting for quotes.
clientes_subida_tarifa_veterania.choices.agrupar_menudeo_en_bono_prepago.label: Require prepaid ten-hour blocks upfront for any small requests
clientes_subida_tarifa_veterania.choices.agrupar_menudeo_en_bono_prepago.result_text: "No more tiny administrative invoices: anyone wanting small tasks buys a full prepaid block upfront."
clientes_subida_tarifa_veterania.choices.dejar_pasar_menudeo_y_descansar.label: Turn down Borja's micro-gigs and catch up on rest
clientes_subida_tarifa_veterania.choices.dejar_pasar_menudeo_y_descansar.result_text: You let the loose change walk away guilt-free and spend the week catching up on sleep.
clientes_subida_tarifa_veterania.choices.implantar_ticket_minimo_alto.label: Enforce a strict minimum project fee and drop small-fry work
clientes_subida_tarifa_veterania.choices.implantar_ticket_minimo_alto.outcomes.mes_de_transicion_flojo.result_text: Volume dips slightly during the first transition month, bringing astonishing mental quiet and a spotless studio.
clientes_subida_tarifa_veterania.choices.implantar_ticket_minimo_alto.outcomes.salto_a_clientes_solventes.result_text: Borja flees in horror, and a solvent corporate client immediately fills the open capacity at full margin.
clientes_subida_tarifa_veterania.title: "Year-six filter: minimum project fee or the highway"
clientes_subida_tarifas_ipc.body: Electricity, rent, olive oil, and software licenses have all climbed, yet your rates remain frozen since day one. Time has come to send regulars the dreaded annual rate-update email.
clientes_subida_tarifas_ipc.choices.anunciar_subida_firme.label: Announce a firm +15% adjustment with one month's notice
clientes_subida_tarifas_ipc.choices.anunciar_subida_firme.outcomes.cartera_saneada.result_text: After two theatrical sighs, serious clients accept without blinking and only the loudest penny-pincher walks away.
clientes_subida_tarifas_ipc.choices.anunciar_subida_firme.outcomes.espantada_temporal.result_text: Borja stages a dramatic scene and cancels a couple of minor gigs, leaving a brief dip and wonderfully quiet afternoons.
clientes_subida_tarifas_ipc.choices.borrar_borrador_por_miedo.label: Delete the draft out of fear and swallow inflation another year
clientes_subida_tarifas_ipc.choices.borrar_borrador_por_miedo.result_text: You bill the usual monthly work without complaints, swallowing another year of rising costs yourself.
clientes_subida_tarifas_ipc.choices.subida_simbolica_timida.label: Nudge rates up a token amount while practically apologizing
clientes_subida_tarifas_ipc.choices.subida_simbolica_timida.result_text: Nobody gets upset, though the tiny bump barely covers the hike on your mid-morning café con leche.
clientes_subida_tarifas_ipc.title: Operation raise your rates without dying trying
clientes_version_final_definitiva_ok.body: Nine rounds of corporate micro-edits in, Marta forwards notes from a newly arrived VP asking to revert straight back to the exact concept they killed in version two.
clientes_version_final_definitiva_ok.choices.facturar_bolsa_cambios_adicional.label: Hold version twelve until they sign an extra-hours purchase order
clientes_version_final_definitiva_ok.choices.facturar_bolsa_cambios_adicional.result_text: Showing the signed approval trail makes three departments grumble, then approve a healthy supplemental order.
clientes_version_final_definitiva_ok.choices.plantarse_en_alcance_firmado.label: Deliver the final contracted round and close the ticket
clientes_version_final_definitiva_ok.choices.plantarse_en_alcance_firmado.result_text: You end the infinite loop with polite resolve—zero extra billing, intact sanity.
clientes_version_final_definitiva_ok.choices.rescatar_archivo_antiguo_y_cerrar.label: Pull version two out of your backups and bill final sign-off
clientes_version_final_definitiva_ok.choices.rescatar_archivo_antiguo_y_cerrar.result_text: "Thank goodness you hoard old drafts: twenty minutes later they get their own U-turn back gleaming and you bill closure."
clientes_version_final_definitiva_ok.title: Deliverable_v12_FINAL_for_real_ok
clientes_viernes_urgencia_corporativa.body: "House keys in hand, your phone buzzes non-stop. Marta calls from an airport taxi: executive leadership moved the presentation to Monday at 8:30 AM and wants the entire deliverable rebuilt this weekend."
clientes_viernes_urgencia_corporativa.choices.activar_respuesta_automatica.label: Let your office-hours auto-responder handle it until Monday
clientes_viernes_urgencia_corporativa.choices.activar_respuesta_automatica.result_text: You silence the phone and enjoy Saturday like a free citizen. Marta is frosty on Monday, yet nobody died over a slide deck.
clientes_viernes_urgencia_corporativa.choices.aplicar_tarifa_emergencia_nocturna.label: Accept with a savage weekend-emergency surcharge
clientes_viernes_urgencia_corporativa.choices.aplicar_tarifa_emergencia_nocturna.result_text: You bill like a Swiss surgeon in exchange for zero sunlight until Monday. By 8 AM the file is in her inbox and you look like a raccoon.
clientes_viernes_urgencia_corporativa.choices.repartir_turno_con_empleado.label: Split weekend shifts with your employee plus overtime pay
clientes_viernes_urgencia_corporativa.choices.repartir_turno_con_empleado.result_text: You divide the crunch with military precision, pay generous overtime, and reach Monday with an impeccable file and intact neurons.
clientes_viernes_urgencia_corporativa.title: "Friday, 7:30 PM: 'The board moved it up to Monday'"
clientes_web_corporativa_propia.body: A prospect asks to see your site before approving a 2,100 € quote and finds a dusty 'Under Construction' banner from the month you registered. Time to stay word-of-mouth only or build a proper storefront.
clientes_web_corporativa_propia.choices.encerrarse_finde_plantilla_gratuita.label: Burn the weekend hacking together a zero-budget landing page
clientes_web_corporativa_propia.choices.encerrarse_finde_plantilla_gratuita.result_text: Monday arrives with dark circles and a decent one-pager that passes muster and unlocks a solid chunk of the job.
clientes_web_corporativa_propia.choices.enviar_pdf_provisional_por_correo.label: Email a quick PDF deck and punt the website to another quarter
clientes_web_corporativa_propia.choices.enviar_pdf_provisional_por_correo.result_text: You salvage half the brief with loose samples, though anyone searching outside your phonebook still thinks you don't exist.
clientes_web_corporativa_propia.choices.invertir_en_web_y_casos_estudio.label: Spend 320 € and three afternoons launching a sharp site and case studies
clientes_web_corporativa_propia.choices.invertir_en_web_y_casos_estudio.result_text: You ship a clean domain, starting-rate brackets, and an intake filter. The client signs the full quote without haggling a cent.
clientes_web_corporativa_propia.title: The cobbler's website stuck on 'Coming Soon' for two years
clientes_ya_que_estas.body: "Thirty seconds after receiving the final deliverable, Borja replies: 'Love it! Hey, while you're in there, could you also redo the old section and three versions for my partner? Ten-minute job tops'."
clientes_ya_que_estas.choices.enviar_anexo_presupuestado.label: Smile politely and attach a separate quote for the extras
clientes_ya_que_estas.choices.enviar_anexo_presupuestado.outcomes.firma_refunfunando.result_text: Borja grumbles about 'how nickle-and-diming freelancers got', then signs the add-on because nobody else answers his calls.
clientes_ya_que_estas.choices.enviar_anexo_presupuestado.outcomes.recula_al_ver_euros.result_text: The instant euro signs appear, he miraculously realizes the current version 'was already spot-on'. Twenty unpaid hours saved.
