      deductible_expense: 175
      stress: -7
      moral: 3
      fiscal_risk: -11
      add_modifier:
        id: mod_anexo_defensa_elena
        label: "Cobertura jurídica tributaria"
        remaining_months: 4
        monthly_expense_delta: 30
        monthly_stress_delta: -2
  - id: darse_de_baja_y_volver_a_autogestion
    label: "Rechazar la subida, cerrar contrato y gestionar tú los modelos"
    result_text: "Elena te entrega un pendrive impecablemente indexado con tus libros y vuelves al ruedo solitario de la sede electrónica."
    effects:
      set_gestor:
        tier: self
      stress: 7
      moral: -2
