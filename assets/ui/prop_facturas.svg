<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Pila de carpetas trimestrales y facturas pendientes">
  <!-- Ground Ink Shadow -->
  <ellipse cx="128" cy="226" rx="92" ry="16" fill="#1f2421" opacity="0.22" />
  <ellipse cx="132" cy="228" rx="70" ry="10" fill="#1f2421" opacity="0.14" />

  <!-- Bottom Folder: Manila Carpeta with Bureaucratic Blue Index Tab -->
  <g transform="translate(34, 72) rotate(-7)">
    <!-- Protruding Blue Index Tab -->
    <path d="M 152 18 L 178 18 Q 184 18 184 24 L 184 54 Q 184 60 178 60 L 152 60 Z" fill="#264e7a" stroke="#1f2421" stroke-width="3" stroke-linejoin="round" />
    <line x1="164" y1="28" x2="164" y2="50" stroke="#fffdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <!-- Manila Folder Body -->
    <rect x="0" y="0" width="160" height="142" rx="6" fill="#e9decb" stroke="#1f2421" stroke-width="3.5" />
    <path d="M 4 118 L 156 118 L 156 136 Q 156 140 152 140 L 8 140 Q 4 140 4 136 Z" fill="#dacbb2" />
    <!-- Comic Ink Cross-Hatching on Folder Spine -->
    <path d="M 10 124 L 18 134 M 20 124 L 28 134 M 30 124 L 38 134" stroke="#373f3a" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Middle Folder: Ochre Duplicate Copy + Crimson Urgent Tab -->
  <g transform="translate(50, 56) rotate(5)">
    <!-- Protruding Stamp-Red Urgent Tab -->
    <path d="M 150 36 L 179 36 Q 185 36 185 42 L 185 72 Q 185 78 179 78 L 150 78 Z" fill="#b42b24" stroke="#1f2421" stroke-width="3" stroke-linejoin="round" />
    <!-- Wordless Exclamation Symbol on Tab -->
    <line x1="169" y1="45" x2="169" y2="59" stroke="#fffdf8" stroke-width="3.2" stroke-linecap="round" />
    <circle cx="169" cy="67" r="2.2" fill="#fffdf8" />
    <!-- Folder Sheet -->
    <rect x="0" y="0" width="158" height="146" rx="6" fill="#f7d98c" stroke="#1f2421" stroke-width="3.5" />
    <rect x="8" y="8" width="142" height="130" rx="3" fill="#efe4ce" stroke="#1f2421" stroke-width="1.8" />
    <!-- Pink Carbon Edge Peeking Out Left -->
    <path d="M -6 22 L 0 22 L 0 124 L -6 124 Q -10 124 -10 120 L -10 26 Q -10 22 -6 22 Z" fill="#e6a8a1" stroke="#1f2421" stroke-width="2.6" />
  </g>

  <!-- Top Sheet: Wordless Official Quarterly Ledger Dossier -->
  <g transform="translate(44, 30) rotate(-2)">
    <!-- Hard Offset Ink Drop Shadow -->
    <rect x="5" y="6" width="160" height="174" rx="7" fill="#1f2421" opacity="0.28" />
    <!-- Primary Cream Paper Card -->
    <rect x="0" y="0" width="160" height="174" rx="7" fill="#fffdf8" stroke="#1f2421" stroke-width="3.8" />
    <!-- Subtle Warm Gouache Wash Along Right & Bottom Margin -->
    <path d="M 142 6 L 154 6 Q 157 6 157 10 L 157 166 Q 157 170 152 170 L 12 170 L 12 158 L 142 158 Z" fill="#f6efe0" />

    <!-- Official Crimson & Navy Header Strip (Wordless) -->
    <rect x="14" y="16" width="132" height="24" rx="3" fill="#b42b24" stroke="#1f2421" stroke-width="2.5" />
    <rect x="14" y="16" width="32" height="24" rx="3" fill="#264e7a" stroke="#1f2421" stroke-width="2.5" />
    <!-- Geometric Emblem Inside Navy Box -->
    <circle cx="30" cy="28" r="6" fill="none" stroke="#fffdf8" stroke-width="2.2" />
    <line x1="56" y1="24" x2="132" y2="24" stroke="#fffdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="56" y1="32" x2="108" y2="32" stroke="#f6efe0" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

    <!-- Ruled Shorthand Subheader Lines -->
    <line x1="16" y1="52" x2="88" y2="52" stroke="#373f3a" stroke-width="2.6" stroke-linecap="round" />
    <line x1="102" y1="52" x2="144" y2="52" stroke="#8f510d" stroke-width="2.6" stroke-linecap="round" />

    <!-- Ledger Row 1 -->
    <rect x="14" y="62" width="132" height="22" rx="2.5" fill="#f6efe0" stroke="#1f2421" stroke-width="2" />
    <line x1="98" y1="62" x2="98" y2="84" stroke="#1f2421" stroke-width="2" />
    <path d="M 22 73 Q 34 69 46 73 T 72 73" fill="none" stroke="#373f3a" stroke-width="2.4" stroke-linecap="round" />
    <line x1="106" y1="73" x2="136" y2="73" stroke="#1f5c53" stroke-width="3.2" stroke-linecap="round" />

    <!-- Ledger Row 2 -->
    <rect x="14" y="90" width="132" height="22" rx="2.5" fill="#f6efe0" stroke="#1f2421" stroke-width="2" />
    <line x1="98" y1="90" x2="98" y2="112" stroke="#1f2421" stroke-width="2" />
    <path d="M 22 101 Q 36 97 50 101 T 82 101" fill="none" stroke="#373f3a" stroke-width="2.4" stroke-linecap="round" />
    <line x1="106" y1="101" x2="138" y2="101" stroke="#b42b24" stroke-width="3.2" stroke-linecap="round" />

    <!-- Highlighted Quarterly Liability Total Box -->
    <rect x="14" y="120" width="132" height="36" rx="3.5" fill="#f7d98c" stroke="#1f2421" stroke-width="2.5" />
    <line x1="24" y1="133" x2="74" y2="133" stroke="#1f2421" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="143" x2="60" y2="143" stroke="#8f510d" stroke-width="2.4" stroke-linecap="round" />

    <!-- Hand-Inked Vector Euro Symbol (100% Graphic Paths) -->
    <path d="M 122 129 C 113 127 106 132 106 138 C 106 144 113 149 122 147" fill="none" stroke="#b42b24" stroke-width="3.4" stroke-linecap="round" />
    <line x1="102" y1="135" x2="118" y2="135" stroke="#b42b24" stroke-width="2.6" stroke-linecap="round" />
    <line x1="102" y1="141" x2="117" y2="141" stroke="#b42b24" stroke-width="2.6" stroke-linecap="round" />

    <!-- Circular Rubber Stamp Ring Accent -->
    <circle cx="134" cy="138" r="7" fill="none" stroke="#b42b24" stroke-width="2.2" stroke-dasharray="9 3" />

    <!-- Steel Paperclip at Top-Left -->
    <path d="M 28 -8 L 28 24 A 8 8 0 0 0 44 24 L 44 2 A 4.5 4.5 0 0 0 35 2 L 35 20" fill="none" stroke="#1f2421" stroke-width="5.2" stroke-linecap="round" />
    <path d="M 28 -8 L 28 24 A 8 8 0 0 0 44 24 L 44 2 A 4.5 4.5 0 0 0 35 2 L 35 20" fill="none" stroke="#efe4ce" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
