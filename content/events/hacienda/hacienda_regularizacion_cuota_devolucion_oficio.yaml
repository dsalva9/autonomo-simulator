schema_version: 1
id: hacienda_regularizacion_cuota_devolucion_oficio
category: hacienda
title: Regularización por ingresos reales a tu favor
body: "Sorpresa mayúscula al cruzar rendimientos netos con Tesorería: el año pasado sobrecotizaste respecto a tu tramo real y te ofrecen devolver la diferencia o consolidar esa base superior."
tags:
  - reta
  - cuota_autonomos
  - devolucion
character_id: null
illustration_id: null
requirements:
  min_month: 16
  months_of_year:
    - 3
    - 4
    - 10
    - 11
weight: 11
cooldown_months: 14
max_occurrences: 3
exclusive_with:
  - hacienda_regularizacion_reta
  - hacienda_regularizacion_tramo_alto_reta
  - gestor_reajuste_tramos_cotizacion
choices:
  - id: cobrar_devolucion_de_oficio_en_banco
    label: Aceptar el abono de oficio y reforzar tu liquidez hoy
    result_text: El ingreso entra limpio en tu cuenta antes de fin de mes como un oasis en mitad del desierto burocrático.
    effects:
      cash_delta: 490
      stress: -6
      moral: 6
  - id: mantener_base_superior_para_prestaciones
    label: Renunciar al reembolso y consolidar mejor base futura
    result_text: Blindas una cobertura mayor ante bajas y jubilación sintiendo por una vez cierta tranquilidad estructural.
    effects:
      stress: -3
      moral: 5
      personal_life: 4
      add_modifier:
        id: mod_base_cotizacion_consolidada
        label: Cobertura profesional reforzada
        remaining_months: 4
        monthly_moral_delta: 2
  - id: cobrar_y_ajustar_nuevo_tramo_con_gestor
    label: Cobrar la devolución y recalibrar tramo actual con gestoría
    requirements:
      gestor_tiers:
        - cheap
        - premium
    result_text: Recuperas el exceso abonado y dejas la cuota de este año clavada a tu previsión real de facturación.
    effects:
      deductible_expense: 75
      cash_delta: 455
      stress: -7
      moral: 6
      fiscal_risk: -4
