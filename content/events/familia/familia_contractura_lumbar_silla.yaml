schema_version: 1
id: familia_contractura_lumbar_silla
category: familia
title: "Crujido lumbar tras diez horas en la silla barata"
body: "Te agachas a enchufar el cargador y un latigazo en las lumbares te deja clavado mirando el rodapié durante dos minutos eternos. La silla heredada del comedor ha dictado sentencia contra tu columna vertebral en plena semana de cierre."
tags:
