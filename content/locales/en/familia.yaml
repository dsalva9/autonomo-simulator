"familia_verano_pueblo_sin_wifi.choices.videollamada_al_sol_en_la_plaza.outcomes.encanto_rural_simpatico.result_text": "The baker's van honks mid-slide deck, yet the client is charmed by your 'authentic countryside studio.'"
"familia_verano_pueblo_sin_wifi.choices.videollamada_al_sol_en_la_plaza.outcomes.corte_en_minuto_clave.result_text": "Your video freezes mid-grimace and your laptop overheats in the sun before the proposal finishes uploading."

# 40. familia_visita_sorpresa_tuppers
"familia_visita_sorpresa_tuppers.title": "An Eleven AM Buzzer and Six Tuppers of Lentil Stew"
"familia_visita_sorpresa_tuppers.body": "Your intercom buzzes unannounced at eleven on a Tuesday: your parents were in the neighborhood bearing grocery bags, homemade croquettes, and an urgent inspection of both your fridge and your dark circles."
